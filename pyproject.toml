[project]
name = "er"
version = "0.1.0"
description = "Entity matching and resolution pipeline: candidates → matching → resolution → evaluation"
requires-python = ">=3.12"

[project.scripts]
nayose = "er.cli:main"  # the command line: nayose VERB NOUN …

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["er"]
package-data = { er = ["ui.html"] }  # the page nayose open ui serves

[tool.ruff.lint]
select = ["F", "B904", "UP017", "TID251"]  # names unused or never defined; an error re-raised without its cause; datetime.UTC; the calls banned below

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas.read_parquet".msg = "use er.io.read_parquet: Arrow opens the file, so the command can't hang at exit"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TID251"]  # a test's own process; the commands it starts read through er.io
"notebooks/*" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # this checkout's er, whichever one the venv was installed from
addopts = "-ra --strict-markers --durations=10"
faulthandler_timeout = 300  # a test still running after 5 minutes prints every thread's stack: a hang says where it is
markers = ["slow: runs whole pipelines on a generated population (marked by its fixture, tests/conftest.py)",
           "browser: the page in Chromium (marked by the ui_page fixture)"]
