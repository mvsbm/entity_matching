[project]
name = "nayose"
version = "0.1.0"
description = "Entity resolution as BigQuery SQL (python -m nayose): candidates, Fellegi–Sunter scoring, people's decisions; DuckDB locally"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nayose*", "design*"]  # design: the generator and the evaluation, local only, never run by a production job

[tool.setuptools.package-data]
"nayose" = ["*.js", "*.toml", "*.sql", "sql/*.sql"]  # the method (sql/), its values and mapping, the comparison functions in JavaScript

[tool.ruff]
line-length = 120  # CONTRIBUTING.md rule 9, held for the prod code (nayose/, deploy/): see per-file-ignores

[tool.ruff.lint]
# names unused or never defined; an error re-raised without its cause; datetime.UTC; the calls banned below; long lines;
# a function with more than 10 paths through it (McCabe's limit)
select = ["F", "B904", "UP017", "TID251", "E501", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10  # CONTRIBUTING.md rule 9, held for the prod code

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas.read_parquet".msg = "use pyarrow.parquet.read_table(...).to_pandas(): Arrow opens the file, so a job can't hang at exit"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TID251", "E501", "C901"]  # a test's own process, which exits by itself; not prod code
"scripts/*" = ["E501", "C901"]  # design time: not prod code
"design/*" = ["E501", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # this checkout's nayose, whichever one the venv was installed from
addopts = "-ra --strict-markers --durations=10"
faulthandler_timeout = 300  # a test still running after 5 minutes prints every thread's stack: a hang says where it is
