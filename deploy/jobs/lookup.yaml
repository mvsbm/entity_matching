# One record looked up in runs/main's index; the answer in the execution's log. An execution names the record (--args).
# `gcloud run jobs replace` reads it once Jenkins fills ${…} (deploy/Jenkinsfile); an execution may give other arguments
# (--args), never other code.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: nayose-lookup
  labels: {app: nayose}
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: ${SERVICE_ACCOUNT}
          timeoutSeconds: 3600
          maxRetries: 0
          volumes:
            - name: bucket
              csi: {driver: gcsfuse.run.googleapis.com, volumeAttributes: {bucketName: "${BUCKET}"}}
          containers:
            - image: ${IMAGE}
              args: ["runs/main", "lookup", "--record", "RECORD_ID"]
              resources: {limits: {cpu: "2", memory: 8Gi}}
              volumeMounts: [{name: bucket, mountPath: /gcs}]
