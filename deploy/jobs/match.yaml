# A match run on runs/main: every pair at the threshold an execution gives (--args), as a table in the bucket's
# runs/main/matched/, for people to decide on. `gcloud run jobs replace` reads it once Jenkins fills ${…} (deploy/Jenkinsfile);
# an execution may give other arguments (--args), never other code.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: nayose-match
  labels: {app: nayose}
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: ${SERVICE_ACCOUNT}
          timeoutSeconds: 3600
          maxRetries: 0
          volumes:
            - name: bucket
              csi: {driver: gcsfuse.run.googleapis.com, volumeAttributes: {bucketName: "${BUCKET}"}}
          containers:
            - image: ${IMAGE}
              args: ["runs/main", "match", "--threshold", "8"]
              resources: {limits: {cpu: "2", memory: 8Gi}}
              volumeMounts: [{name: bucket, mountPath: /gcs}]
