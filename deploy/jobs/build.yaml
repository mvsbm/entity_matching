# The full run: the records in the bucket's in/records.parquet, resolved into a new version of runs/main.
# `gcloud run jobs replace` reads it once Jenkins fills ${…} (deploy/Jenkinsfile); an execution may give other
# arguments (--args), never other code. deploy/runner.py runs it on runs/main's current version (docs/operations.md).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: nayose-build
  labels: {app: nayose}
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: ${SERVICE_ACCOUNT}
          timeoutSeconds: 86400
          maxRetries: 0
          volumes:
            - name: bucket
              csi: {driver: gcsfuse.run.googleapis.com, volumeAttributes: {bucketName: "${BUCKET}", mountOptions: "implicit-dirs,uid=10001,gid=10001"}}  # the image's user owns what it writes
            - name: settings
              secret: {secretName: "${SETTINGS_SECRET}", items: [{key: latest, path: settings.toml}]}
          containers:
            - image: ${IMAGE}
              args: ["runs/main", "build", "/gcs/in/records.parquet", "--overwrite"]
              env:
                - {name: BUCKET, value: "${BUCKET}"}
                - {name: ER_SETTINGS, value: /secrets/settings/settings.toml}
              resources: {limits: {cpu: "8", memory: 32Gi}}
              volumeMounts:
                - {name: bucket, mountPath: /gcs}
                - {name: settings, mountPath: /secrets/settings, readOnly: true}
