# Where data lives, which datasets exist, which of a file's columns hold which field, and the language-specific
# normalization. Loaded and validated by er.settings.load_settings(). Paths are relative to the project root (the
# folder with pyproject.toml). The matching itself is config/pipeline.toml, written in the field names of [columns].

[paths]
reference = "data/reference"                     # tracked: frozen public reference data for the generator and the name model (SOURCES.md)
bronze = "data/medallion/bronze"                 # <dataset>.parquet: records as they arrive (generated), the pipeline input
gold = "data/medallion/gold"                     # <dataset>/: each dataset resolved, a workspace; its state/records/ is the silver layer
labels = "data/labels"                           # <dataset>.parquet: truth, read only to choose and evaluate
artifacts = "data/artifacts"                     # what the scripts keep for themselves: models, experiments, benchmark, demo
experiments = "data/artifacts/experiments"       # leaderboard.parquet
models = "data/artifacts/models"                 # trained Splink models
optuna = "data/artifacts/optuna"                 # Optuna studies (SQLite), read by optuna-dashboard

[datasets]
all = ["train", "val", "test"]                   # one generated population, split by entity: fit / select / report
synthetic = true                                 # the demo prints records: scripts/export_pdfs.py exports it only while this is true

# DuckDB, the columnar engine: past memory_limit it spills to temp_directory, so a file of any size runs in bounded
# memory. Empty values keep DuckDB's defaults (all cores; 80% of RAM; a temporary folder).
[compute]
threads = ""
memory_limit = ""
temp_directory = ""

[locale]                                         # the language-specific normalization
# kana folding, character by character: voiced → unvoiced, small → large, ヴ/ヂ/ヅ/ヲ, ー → ウ
kana_fold_from = "ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴァィゥェォッャュョヮヵヶヲー"
kana_fold_to   = "カキクケコサシスセソタチツテトハヒフヘホハヒフヘホフアイウエオツヤユヨワカケオウ"
# Legal forms, after NFKC (half-width and full-width forms fold into these; ㈱ and （株） become (株)). legal_forms are
# removed wherever they stand: each form in kanji, its reading (also as banks write it, small kana large:
# カブシキガイシヤ), the bank abbreviation in the middle of a name, (カ), and the forms of the generator. legal_front stand first, カ)〇〇; legal_end stand last, 〇〇(カ.
# The bank abbreviations and where each may stand: the Zengin list as banks publish it.
legal_forms = ["株式会社", "有限会社", "合同会社", "合資会社", "合名会社", "相互会社", "医療法人社団", "医療法人財団", "医療法人",
               "一般社団法人", "公益社団法人", "一般財団法人", "公益財団法人", "特定非営利活動法人", "社会福祉法人", "学校法人", "宗教法人",
               "(株)", "(有)", "(同)", "(資)", "(名)",
               "カブシキガイシャ", "ユウゲンガイシャ", "ゴウドウガイシャ", "ゴウシガイシャ", "ゴウメイガイシャ", "ソウゴガイシャ",
               "イリョウホウジンシャダン", "イリョウホウジンザイダン", "イリョウホウジン", "イッパンザイダンホウジン", "コウエキザイダンホウジン",
               "イッパンシャダンホウジン", "コウエキシャダンホウジン", "シュウキョウホウジン", "ガッコウホウジン", "シャカイフクシホウジン",
               "コウセイホゴホウジン", "トクテイヒエイリカツドウホウジン", "ドクリツギョウセイホウジン", "ベンゴシホウジン",
               "ギョウセイショシホウジン", "シホウショシホウジン", "ゼイリシホウジン", "ユウゲンセキニンチュウカンホウジン",
               "ムゲンセキニンチュウカンホウジン", "コクリツダイガクホウジン", "コウリツダイガクホウジン", "ノウジクミアイホウジン",
               "カンリクミアイホウジン", "シャカイホケンロウムシホウジン", "コクリツケンキュウカイハツホウジン",
               "(カ)", "(ユ)", "(メ)", "(シ)", "(ド)", "(ソ)", "(ホゴ)", "(ギヨ)", "(シホウ)", "(ゼイ)", "(ダイ)", "(ノウ)", "(ケン)",
               "カ)", "ユ)"]
legal_front = ["カ", "ユ", "メ", "シ", "ド", "ソ", "イ", "ザイ", "シヤ", "シユウ", "ガク", "フク", "ホゴ", "トクヒ", "ドク", "ベン",
               "ギヨ", "シホウ", "ゼイ", "チユウ", "ダイ", "ノウ", "ケン"]
legal_end = ["カ", "ユ", "メ", "シ", "ド", "ソ", "イ", "ギヨ", "シホウ", "ゼイ", "ダイ", "ノウ", "カンリ", "ロウム"]
prefectures = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県",
  "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県",
  "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県",
  "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
]
address_replacements = [['(\d+)丁目', '\1-'], ['(\d+)番地?', '\1-'], ['(\d+)号', '\1']]  # regex → replacement, after NFKC
address_cut_at = " "                             # drop the building / room after the first space past the street number

# Named normalization chains, used by config/pipeline.toml (steps: er.config.Normalizer)
[locale.chains]
fold = ["kana_fold"]
company = ["nfkc", "strip_legal_form", "kana_fold"]
address = ["address"]
reversed = ["kana_fold", "reverse"]
initial = ["initial"]
first3 = ["first3"]
address_first3 = ["address", "first3"]

# What each field's values look like (RE2, matched against a sample of the file). Used to suggest a column for a field
# no column is mapped to, a suggestion never applied without you, and for each field's "looks right" share (--check, qa.md). RE2's \s doesn't match the full-width space.
[locale.detect]
full_name = '^[ァ-ヴー・ｦ-ﾟ\s　]+$'
person_name = '^[ァ-ヴー・ｦ-ﾟ\s　]+$'
given_name = '^[ァ-ヴーｦ-ﾟ]{1,12}$'
# company_name: built from the legal forms above (er.standardize.legal_pattern), so the check and the run read one table
any_name = '^[ァ-ヴー・ｦ-ﾟ\s　()（）]+$'
address = '[都道府県市区町村].*[0-9０-９]'
address_code = '^[0-9]{5,}$'
postal_code = '^〒?[0-9０-９]{3}[-－]?[0-9０-９]{4}$'
prefecture = '^(北海道|東京都|京都府|大阪府|.{2,3}県)$'
town_code = '^[0-9]{11}$'
city = '[市区町村郡]$'
phone = '^[0-9]{4}$'
customer_id = '^[0-9]{8,}$'
birth_date = '^((19|20)?[0-9]{2})[-/.]?[01][0-9][-/.]?[0-3][0-9]$'   # 1993-05-25, 19930525, 93-05-25, 1993/05/25

# Which of the file's columns hold each field. The pipeline reads fields only, never a file's column names.
# A string is one column. A list of lists gives fallbacks: the first whose columns are all filled wins, concatenated.
# A table adds a normalization, applied once when the field is built. config/pipeline.toml [fields] says which
# fields a run needs and which it can do without. `id` and `entity` name single columns and are used as they are.
[columns]
id = "CONT_ID"
entity = "ENTITY_ID"                               # the truth, in labels/: read only by labelled runs
full_name = { sources = [["FULL_NAME_KANA"]], normalize = ["nfkc", "katakana", "strip_spaces"] }   # half-width, hiragana or spaced: the same name
person_name = { sources = [["FULL_NAME_KANA"], ["O_PERSON_NAME_KANA"], ["LAST_NAME_KANA", "GIVEN_NAME_KANA"]], normalize = ["nfkc", "katakana", "strip_spaces"] }
given_name = { sources = [["GIVEN_NAME_KANA"]], normalize = ["nfkc", "katakana", "strip_spaces"] }
company_name = { sources = [["NYS_CNV_P_NAME_KANA"]], normalize = ["nfkc", "katakana", "strip_spaces"] }
any_name = { sources = [["FULL_NAME_KANA"], ["O_PERSON_NAME_KANA"], ["LAST_NAME_KANA", "GIVEN_NAME_KANA"], ["NYS_CNV_P_NAME_KANA"]], normalize = ["strip_spaces", "nfkc", "katakana", "strip_legal_form", "kana_fold"] }   # person or company
address = [["STD_ADDRESS"], ["ORIGINAL_ADDRESS"]]
address_code = "SOURCE_ADDR_CD"
postal_code = { sources = [["POST_CD"], ["POST_CD_KANA"]], normalize = ["nfkc", "strip_separators"] }   # 100-0001 or full-width: the same code
prefecture = "ADDRESS_ONE"
town_code = "ADDR_CD"                               # municipality + town + chome (住所コード)
city = "ADDRESS_TWO"
phone = { sources = [["PHONE_NUM_4"]], normalize = ["nfkc", "strip_separators"] }
customer_id = { sources = [["CIF_ID"]], normalize = ["nfkc", "strip_separators"] }   # the ID the CIF system assigns
birth_date = { sources = [["BIRTH_DATE"]], normalize = ["nfkc", "strip_separators"] }   # one order throughout (YYYYMMDD here): 1993-05-25 and 19930525 alike
kind_flag = "PERSON_ORG_CODE"                      # the file's own person/company flag, if it has one; values in [kind]
# One column holding every name, a person's or a company's? Give full_name, person_name, company_name and any_name
# that column, and add kind = "person" to full_name and person_name, kind = "company" to company_name: each record's
# name then goes to the side its kind leans to (er.kind), e.g.
#   person_name = { sources = [["NAME_KANA"]], normalize = ["nfkc", "strip_spaces"], kind = "person" }

[kind]
flag_company = ["2"]                               # the values of kind_flag that say company; any other value says person

# How a records file is read, before anything else (er.intake): a CSV, TSV or Parquet, each value decoded on its own.
# A value is read in the one of these encodings that decodes it strictly (UTF-8 that does is UTF-8); one several read
# is read in its column's. A value written as one of `nulls` is missing. A guess (a row re-split where its fields don't
# line up, a garbled value decoded back, a value another encoding reads better) is proposed, never applied, until
# people accept its kind (nayose accept repairs); only one that reads at least e^margin likelier: margin_text per
# character of a value, margin_row for a whole row. A row with more than max_extra fields too many stays unread.
[input]
encodings = ["utf-8", "cp932", "euc-jp"]
nulls = ["NULL", "null", "Null", "\\N", "NaN", "nan", "None", "none", "N/A", "n/a", "#N/A", "-", "－"]
margin_text = 0.75
margin_row = 4.6
max_extra = 3
