# Where data lives, which datasets exist, which of a file's columns hold which field, and the language-specific
# normalization. Loaded and validated by er.settings.load_settings(). Paths are relative to the project root (the
# folder with pyproject.toml). The matching itself is config/pipeline.toml, written in the field names of [columns].

[paths]
reference = "data/reference"                     # tracked: the synthetic generator's frozen public reference data (SOURCES.md)
bronze = "data/medallion/bronze"                 # <dataset>.parquet: records as they arrive (generated), the pipeline input
gold = "data/medallion/gold"                     # <dataset>/: each dataset resolved, a run folder; its state/records/ is the silver layer
labels = "data/labels"                           # <dataset>.parquet: truth, read only to choose and evaluate
artifacts = "data/artifacts"                     # what the scripts keep for themselves: models, experiments, benchmark, demo
experiments = "data/artifacts/experiments"       # leaderboard.parquet
models = "data/artifacts/models"                 # trained Splink models
optuna = "data/artifacts/optuna"                 # Optuna studies (SQLite), read by optuna-dashboard

[datasets]
all = ["train", "val", "test"]                   # one generated population, split by entity: fit / select / report
synthetic = true                                 # the demo prints records: scripts/export_pdfs.py exports it only while this is true

# DuckDB, the columnar engine: past memory_limit it spills to temp_directory, so a file of any size runs in bounded
# memory. Empty values keep DuckDB's defaults (all cores; 80% of RAM; a temporary folder).
[compute]
threads = ""
memory_limit = ""
temp_directory = ""

[locale]                                         # the language-specific normalization
# kana folding, character by character: voiced → unvoiced, small → large, ヴ/ヂ/ヅ/ヲ, ー → ウ
kana_fold_from = "ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴァィゥェォッャュョヮヵヶヲー"
kana_fold_to   = "カキクケコサシスセソタチツテトハヒフヘホハヒフヘホフアイウエオツヤユヨワカケオウ"
legal_forms = ["カブシキガイシャ", "ユウゲンガイシャ", "ゴウドウガイシャ", "(カ)", "(ユ)", "カ)", "ユ)"]   # after NFKC: half-width and full-width forms fold into these
prefectures = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県",
  "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県",
  "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県",
  "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
]
address_replacements = [['(\d+)丁目', '\1-'], ['(\d+)番地?', '\1-'], ['(\d+)号', '\1']]  # regex → replacement, after NFKC
address_cut_at = " "                             # drop the building / room after the first space

# Named normalization chains, used by config/pipeline.toml (steps: er.config.Normalizer)
[locale.chains]
fold = ["kana_fold"]
company = ["nfkc", "strip_legal_form", "kana_fold"]
address = ["address"]
reversed = ["kana_fold", "reverse"]
initial = ["initial"]
first3 = ["first3"]
address_first3 = ["address", "first3"]

# What each field's values look like (RE2, matched against a sample of the file). Used only to suggest a column for a
# field no column is mapped to; a suggestion is never applied without you. RE2's \s doesn't match the full-width space.
[locale.detect]
full_name = '^[ァ-ヴー・ｦ-ﾟ\s　]+$'
person_name = '^[ァ-ヴー・ｦ-ﾟ\s　]+$'
given_name = '^[ァ-ヴーｦ-ﾟ]{1,12}$'
company_name = 'カブシキガイシャ|ユウゲンガイシャ|ゴウドウガイシャ|株式会社|有限会社|合同会社'
any_name = '^[ァ-ヴー・ｦ-ﾟ\s　()（）]+$'
address = '[都道府県市区町村].*[0-9０-９]'
address_code = '^[0-9]{5,}$'
postal_code = '^〒?[0-9０-９]{3}[-－]?[0-9０-９]{4}$'
prefecture = '^(北海道|東京都|京都府|大阪府|.{2,3}県)$'
town_code = '^[0-9]{11}$'
city = '[市区町村郡]$'
phone = '^[0-9]{4}$'
customer_id = '^[0-9]{8,}$'
birth_date = '^(19|20)[0-9]{2}-?[01][0-9]-?[0-3][0-9]$'

# Which of the file's columns hold each field. The pipeline reads fields only, never a file's column names.
# A string is one column. A list of lists gives fallbacks: the first whose columns are all filled wins, concatenated.
# A table adds a normalization, applied once when the field is built. config/pipeline.toml [fields] says which
# fields a run needs and which it can do without. `id` and `entity` name single columns and are used as they are.
[columns]
id = "CONT_ID"
entity = "ENTITY_ID"                               # the truth, in labels/: read only by labelled runs
full_name = { sources = [["FULL_NAME_KANA"]], normalize = ["nfkc", "strip_spaces"] }   # half-width or spaced: the same name
person_name = { sources = [["FULL_NAME_KANA"], ["O_PERSON_NAME_KANA"], ["LAST_NAME_KANA", "GIVEN_NAME_KANA"]], normalize = ["nfkc", "strip_spaces"] }
given_name = { sources = [["GIVEN_NAME_KANA"]], normalize = ["nfkc", "strip_spaces"] }
company_name = { sources = [["NYS_CNV_P_NAME_KANA"]], normalize = ["nfkc", "strip_spaces"] }
any_name = { sources = [["FULL_NAME_KANA"], ["O_PERSON_NAME_KANA"], ["LAST_NAME_KANA", "GIVEN_NAME_KANA"], ["NYS_CNV_P_NAME_KANA"]], normalize = ["strip_spaces", "nfkc", "strip_legal_form", "kana_fold"] }   # person or company
address = [["STD_ADDRESS"], ["ORIGINAL_ADDRESS"]]
address_code = "SOURCE_ADDR_CD"
postal_code = [["POST_CD"], ["POST_CD_KANA"]]
prefecture = "ADDRESS_ONE"
town_code = "ADDR_CD"                               # municipality + town + chome (住所コード)
city = "ADDRESS_TWO"
phone = "PHONE_NUM_4"
customer_id = "CIF_ID"                             # the ID the CIF system assigns
birth_date = "BIRTH_DATE"                          # one format throughout (YYYYMMDD here), so equal dates are equal strings
