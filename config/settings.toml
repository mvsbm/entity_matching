# Shared by every notebook: where data lives, which datasets exist, and how records are standardized.
# Loaded and validated by er.settings.load_settings(). Paths are relative to the project root (the folder
# with pyproject.toml), so notebooks run from any working folder. Stage-specific config (rules, models,
# searches) stays in each notebook's Configuration cell.

[paths]
reference = "data/medallion/bronze/reference"   # tracked: frozen public reference data (see SOURCES.md)
silver = "data/medallion/silver"                 # <dataset>.csv: generated records, the pipeline input
gold = "data/medallion/gold"                     # <dataset>.csv: resolved entities, the pipeline output
labels = "data/labels"                           # <dataset>.csv: truth, read only to evaluate
artifacts = "data/artifacts"                     # {matched,resolved,unresolved}/<dataset>/<stage>_*.csv
experiments = "data/artifacts/experiments"       # leaderboard.csv
models = "data/artifacts/models"                 # trained Splink models
optuna = "data/artifacts/optuna"                 # Optuna studies (SQLite), read by optuna-dashboard

[datasets]
all = ["train", "val", "test"]                   # one generated population, split by entity: fit / select / report

[schema]
unique_id = "CONT_ID"
entity_id = "ENTITY_ID"                          # truth column in labels/

[display]
show_rows = 8

[standardize]
# kana folding, character by character: voiced → unvoiced, small → large, ヴ/ヂ/ヅ/ヲ, ー → ウ
kana_fold_from = "ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴァィゥェォッャュョヮヵヶヲー"
kana_fold_to   = "カキクケコサシスセソタチツテトハヒフヘホハヒフヘホフアイウエオツヤユヨワカケオウ"
legal_forms = ["カブシキガイシャ", "ユウゲンガイシャ", "ゴウドウガイシャ", "(カ)", "(ユ)"]
prefectures = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県",
  "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県",
  "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県",
  "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
]
address_replacements = [['(\d+)丁目', '\1-'], ['(\d+)番地?', '\1-'], ['(\d+)号', '\1']]  # regex → replacement, after NFKC
address_cut_at = " "                             # drop the building / room after the first space

# Derived columns: the first source whose columns are all filled wins (concatenated), then normalized.
[[standardize.derived]]
name = "PERSON_NAME"
sources = [["FULL_NAME_KANA"], ["O_PERSON_NAME_KANA"], ["LAST_NAME_KANA", "GIVEN_NAME_KANA"]]
normalize = ["strip_spaces"]

[[standardize.derived]]
name = "POSTAL"
sources = [["POST_CD"], ["POST_CD_KANA"]]

[[standardize.derived]]
name = "ADDRESS"
sources = [["STD_ADDRESS"], ["ORIGINAL_ADDRESS"]]
