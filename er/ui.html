  <button type="button" class="btn" data-page="${page + 1}" ${page * count >= total ? "disabled" : ""}>Next ›</button></div>`;
const logBars = (rows) => {  // counts that span millions to tens: bar lengths on a log scale, so the small ones stay in view
  const top = Math.log10(Math.max(2, ...rows.map((r) => r.value + 1)));
  return `<div class="bars">${rows.map((r) => `<span class="lab">${esc(r.label)}</span><span>${r.value ? `<span class="bar ${r.tone || ""}" style="width:${Math.max(1, 100 * Math.log10(r.value + 1) / top)}%"></span>` : ""}</span>
    <span class="val">${fmt(r.value)}</span>`).join("")}</div>`;
};
const scoreBars = (scores, from) => logBars(scores.slice().reverse().map((r) => ({label: rangeOf(r), value: r.pairs,
  tone: r.down_to !== null && r.down_to >= from ? "" : "muted"})));
const tabs = (items, on) => `<nav class="tabs" role="tablist">${items.map(([id, label, go]) => `<button type="button" role="tab" class="tab" aria-selected="${id === on}" ${go}>${esc(label)}</button>`).join("")}</nav>`;
const reviewTabs = (on) => tabs([["pairs", "Same customer?", 'data-go="pairs"'], ["kinds", "Person or company?", 'data-go="kinds"']], on);
const conditionText = (c) => c.points !== undefined ? `${fmt(c.points)} points or more` : c.rules ? `found by ${c.rules.map(ruleSays).join(" or ")}`

const mergingText = (m) => m && m.when.length ? m.when.map(conditionText).join(m.join === "or" ? " · or " : " · and ") : "";
const ownText = (o) => o.rules ? `the rules' pairs, and the model's at ${fmt(o.line)} points or more with a name compared` : `pairs at ${fmt(o.line)} points or more`;  // the method's own merging
const JOINED = {you: "you", model: "the model", rule: "a rule"};  // describe results' merged_by, list entities' joined_by

// Both or more records' full rows side by side, every column of the file, the different ones first; a column that a
// comparison reads says how it was compared (explain pair's tests): method, score against its threshold, step, points.
async function fullRows(box, page, ids, x = null) {
  box.innerHTML = '<div class="faint">Reading their rows…</div>';
  const d = await run(page, "show records", {ids});
  if (!box.isConnected) return;
  if (d.event === "error") { box.innerHTML = banner(d); return; }
  const recs = d.records.filter((r) => r.row), cols = d.columns;
  if (!recs.length) { box.innerHTML = `<p class="faint">${esc(ids.join(", "))}: not in the file's copy</p>`; return; }
  const how = (c) => {  // the comparisons this column feeds, as this pair was compared: an exact test says its step itself
    if (!x || !c.fields.length) return c.fields.map(words).join(", ");
    return x.comparisons.filter((k) => x.tests.some((t) => t.comparison === k.comparison && c.fields.includes(t.field.split("__")[0])))
      .map((k) => { const t = decider(x, k.comparison); return `${comp(k.comparison)}: ${testText(x, k.comparison, t)}${t && t.function !== "exact" ? ` → ${level(k.reached)}` : ""} · ${signed(k.bits)}`; })
      .join("; ") || c.fields.map(words).join(", ");
  };
  const one = recs.length === 1;
  const rows = cols.map((c, n) => {
    const v = recs.map((r) => r.row[c.column]), filled = v.filter((s) => s !== null && s !== "");
    const kind = one ? (filled.length ? "same" : "empty") : filled.length < 2 ? "empty" : filled.every((s) => s === filled[0]) && filled.length === v.length ? "same" : "different";
    return {c, n, v, kind};
  });
  const counts = {same: 0, different: 0, empty: 0};
  rows.forEach((r) => counts[r.kind]++);
  const state = {only: false, hideEmpty: false, order: false, find: ""};
  box.innerHTML = `<div class="fullrows"><div class="fr-head"><b>${one ? "Its full row" : recs.length > 2 ? `${recs.length} records' full rows` : "Their full rows"}</b>
      <span class="muted">${one ? `${fmt(cols.length)} columns · ${fmt(counts.same)} filled` : `${fmt(cols.length)} columns: <span class="ink-good">${fmt(counts.same)} the same</span> · <span class="ink-bad">${fmt(counts.different)} different</span> · ${fmt(counts.empty)} empty on one side or both`}</span></div>
    ${one ? "" : seg([[counts.same, "var(--good)", "same"], [counts.different, "var(--bad)", "different"], [counts.empty, "var(--line)", "empty"]])}
    <div class="fr-tools"><label class="find">${icon("search")}<input type="text" placeholder="Find a column" aria-label="Find a column"></label>
      ${one ? "" : '<label class="check"><input type="checkbox" data-t="only"><span>Only different</span></label>'}<label class="check"><input type="checkbox" data-t="hideEmpty"><span>Hide empty</span></label>
      <label class="check"><input type="checkbox" data-t="order"><span>The file's order</span></label></div>
    <div class="tablecard"><div class="tablewrap"><table><thead><tr><th>Column</th>${recs.map((r) => `<th>${esc(r.id)}</th>`).join("")}<th>${x ? "Compared as" : "Used for"}</th></tr></thead><tbody></tbody></table></div></div>
    ${d.records.filter((r) => !r.row).map((r) => `<p class="faint">${esc(r.id)}: not in the file's copy</p>`).join("")}</div>`;
  const draw = () => {
    const rank = {different: 0, same: 1, empty: 2}, q = state.find.toLowerCase();
    const shown = rows.filter((r) => (!state.only || r.kind === "different") && (!state.hideEmpty || r.kind !== "empty") && (!q || r.c.column.toLowerCase().includes(q)))
      .sort((a, b) => state.order ? a.n - b.n : rank[a.kind] - rank[b.kind] || a.n - b.n);
    box.querySelector("tbody").innerHTML = shown.map((r) => `<tr class="fr-${r.kind}"><td class="col">${esc(r.c.column)}</td>${r.v.map((s, k) => s === null || s === ""
        ? '<td class="faint">—</td>' : `<td class="wrap">${k && r.kind === "different" ? highlight(r.v[0], s)[1] : r.kind === "different" && r.v[1] ? highlight(s, r.v[1])[0] : esc(s)}</td>`).join("")}
      <td class="wrap faint">${esc(how(r.c))}</td></tr>`).join("") || `<tr><td colspan="${recs.length + 2}" class="faint">No column shown</td></tr>`;
  };

        <button type="button" class="btn outlined" data-add>${icon("add")}Add a condition</button>
        <div class="preview muted" aria-live="polite"></div></div>
      <div class="dlg-foot"><button type="button" class="btn" data-none>Turn off</button><span class="grow"></span><button class="btn" value="close">Cancel</button><button type="button" class="btn filled" data-set>Apply</button></div></form>`;
    dlg.querySelectorAll("[name=join]").forEach((b) => b.onchange = () => { m.join = b.value; draw(); });  // its sentence says all or any
    dlg.querySelectorAll(".cond").forEach((box) => {
      const c = m.when[Number(box.dataset.k)];
      box.querySelector("[data-kind]").onchange = (e) => { m.when[Number(box.dataset.k)] = e.target.value === "points" ? {points: 12} : e.target.value === "rules" ? {rules: []} : {fields: {}}; draw(); };
      box.querySelector("[data-v=points]")?.addEventListener("input", (e) => { c.points = e.target.value.trim() === "" ? NaN : Number(e.target.value); preview(); });
      box.querySelector("[data-v=rules]")?.addEventListener("change", (e) => { c.rules = [...e.target.selectedOptions].map((o) => o.value); preview(); });
      box.querySelectorAll("[data-f]").forEach((s) => s.onchange = () => { if (s.value) c.fields[s.dataset.f] = s.value; else delete c.fields[s.dataset.f]; preview(); });
      box.querySelector("[data-drop]").onclick = () => { m.when.splice(Number(box.dataset.k), 1); draw(); };
    });
    dlg.querySelector("[data-add]").onclick = () => { m.when.push({points: 12}); draw(); };
    dlg.querySelector("[data-none]").onclick = () => { m = {join: m.join, when: []}; draw(); };
    dlg.querySelector("[data-set]").onclick = () => set();
    preview();
  };
  const ready = () => m.when.filter((c) => c.points !== undefined ? Number.isFinite(c.points) : c.rules ? c.rules.length : Object.keys(c.fields).length);
  let asked = 0, pause = null;
  const preview = () => { clearTimeout(pause); pause = setTimeout(count, 300); };  // one count once the typing stops
  const count = async () => {
    const box = dlg.querySelector(".preview"), n = ++asked, when = ready();
    if (!box) return;
    dlg.querySelector("[data-set]").disabled = when.length !== m.when.length;  // a condition half set is never dropped silently
    if (when.length !== m.when.length) { box.textContent = "Finish each condition, or remove it."; return; }
    if (!when.length) { box.textContent = `With none, ${none}.`; return; }
    box.textContent = "Counting…";
    const x = await run(page, "describe merging", {conditions: JSON.stringify({join: m.join, when})});
    if (n !== asked || !box.isConnected) return;
    box.innerHTML = x.event === "error" ? banner(x) : `<b>${plural(x.pairs, "pair")}</b> would merge, into <b>${plural(x.entities, "entity", "entities")}</b> of two records or more`
      + (x.each.length > 1 ? `: ${x.each.map((e) => `${esc(conditionText(e.condition))} ${fmt(e.pairs)}`).join(" · ")}` : "");
  };
  const set = () => {
    const conditions = JSON.stringify({join: m.join, when: ready()});
    dlg.close();
    action(page, "set merging", ready().length ? "Merge by these conditions" : "Turn off auto-merge", (e) => done(e.event === "error" ? e : {...e, own: now.own}), null, {form: [], about: ready().length ? `merge when ${mergingText({join: m.join, when: ready()})}` : `no conditions: ${none}`, extra: {conditions}});
  };
  draw();
  dlg.onclose = null; dlg.returnValue = ""; dlg.showModal();
}

async function pairsPage(el, arg = {}) {  // Review: the pairs waiting for a person, best first, a page at a time; each with both full rows

      : e.own ? `No conditions: the method's own merging, ${plural(e.entities, "entity", "entities")} of two records or more` : "Nothing merges without you now";
    resultsNow = null;  // read again: what merged has changed
    go("pairs", {note: `<div class="banner info">${icon("check")}<div><b>${said}.</b></div></div>`});
  };
  $("merge").onclick = () => mergeDialog("pairs", merged);
  $("apply").disabled = true;
  if (!state.workspace) { await notYet(el, "pairs"); return; }
  const [w] = await Promise.all([run("pairs", "describe workspace"), flowOf("pairs", document.createElement("div"))]);  // flowOf sets graph
  if (w.event === "error" || !w.records) { await notYet(el, "pairs", w.event === "error" ? w : null); return w; }
  await readResults("pairs");
  if (arg.merge) mergeDialog("pairs", merged);
  let from = resultsNow && resultsNow.event !== "error" ? resultsNow.review_from : 6;
  try { const kept = localStorage.getItem("nayose.reviewFrom"); if (kept !== null && Number.isFinite(Number(kept))) from = Number(kept); } catch {}
  $("from").value = from; $("record").value = arg.record || "";
  let page = 1, rows = [], total = 0, left = 0, i = 0, pending = false, written = w.pairs.written_in || 0;  // left: total less what this page decided since
  const count = 100;
  const tally = () => { $("written").textContent = String(written); $("apply").disabled = !written;
    $("done-line").innerHTML = `<b>${plural(left, "pair")}</b> waiting from ${fmt(from)} points${written ? ` · ${fmt(written)} decided, to apply` : ""}`;
    if (steps.steps && steps.steps.pairs) { steps.steps.pairs = {state: left || written ? "attention" : "done", line: left ? `${fmt(left)} waiting` : written ? `${fmt(written)} decided, to apply` : "all decided"}; rail(); } };
  const load = async () => {
    $("left").innerHTML = '<div class="faint">Loading…</div>';
    const x = await run("pairs", "list scored", {status: "open", from: String(from), page: String(page), count: String(count), record: $("record").value.trim()});
    if (x.event === "error") { $("left").innerHTML = banner(x); return; }
    rows = x.pairs; total = x.total; left = x.total - x.typed; i = Math.max(0, rows.findIndex((p) => !p.said)); tally(); draw(); show();
  };
  const draw = () => pairTable($("left"), rows, total, page, count, {compact: true, selected: i, onPick: (k) => { i = k; draw(); show(); }, onPage: (n) => { page = n; load(); }});
  const show = () => {
    const p = rows[i];
    if (!p) { $("right").innerHTML = `<div class="card empty">${icon("empty")}<p class="muted">${total ? "Pick a pair" : `No pair waits from ${fmt(from)} points`}</p></div>`; where(); return; }
    $("right").innerHTML = `<div class="card one">${scope("pairs", `Pair ${fmt((page - 1) * count + i + 1)} of ${fmt(total)}`)}
      <h2 class="question">Same customer? ${p.said ? statusChip(p.status) : ""}</h2>
      <p class="why">${p.points.toFixed(1)} points (${esc(odds(p.points))})${foundBy(p) ? ` · found by ${esc(foundBy(p))}` : ""}</p>
      <div class="actions"><button class="btn filled" data-a="match">Same</button><button class="btn outlined" data-a="no_match">Different</button>
        <button class="btn" data-skip>Not sure</button>${keyHint([["M", "same"], ["N", "different"]])}</div>
      <p class="then">Same: one entity once you apply your decisions. Different: kept apart for good.</p><div id="said"></div>
      <div class="fr"><div class="faint">Reading their rows…</div></div><div class="how faint"></div></div>`;
    const box = $("right").querySelector(".fr"), here = `${p.first} ${p.second}`;
    box.dataset.pair = here;
    run("pairs", "explain pair", {first: p.first, second: p.second}).then((x) => {
      if (box.dataset.pair !== here || !box.isConnected) return;
      fullRows(box, "pairs", [p.first, p.second], x.event === "error" ? null : x);
      $("right").querySelector(".how").outerHTML = x.event === "error" ? "" : `<details class="fold-line"><summary>How it scored, step by step</summary>${waterfallOf(rowOf(x), remember(x))}</details>`;
    });
    $("right").querySelectorAll("[data-a]").forEach((b) => {  // decided: its answer pressed
      if (p.said) { const on = b.dataset.a === p.said; b.classList.toggle("filled", on); b.classList.toggle("outlined", !on); b.setAttribute("aria-pressed", String(on)); }
      b.onclick = () => answer(b.dataset.a);
    });
    $("right").querySelector("[data-skip]").onclick = () => move(1);
    where();
  };
  const move = (step) => { if (!rows.length) return; i = Math.min(rows.length - 1, Math.max(0, i + step)); draw(); show(); };
  const answer = async (value) => {
    if (pending || !rows[i]) return;
    pending = true;
    try {
      const p = rows[i], e = await run("pairs", "decide pair", {first: p.first, second: p.second, decision: value});
      if (e.event === "error") { $("said").innerHTML = banner(e); return; }
      if (!p.said) { written++; left--; }
      p.said = value; p.status = value === "match" ? "same" : "different"; tally();

    } finally { pending = false; }
  };
  $("from").onchange = () => { const v = Number($("from").value); if (!Number.isFinite(v)) return; from = v; try { localStorage.setItem("nayose.reviewFrom", String(v)); } catch {} page = 1; load(); };
  $("record").onchange = () => { page = 1; load(); };
  $("apply").onclick = () => { $("apply").disabled = true; run("pairs", "apply decisions").then((e) => e.event === "error" ? ($("note").innerHTML = banner(e), tally())
    : go("pairs", {note: `<div class="banner info">${icon("check")}<div><b>${plural(e.decisions, "decision")} applied: ${plural(e.clusters_joined, "entity", "entities")} joined.</b></div></div>`})); };
  keyHandler = (k) => ({m: () => answer("match"), n: () => answer("no_match"), s: () => move(1), ArrowDown: () => move(1), ArrowUp: () => move(-1), j: () => move(1), k: () => move(-1)})[k];
  await load();
  return w;
}

      const missing = [...d.needed.every.filter(lost), ...d.needed.one_of.filter((grp) => grp.every(lost)).map((grp) => grp.join(" or "))];
      $("loaded").innerHTML = `<div class="qa"><div class="q"><h2 class="question">Did your file load?</h2><p class="answer">${!d.records
          ? `<b>Not yet:</b> ${esc(nameOf(last))} holds no records`
          : missing.length ? `<b>Not yet:</b> ${esc(missing.map(words).join(", "))} ${missing.length > 1 ? "are" : "is"} needed`
          : `<b>Yes</b> · ${plural(d.records, "record")} from ${esc(nameOf(last))} · ${fmt(d.columns.length)} columns${waits(d.read)}`}</p></div>
        ${!d.records ? "" : missing.length ? (d.placements.length ? `<button type="button" class="btn filled" id="suggest-now">✦ Suggest the columns</button>` : "") : ((steps.steps || {}).run || {}).state === "done" ? "" : `<a class="btn filled" data-go="run">Next: 3 Find matches →</a>`}</div>
        <details class="fold-line"><summary>Load another file</summary><div style="margin-top:10px">${box}</div></details>`;
      wireLoad();
      $("files").innerHTML = (w.inputs || []).map((f) => `<span class="tag" title="${esc(f.path)}">${esc(nameOf(f))} · ${bytes(f.bytes)} · ${f.read ? "matched" : "not run yet"}${f.waiting ? ` · ${fmt(f.waiting)} repairs wait` : ""}</span>`).join("");
      repairs(d.read);
      const lines = hurts(d.fields, d.turned_off, "", addedNames(d.features), d.needed.one_of);
      $("watch").innerHTML = lines.length && !missing.length ? `<div class="card"><h3 style="font-size:15px;font-weight:500;margin:0 0 8px">Watch out</h3><div class="checks">${lines.join("")}</div></div>` : "";  // once what is needed is mapped
      $("suggest-now")?.addEventListener("click", () => $("out").querySelector("[data-suggest='*']")?.click());
    };
    const repairs = (r) => {  // what the reader proposed, kind by kind, to see and accept; what it fixed by itself; the rows it can't read
      const wait = r ? r.waiting : {}, fixed = r ? Object.values(r.fixed).reduce((a, b) => a + b, 0) : 0, cannot = r ? r.unread - (wait.realign || 0) : 0;
      const rows = (k) => (r.examples[k] || []).map((x) => `<tr><td class="num">${fmt(x.line)}</td><td>${esc(x.column)}</td><td class="wrap">${esc(x.before)}</td><td class="wrap">${esc(x.after)}</td></tr>`).join("");
      $("repairs").innerHTML = r && (Object.keys(wait).length || cannot > 0) ? `<div class="card">${Object.keys(wait).length ? `<h3 style="font-size:15px;font-weight:500;margin:0 0 4px">Repairs to accept</h3>` : ""}
        ${Object.entries(wait).map(([k, n]) => `<details class="fold-line"><summary>${plural(n, REPAIR[k][0], REPAIR[k][1])} ${esc(REPAIR[k][2])}</summary>
          <div class="tablecard" style="margin:8px 0"><table class="repairs"><thead><tr><th class="num">line</th><th>column</th><th>as given</th><th>repaired</th></tr></thead><tbody>${rows(k)}</tbody></table></div>
          ${n > (r.examples[k] || []).length ? `<p class="faint" style="margin:0 0 8px">the first ${fmt((r.examples[k] || []).length)} of ${fmt(n)}</p>` : ""}
          <button type="button" class="btn outlined" data-accept="${k}">Accept these ${fmt(n)}</button></details>`).join("")}
        ${fixed ? `<details class="fold-line"><summary>Fixed by themselves: ${plural(fixed, "value")}</summary><div class="checks">${Object.entries(r.fixed).map(([k, n]) => `<div class="ok">${fmt(n)} ${esc(FIXED[k] || k)}</div>`).join("")}</div></details>` : ""}
        ${cannot > 0 ? `<details class="fold-line"><summary>${plural(cannot, "row")} can't be read: kept aside</summary><div class="checks">${(r.examples.unread || []).filter((x) => !x.reason.includes("a repair waits")).map((x) => `<div class="warn">line ${fmt(x.line)}: ${esc(x.reason)}</div>`).join("")}</div></details>` : ""}</div>` : "";
      $("repairs").querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => action("columns", "accept repairs", `Accept ${plural(wait[b.dataset.accept], "repair")}`,
        (e) => e.event === "error" ? $("repairs").insertAdjacentHTML("afterbegin", banner(e)) : draw(), null, {about: `${fileName(r.part)}: ${REPAIR[b.dataset.accept][2]}`, extra: {kind: b.dataset.accept, part: r.part}}));
    };
    const view = {toggled: new Map(), ghosts: new Set()};  // groups opened or closed, groups showing their suggestions: kept as the page redraws
    let w = {}, last = null, edits = 0, writes = Promise.resolve(), refused = null, held = null;  // the workspace, its file loaded last; changes, one after another
    const queue = (job) => (writes = writes.then(job).catch((err) => console.error(err)));  // reads and writes in turn: a reading never misses a write before it
    const show = (d) => {
      $("out").inert = false;
      held = null;
      if (d.event !== "error" && last) answer(d, w, last);
      $("out").innerHTML = d.event === "error" ? banner(d) : features(d, view);
      if (d.event !== "error") wire(d);
      if (refused) { $("out").insertAdjacentHTML("afterbegin", banner(refused)); refused = null; }  // why, above the workspace as it is
    };
    const draw = (d) => {  // d: a description just made; else the file loaded last is described
      const at = edits;
      return queue(async () => {
        [w] = await Promise.all([run("columns", "describe workspace"), flowOf("columns", $("flow"))]);
        const files = w.inputs || [];
        last = files[files.length - 1];
        $("files").innerHTML = files.map((f) => `<span class="tag" title="${esc(f.path)}">${esc(nameOf(f))} · ${bytes(f.bytes)} · ${f.read ? "matched" : "not run yet"}</span>`).join("");
        if (d === undefined && last) {
          if (!$("out").querySelector(".fgroup")) $("out").innerHTML = `<div class="card waiting"><span class="spin ink"></span>Reading the columns of ${esc(nameOf(last))}…</div>`;
          d = await run("columns", "describe records", {loaded: last.path});
        }
        if (d && at === edits) show(d);  // else a change since: its own reading shows it
      });
    };
    const reread = async () => {  // the file described again, shown unless the page changed since
      const mine = edits, d = await run("columns", "describe records", {loaded: last.path});
      if (mine !== edits) return;
      $("out").removeAttribute("aria-busy");
      if (!$("out").inert && $("out").querySelector(".addform, .drop select")) held = d;  // shown once the person has chosen or named
      else show(d);
    };
    const commit = (command, args) => {  // a change, written after the ones before it; the file described again after the last
      const mine = ++edits, words = argsFor("columns", command, args);
      held = null;  // older than this change
      $("out").setAttribute("aria-busy", "true");
      queue(async () => {
        const e = await runOnce(command, words);  // sent even if the page is left: the page showed it made
        if (e.event === "error") refused = e;  // said once the page shows what the workspace holds
        if (mine === edits) await reread();
      });
    };
    const wire = (d) => {  // a change shows at once, then is written: one set feature, the slots it touches with their columns as they become
      const alts = Object.fromEntries(d.slots.map((x) => [x.feature, x.sources.map((a) => [...a])])), inFile = new Set(d.columns.map((c) => c.column));
      const single = new Set(d.features.flatMap((g) => g.features.filter((f) => f.field === "id").map((f) => `${g.group}/${f.name}`)));  // one column, no fallback
      const redraw = (x) => { $("out").innerHTML = features(x, view); wire(x); };
      const save = (paths) => {
        paths = [...new Set(paths)].filter((p) => alts[p]);
        const now = new Set(paths), mapped = (p) => alts[p].filter((a) => a.length), taken = new Set(paths.flatMap((p) => mapped(p).flat()));
        const free = (x) => !now.has(x.feature) && !taken.has(x.column);  // a suggestion for a slot just filled, or of a column just placed: gone
        redraw({...d, placements: d.placements.filter(free), offers: (d.offers || []).filter(free),  // its numbers once the file is described again
                slots: d.slots.map((s) => now.has(s.feature) ? {...s, sources: mapped(s.feature), filled: null, example: null, looks_right: null,
                  alternatives: mapped(s.feature).map((a) => ({columns: a, found: a.every((c) => inFile.has(c))}))} : s)});
        commit("set feature", {mapping: paths.map((p) => `${p}=${mapped(p).map((a) => a.join("+")).join(",")}`)});
      };
      const change = (command, args) => { $("out").inert = true; commit(command, args); };  // a feature added or removed: the page waits for its new shape
      const here = (slot) => alts[slot].filter((a) => a.length && a.every((c) => inFile.has(c)));  // as the page shows it: data-alt counts these
      const take = (from, col) => {  // in place: an alternative keeps its identity as a column leaves it
        alts[from].forEach((a) => a.includes(col) && a.splice(a.indexOf(col), 1));
        alts[from] = alts[from].filter((a) => a.length);
      };
      const place = (to, col, join, from) => {  // into a slot: a fallback; onto a chip: joined to it; columns this file lacks give way
        const onto = join === null ? undefined : here(to)[join];  // found before the column leaves where it was
        if (from === to && onto?.includes(col)) return;  // dropped where it is
        if (from) take(from, col);
        alts[to] = single.has(to) ? [] : here(to);
        alts[to].includes(onto) ? onto.push(col) : alts[to].push([col]);
        save([to, ...(from && from !== to ? [from] : [])]);
      };
      el.querySelectorAll(".colchip[draggable]").forEach((c) => c.ondragstart = (e) => e.dataTransfer.setData("text/plain", JSON.stringify({col: c.dataset.col, from: c.dataset.from || null})));
      el.querySelectorAll(".frow:has(.drop[data-slot]), .drop[data-slot] .colchip.in").forEach((t) => {  // anywhere on a row; onto a chip: joined to it
        const mark = t.matches(".frow") ? t.querySelector(".drop") : t;
        t.ondragover = (e) => { e.preventDefault(); mark.classList.add("over"); };
        t.ondragleave = () => mark.classList.remove("over");
        t.ondrop = (e) => {
          e.preventDefault(); e.stopPropagation(); mark.classList.remove("over");
          let moved = null;
          try { moved = JSON.parse(e.dataTransfer.getData("text/plain")); } catch { /* text or a file from elsewhere */ }
          if (typeof moved?.col !== "string") return;  // not one of the file's columns
          place(t.closest(".frow").querySelector(".drop").dataset.slot, moved.col, t.matches(".colchip") ? Number(t.dataset.alt) : null, moved.from);
        };
      });
      el.querySelectorAll("[data-x]").forEach((b) => b.onclick = () => { const c = b.closest(".colchip"); take(c.dataset.from, c.dataset.col); save([c.dataset.from]); });
      const choose = (spot, label, pick) => {  // without dragging: the file's columns in a list, in place of what was clicked, opened at once
        const list = document.createElement("select");
        let picked = false;
        list.setAttribute("aria-label", label);
        list.innerHTML = `<option value="">pick a column</option>` + d.columns.map((c) => `<option value="${esc(c.column)}"${c.column === spot.dataset.col ? " selected" : ""}>${esc(c.column)}</option>`).join("");
        list.onchange = () => { if (list.value && list.value !== spot.dataset.col) { picked = true; pick(list.value); } };
        list.onblur = () => picked || (held ? show(held) : list.replaceWith(spot));  // left as it was, or as described since
        spot.replaceWith(list);
        list.focus();
        try { list.showPicker(); } catch { /* a browser without it: the list, focused, opens on the next click or key */ }
      };
      const byKey = (x) => { x.onkeydown = (e) => { if (e.target === x && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); x.click(); } }; };  // × inside keeps its own keys
      el.querySelectorAll(".hole").forEach((h) => {
        const slot = h.closest(".drop").dataset.slot;
        h.onclick = () => choose(h, `A column for ${slot}`, (col) => place(slot, col, null, null));
        byKey(h);
      });
      el.querySelectorAll(".drop[data-slot] .colchip.in").forEach((c) => {  // a column clicked: another in its place
        const slot = c.dataset.from, i = Number(c.dataset.alt), was = c.dataset.col;
        c.onclick = (e) => e.target.closest("[data-x]") || choose(c, `In place of ${was}`, (col) => {
          alts[slot] = here(slot);
          alts[slot][i] = alts[slot][i].map((x) => x === was ? col : x);
          save([slot]);
        });
        byKey(c);
      });
      el.querySelectorAll("[data-keep]").forEach((b) => b.onclick = () => { const [slot, col] = JSON.parse(b.dataset.keep); place(slot, col, null, null); });
      el.querySelectorAll("[data-keepall]").forEach((b) => b.onclick = () => {
        const mine = d.placements.filter((x) => alts[x.feature] && (b.dataset.keepall === "*" || x.feature.startsWith(`${b.dataset.keepall}/`)));
        mine.forEach((x) => { alts[x.feature] = [[x.column]]; });
        save(mine.map((x) => x.feature));
      });
      el.querySelectorAll("[data-suggest]").forEach((b) => b.onclick = (e) => {
        e.preventDefault();
        const g = b.dataset.suggest;
        const has = (x) => d.placements.some((y) => y.feature.startsWith(`${x}/`));
        g === "*" ? (view.ghosts.size ? view.ghosts.clear() : d.features.filter((x) => has(x.group)).forEach((x) => view.ghosts.add(x.group))) :
          view.ghosts.has(g) ? view.ghosts.delete(g) : view.ghosts.add(g);
        view.ghosts.forEach((x) => view.toggled.set(x, true));  // a group showing what it could hold is open
        redraw(d);
      });
      el.querySelectorAll("details.fgroup").forEach((g) => g.ontoggle = () => view.toggled.set(g.dataset.g, g.open));
      el.querySelectorAll("details.tray").forEach((t) => t.ontoggle = () => { view.tray = t.open; });
      el.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => change("remove feature", {path: b.dataset.remove}));
      el.querySelectorAll("[data-offer]").forEach((b) => b.onclick = () => { const x = JSON.parse(b.dataset.offer); change("add feature", {path: x.feature, type: x.type, script: x.script, column: x.column}); });
      el.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => {  // one line, in place: its name, what it is, its script
        const row = b.closest(".frow");
        row.innerHTML = `<span class="flab"></span><span class="drop addform"><input type="text" placeholder="its name, e.g. Kanji name" aria-label="Its name">
          <select aria-label="What it is"><option value="person name">person's name</option><option value="company name">company name</option></select>
          <select aria-label="Script"><option>kana</option><option>kanji</option><option>romaji</option></select>
          <button class="btn filled">Add</button><button class="btn" data-cancel>Cancel</button></span>
          <span class="faint addnote">compared beside the kana name; its steps were tuned on kana</span>`;
        const [name, kind, script] = row.querySelectorAll("input, select");
        name.focus();
        row.querySelector(".btn.filled").onclick = (e) => {
          if (!name.value.trim()) return name.focus();

        };
        name.onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) row.querySelector(".btn.filled").click(); };  // not the Enter that ends a kana-to-kanji conversion
        row.querySelector("[data-cancel]").onclick = () => held ? show(held) : redraw(d);

    const wireLoad = () => {
      $("load").onclick = async () => {
        const input = $("cin").value.trim();
        if (!input) { $("cin").focus(); return; }

        b.disabled = true; b.textContent = "Reading…";  // a big file takes minutes: how far, and how long is left, in the panel
        if (!$("out").querySelector(".fgroup")) $("out").innerHTML = `<div class="card waiting"><span class="spin ink"></span>Reading ${esc(baseName(input))}…</div>`;
        const e = await run("columns", "load records", {input});

  async run(el, loop) {
    const ran = ((steps.steps || {}).run || {}).state === "done";  // before a first run: one thing to do
    const act = (command, label, ic, filled) => `<button class="btn${filled ? " filled" : ""}" data-act="${command}" data-label="${label}">${ic ? icon(ic) : ""}${label}</button>`;
    el.innerHTML = head("run", ran ? act("rerun records", "Run matching again", "refresh") + act("add records", "Add new records", "add") + act("match records", "Preview new records") : "") +
      `<div id="out">${state.workspace ? "" : emptyRun()}</div><h3 class="flowq" id="flowq"></h3><div id="flow"></div>${stepFoot("run")}`;
    if (!state.workspace) return;
    const graph_ = flowOf("run", $("flow"));
    let file = null, w0 = null;  // the file a first run reads: the one loaded last; the workspace, once described
    const hold = () => el.querySelectorAll("[data-act], [data-first], [data-add]").forEach((b) => b.disabled = !!longRun);
    const start = (command, label, opts = null) => {
      const done = (d) => {
        longRun = null; hold();
        $("out").querySelector(".steps-card")?.remove();
        if (d.event === "error") { go("run").then(() => $("out")?.insertAdjacentHTML("afterbegin", banner(d))); return; }  // the page as it was, its buttons back, and why
        const nothing = (d.summary || []).find(([w]) => w === "nothing new");  // a batch already in the run: said, nothing changed
        if (command !== "match records") { refresh().then(() => go("run")).then(() => nothing && $("out")?.insertAdjacentHTML("afterbegin", `<div class="banner info">${icon("check")}<div><b>Nothing new:</b> ${esc(nothing[1])}</div></div>`)); return; }
        $("out").innerHTML = `<div class="card"><h2>What adding them would do</h2>${bars(Object.entries(d.counts).map(([k, n]) => ({label: k, value: n})))}</div><div id="matched"></div>`;
        if (d.records) grid($("matched"), d.records, ["id", "entity", "status", "by", "weight"], {cell: (r, c) => c === "status" ? chip(r.status) : esc(fmt(r[c]))});
      };
      const rows = command === "resolve records" && file ? file.rows : command === "rerun records" && w0 ? w0.records : null;
      lastRuns[command] = rows && w0 ? lastRun(rows, w0) : null;  // a new batch's size is unknown until it is read: its own counts say
      const step = (e) => {  // the run as it goes: the panel keeps it (task), the card shows it (runCard)
        if (e.event === "start" || !$("out").querySelector(".steps-card")) {
          longRun = {command, visit, page: "run", workspace: state.workspace}; hold();
          $("out").innerHTML = stepsCard(command);
        }
        runCard();
      };
      action("run", command, label, done, step, opts || (command === "resolve records" && !ran && file ? {form: [], about: `${nameOf(file)} · ${plural(file.rows, "record")}`} : {}));
    };
    el.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => start(b.dataset.act, b.dataset.label));
    hold();
    if (loop) el.querySelector(`[data-act="${loop.via[loop.via.length - 1]}"]`)?.focus();
    const w = await run("run", "describe workspace");
    if (w.event === "error") { $("out").innerHTML = banner(w); return; }
    w0 = w;
    file = (w.inputs || []).slice(-1)[0] || null;
    if ($("out").querySelector(".steps-card")) return;  // a run started meanwhile: it draws its own
    if (runsHere()) {  // started before this page was drawn: a run of step 3, as it stands; the Overview's, a card saying where it shows
      $("out").innerHTML = longRun.page === "run" && RUNS.includes(longRun.command) && task.command === longRun.command ? stepsCard(longRun.command) : runningCard(longRun);
      hold(); runCard(); graph_.then(runCard);  // the stages filled in once the pipeline is drawn
      return w;
    }
    if (!w.records) {  // nothing run yet: how long it will take, and the one button; how it will find them, below
      $("flowq").textContent = "How it will find them";
      $("out").innerHTML = file && !file.rows ? `<div class="card"><div class="qa"><div class="q"><h2 class="question">${esc(nameOf(file))} holds no records</h2>
          <p class="answer">Load a file that does</p></div><a class="btn filled" data-go="columns">2 · Prepare your data</a></div></div>`
        : file ? `<div class="card"><div class="qa"><div class="q"><h2 class="question">Ready to find matches in ${plural(file.rows, "record")}</h2>
          <p class="answer">${esc(nameOf(file))} · about ${about(guess(file.rows, w))}</p></div><button class="btn filled" data-first>${icon("run")}Find matches</button></div></div>` : emptyRun(w);
      $("out").querySelector("[data-first]")?.addEventListener("click", () => start("resolve records", "Find matches"));
      hold();
      return w;
    }
    $("flowq").textContent = "How did it find matches?";
    $("out").innerHTML = `<div class="card"><div class="qa"><div class="q"><h2 class="question big">${plural(w.records, "record")} → ${plural(w.entities, "entity", "entities")}</h2>
      <p class="answer">The last run: what it found is on Results, the pairs waiting for you on Review</p></div><a class="btn filled" data-go="records">${icon("overview")}Results</a></div></div>${
      file && !file.read ? `<div class="card ready">${icon("records")}<div><b>${esc(nameOf(file))}</b><span class="muted"> · ${plural(file.rows, "record")}, not matched yet</span></div>
        <span class="grow"></span><button class="btn filled" data-add>${icon("add")}Add them to this run</button><button class="btn" data-first>Replace the run with them</button></div>` : ""}`;  // a file loaded since: added, or matched alone
    $("out").querySelector("[data-first]")?.addEventListener("click", () => start("resolve records", "Replace the run with them",
      {form: [], about: `${nameOf(file)} · ${plural(file.rows, "record")}: this run's results go`, extra: {overwrite: true}}));
    $("out").querySelector("[data-add]")?.addEventListener("click", () => start("add records", "Add them to this run", {form: [], about: `${nameOf(file)} · ${plural(file.rows, "record")}`, extra: {input: file.path}}));
    hold();
    return w;
  },

  results: (el, arg) => explorePage(el, arg),

  async improve(el) {  // the loop: what people's decisions say about the method; a change tried, adopted, and the new round reviewed
    const foot = `<div class="stepfoot"><a class="btn" data-go="pairs">← Review</a><span class="grow"></span>
      <a class="btn" data-go="run">${icon("run")}Find matches</a><a class="btn outlined" data-go="records">Results →</a></div>`;
    el.innerHTML = head("improve", `<button class="btn" id="refresh">${icon("refresh")}Refresh</button>`) +
      `<div id="busy"></div><div id="out" class="faint">Loading…</div><div id="flow"></div>${foot}`;
    $("refresh").onclick = () => go("improve");
    if (!state.workspace) { await notYet(el, "improve"); return; }
    const [d, g] = await Promise.all([run("improve", "describe method"), flowOf("improve", $("flow"))]);
    if (d.event === "error") { await notYet(el, "improve", d); return; }
    dropped = d.dropped;
    const a = d.audits, latest = d.trials.filter((x) => !d.rounds.length || x.at >= d.rounds[d.rounds.length - 1].at).pop();
    const gens = g ? (g.nodes.find((x) => x.id === "candidates") || {generators: []}).generators : [], listed = gens.reduce((s, x) => s + (x.pairs || 0), 0);
    const plainly = (x) => {  // a proposal in words: what changes, and what it would do
      const key = x.change.drop_keys && gens.find((k) => k.name === x.change.drop_keys[0]);
      if (key) return `Stop looking for “${esc(keyWords(key))}”: ${listed ? `${Math.round(100 * key.pairs / listed)}% less work` : "less work"}; no match relies on it alone`;
      if (x.change.line !== undefined) return `Draw the line at ${fmt(x.change.line)} points: ${esc(x.why)}`;
      if (x.change.add_keys) return `Also pair records with the same ${esc(keyText(x.change.add_keys[0]))}: it ${esc(x.why)}`;
      return `${esc(methodText(x.change))}: ${esc(x.why)}`;
    };
    const t = d.trust, seen = t ? {checked: t.above.checked + t.checked, false: t.above.false + t.false} : a;  // with a trust line: the merged links people checked, and its sample
    const review = `<a class="btn outlined" data-go="pairs">${icon("pairs")}Review pairs</a>`;
    const verdict = !seen.checked ? [`<b>Not known yet:</b> people haven't checked a pair.`, review]
      : !seen.false ? [`<b>So far, yes:</b> none of the ${plural(seen.checked, "pair")} people checked was wrong.`, review]
      : [`<b>Not yet:</b> ${fmt(seen.false)} of the ${plural(seen.checked, "pair")} people checked ${seen.false > 1 ? "were" : "was"} wrong.`, `<a class="btn filled" id="wrong">Look at them</a>`];
    const changed = Object.fromEntries(Object.entries(d.method).filter(([k]) => !["trust", "merge"].includes(k)));  // the trust line and the merge conditions are people's, not the method's
    $("out").className = "";
    $("out").innerHTML = `<div class="card"><div class="qa"><div class="q"><h2 class="question">Is the matching good enough yet?</h2><p class="answer">${verdict[0]}</p></div>${verdict[1]}</div></div>` +
      `<div class="card"><h3 style="font-size:15px;font-weight:500;margin:0 0 10px">What could be better</h3>${latest ? trialCard(latest) : ""}${
        d.proposals.length ? d.proposals.map((x) => `<div class="offer">${icon("wand")}<span>${plainly(x)}</span>${tryBtn(x.change)}</div>`).join("") : '<p class="muted" style="margin:0">Nothing to try yet: people\'s decisions show what to change.</p>'}
        ${Object.keys(changed).length ? `<p class="muted">The method is changed: ${esc(methodText(changed))} · <button class="mini" id="reset">Back to the tuned method</button></p>` : ""}
        <details class="fold-line"><summary>Where to draw the line</summary><div id="line" style="margin-top:10px"></div></details></div>
       <details class="card fold"><summary><h2>Rounds so far</h2></summary><div id="rounds"></div></details>
       <details class="card fold"><summary><h2>Match rules</h2></summary><div id="rules"></div></details>
       <details class="card fold"><summary><h2>Pair keys</h2></summary><div id="keys"></div></details>
       <details class="card fold"><summary><h2>Comparison steps</h2></summary><div id="steps"></div></details>`;
    grid($("rounds"), d.rounds, ["round", "method", "matched", "decided", "audited", "false_found", "expected_false"],
         {filter: false, labels: {matched: "links", false_found: "false found", expected_false: "expected false"},
          cell: (r, c) => c === "method" ? esc(methodText(r.method)) : c === "false_found" && r[c] ? `<span class="chip warn">${fmt(r[c])}</span>` : esc(fmt(r[c]))});
    lineView($("line"), d);
    const without = (key) => (r) => r.pairs ? tryBtn({[key]: [r.name]}, "Try without") : "";
    grid($("rules"), d.rules, ["name", "pairs", "below", "different", "try"], {filter: false, labels: {name: "rule", below: "below the line", different: "said different", try: ""},
         cell: (r, c) => c === "name" ? esc(ruleSays(r.name).replace(/^a rule: /, "")) : c === "try" ? without("drop_rules")(r) : c === "different" && r[c] ? `<span class="chip warn">${fmt(r[c])}</span>` : esc(fmt(r[c]))});
    grid($("keys"), d.keys, ["name", "pairs", "seconds", "matched", "only", "try"], {filter: false, labels: {name: "looks for", matched: "likely links", only: "only it finds", try: ""},
         cell: (r, c) => c === "name" ? esc(looks(r.name)) : c === "try" ? without("drop_keys")(r) : esc(fmt(r[c]))});
    grid($("steps"), d.steps, ["comparison", "level", "bits", "reached"], {filter: false, labels: {level: "step", bits: "points", reached: "pairs"},
         cell: (r, c) => c === "comparison" ? esc(comp(r.comparison)) : c === "level" ? esc(level(r.level)) : c === "bits" && r.reached && Math.abs(r.bits) < 0.5 && r.level !== "missing" ? `${esc(fmt(r.bits))} <span class="chip warn">about 0</span>`
           : c === "reached" && !r.reached ? '<span class="chip warn">never</span>' : esc(fmt(r[c]))});
    where();
    const busy = (label) => {  // one long command at a time: its steps as they finish, every action off until it ends
      el.querySelectorAll("[data-try], [data-adopt], #reset").forEach((b) => { b.disabled = true; });
      $("busy").innerHTML = `<div class="card steps-card"><h2><span class="spin" style="border-color:var(--primary);border-right-color:transparent"></span>${esc(label)}</h2><ul class="steps"></ul></div>`;
      return (e) => { if (e.event === "step") $("busy").querySelector("ul")?.insertAdjacentHTML("beforeend", `<li>${icon("check")}${esc(DOING[e.step] || e.step)} <span class="faint">${e.seconds.toFixed(1)} s</span></li>`); };
    };
    const failed = (e) => { $("busy").innerHTML = banner(e); el.querySelectorAll("[data-try], [data-adopt], #reset").forEach((b) => { b.disabled = false; }); };
    const round = (tuned) => (e) => e.event === "error" ? failed(e)
      : go(LOOP.after, `<div class="banner info">${icon("loop")}<div><b>Matched again with the ${tuned ? "tuned" : "new"} method: review this round's pairs.</b></div></div>`);
    $("out").onclick = (e) => {  // the page's buttons, those the slider adds too
      const b = e.target.closest("button:not(:disabled)");
      if (!b) return;
      if (b.dataset.try) {
        const change = JSON.parse(b.dataset.try);
        run("improve", "try method", tryArgs(change), busy(`Trying ${methodText(change)}`)).then((r) => r.event === "error" ? failed(r) : go("improve"));
      } else if (b.dataset.adopt) run("improve", "adopt method", {trial: b.dataset.adopt}, busy("Adopting, and finding matches")).then(round(false));
      else if (b.id === "reset") run("improve", "reset method", {}, busy("Back to the tuned method, and finding matches")).then(round(true));
    };
    $("wrong")?.addEventListener("click", () => go("results", {tab: "pairs", status: "different"}));  // the pairs people said differ, in Explore
  },

  pairs: (el, arg) => pairsPage(el, arg),
  kinds: (el, note) => review(el, "kinds", note),
};

// A change of method in words, and what try method takes for it.
const methodText = (m) => !m || !Object.keys(m).length ? "as tuned"
  : [...(m.trust !== undefined ? [m.trust === "none" ? "nothing merges by points" : `${fmt(m.trust)}+ merge`] : []),
     ...(m.line !== undefined ? [`line at ${fmt(m.line)}`] : []), ...(m.drop_rules || []).map((x) => `without ${ruleSays(x)}`), ...(m.drop_keys || []).map((x) => `without “${looks(x)}”`),
     ...(m.add_keys || []).map((k) => `with a key on ${keyText(k)}`)].join(" · ");
const keyText = (k) => k.map((f) => { const [field, ...n] = f.split(":"); return words(field) + (n.includes("first3") ? " area" : n.includes("initial") ? " initial" : ""); }).join(" + ");  // an added key's fields, in words
const tryArgs = (c) => c.line !== undefined ? {line: String(c.line)} : c.add_keys ? {add: c.add_keys.map((k) => k.join("+"))} : {drop: [...(c.drop_rules || []), ...(c.drop_keys || [])]};
const tryBtn = (c, label = "Try") => `<button class="btn" data-try='${esc(JSON.stringify(c))}'>${esc(label)}</button>`;

function trialCard(x) {  // a trial beside the method as it is: on people's decisions first, then without labels
  const was = x.base, now = x.variant, cell = (k, v) => `<div><span class="lab">${esc(k)}</span><b>${v}</b></div>`;
  const change = (k, worse) => `<span class="${x[k].variant > x[k].base ? worse : x[k].variant < x[k].base ? "ink-good" : ""}">${fmt(x[k].base)} → ${fmt(x[k].variant)}</span>`;
  const dj = x.different_joined, sa = x.same_apart, fixed = (x.fixed || []).length, broken = (x.broken || []).length, worse = broken > 0, better = !worse && fixed > 0;
  const many = (n) => n >= 50 ? `${fmt(n)} or more pairs` : plural(n, "pair");  // the lists stop at 50
  const verdict = worse ? `<b>Worse:</b> it sets wrong ${many(broken)} people decided${fixed ? `, and right ${many(fixed)}` : ""}` : better ? `<b>Better:</b> it sets right ${many(fixed)} people decided, and wrong none`
    : dj.base || sa.base ? "<b>No better:</b> it sets right none of the pairs people decided" : "";  // judged on people's answers first
  const {trust, ...tried} = x.method;  // a trial sets the trust line aside: its title says what it changes
  return `<div class="card trial"><h2>${icon("loop")}Trial ${fmt(x.trial)}: ${esc(methodText(tried))}</h2>${verdict ? `<p class="answer">${verdict}</p>` : ""}<p class="muted">Both run without people's decisions or the trust line: the method now → this trial</p><div class="nums">${
    cell("Joined, people said different", change("different_joined", "ink-bad"))}${cell("Apart, people said same", change("same_apart", ""))}${
    cell("Links", `${fmt(was.matched)} → ${fmt(now.matched)}`)}${cell("Expected false", `${fmt(was.expected_false)} → ${fmt(now.expected_false)}`)}${
    cell("Entities", `${fmt(was.entities)} → ${fmt(now.entities)}`)}${cell("Pairs of records", `${fmt(x.apart)} apart · ${fmt(x.together)} together`)}${
    was.missed && now.missed ? Object.keys(now.missed).map((k) => cell(`Matches no key lists, sharing a ${words(k)}`, `${fmt(was.missed[k] ?? 0)} → ${fmt(now.missed[k] ?? 0)}`)).join("") : ""}</div>
    <div class="row"><button class="btn ${better && !worse ? "filled" : "outlined"}" data-adopt="${esc(x.trial)}">${icon("check")}Adopt and find matches</button></div></div>`;
}

// The weight bands near the line, every pair people decided as a dot, the line, and a slider that moves it: what a
// line there would set right and wrong among those pairs, counted here (the rules' pairs aside: no line moves them).
function lineView(box, d) {
  const pts = d.decided.filter((x) => !x.rule), lo = Math.floor(d.line) - 10, hi = Math.floor(d.line) + 14, W = 880;  // pairs past the window: at its edge
  const x = (w) => 12 + ((Math.min(hi, Math.max(lo, w)) - lo) / (hi - lo)) * (W - 24);
  const bands = d.bands.filter((b) => b.weight_from + 2 > lo && b.weight_from < hi), top = Math.max(1, ...bands.map((b) => Math.log2(b.pairs + 1)));
  const stack = {}, MOST = 10, dots = [...pts].sort((a, b) => (a.decision === "match") - (b.decision === "match")).map((p) => {  // a column: different first, 10 dots, then a count
    const k = Math.round(x(p.weight) / 9), n = stack[k] = (stack[k] || 0) + 1;
    return n > MOST ? "" : `<circle cx="${x(p.weight)}" cy="${108 + n * 9}" r="4" class="${p.decision === "match" ? "same" : "diff"}"><title>${esc(p.id_l)} · ${esc(p.id_r)}: ${p.decision === "match" ? "same" : "different"}, ${fmt(p.weight)} points</title></circle>`; });
  const more = Object.entries(stack).filter(([, n]) => n > MOST).map(([k, n]) => `<text x="${k * 9}" y="${108 + (MOST + 1) * 9 + 4 + (k % 2) * 12}" class="tick">+${n - MOST}</text>`);  // columns 9 px apart: every other count a line lower
  const H = 136 + 9 * Math.min(MOST + 1, Math.max(0, ...Object.values(stack)));
  const ticks = Array.from({length: (hi - lo) / 2 + 1}, (_, i) => lo + i * 2);
  const ruled = d.decided.length - pts.length, tl = d.trust && d.trust.line;
  box.innerHTML = `${d.trust ? `<p class="muted" style="margin:0 0 8px">The trust line decides what merges now: ${tl === "none" ? "nothing by points yet" : `pairs scoring ${fmt(tl)} or more`}</p>` : ""}
    <svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pairs by points, the line at ${fmt(d.line)}, and the pairs people decided">
    ${bands.map((b) => { const h = Math.log2(b.pairs + 1) / top * 84, a = x(Math.max(lo, b.weight_from)), w = Math.max(1, x(Math.min(hi, b.weight_from + 2)) - a - 2);
      return `<rect x="${a}" y="${96 - h}" width="${w}" height="${h}" rx="3" class="${b.accepted ? "acc" : ""}"><title>${plural(b.pairs, "pair")}, ${b.weight_from} to ${b.weight_from + 2} points</title></rect>`; }).join("")}
    <line x1="0" x2="${W}" y1="96" y2="96" class="axis"/>${ticks.map((v) => `<text x="${x(v)}" y="110" class="tick">${v}</text>`).join("")}
    <line x1="${x(d.line)}" x2="${x(d.line)}" y1="4" y2="96" class="now"/><line id="at-line" x1="${x(d.line)}" x2="${x(d.line)}" y1="4" y2="96" class="at"/>${dots.join("")}${more.join("")}</svg>
    <div class="legend"><span><span class="sw same"></span>same</span><span><span class="sw diff"></span>different</span><span><span class="sw now"></span>the line, ${fmt(d.line)}</span></div>
    <input type="range" id="at" min="${lo}" max="${hi}" step="0.5" value="${d.line}" aria-label="Move the line"><div id="at-says" class="muted"></div>`;
  const says = () => {
    const at = Number($("at").value), right = (p, line) => (p.named && p.weight >= line) === (p.decision === "match");
    const fixes = pts.filter((p) => right(p, at) && !right(p, d.line)).length, breaks = pts.filter((p) => right(p, d.line) && !right(p, at)).length;
    box.querySelector("#at-line").setAttribute("x1", x(at)); box.querySelector("#at-line").setAttribute("x2", x(at));
    $("at-says").innerHTML = at === d.line ? `${plural(pts.length, "pair")} people decided${ruled ? ` · ${plural(ruled, "rule pair")} aside: no line moves them` : ""}` :
      `At ${fmt(at)}: ${fmt(fixes)} set right · <span class="${breaks ? "ink-bad" : ""}">${fmt(breaks)} set wrong</span> ${tryBtn({line: at}, `Try ${fmt(at)}`)}`;
  };
  $("at").oninput = says;
  says();
}

// Every pair the model weighed, as patterns: the step each comparison reached, coloured by its points; the pairs, their
// points, and what became of them. A pattern's examples open in the pair dialog.
async function patterns(box, trusted = false) {  // trusted: a trust line holds back what its sample hasn't proven
  const d = await run("run", "list patterns");
  if (d.event === "error" || !d.patterns.length) return;
  box.innerHTML = `<p class="faint" style="margin:0 0 8px">${plural(d.pairs, "pair")}, in ${fmt(d.patterns.length)} patterns: the step each comparison reached, and what became of them</p><div id="ptable"></div><div id="pex" class="chips" style="margin-top:10px"></div>`;
  const tone = (label, bits) => label === "missing" ? "" : bits >= 5 ? "strong" : bits > 0 ? "for" : "against";
  const then = (r) => {
    const some = [["merged", "merged", "good"], ["wait", "to review", "info"], ["held", trusted ? "waits for a check" : "not asked", ""], ["apart", "apart", ""]].filter(([k]) => r[k]);
    return some.length === 1 ? `<span class="chip ${some[0][2]}">${some[0][1]}</span>` : some.map(([k, w]) => `${fmt(r[k])} ${w}`).join(" · ");
  };
  const t = grid($("ptable"), d.patterns, [...d.fields, "pairs", "points", "then"], {filter: false, labels: Object.fromEntries(d.fields.map((f) => [f, comp(f)])),
    cell: (r, c) => c in r.steps ? (r.steps[c] === "missing" ? '<span class="faint">—</span>' : `<span class="chip ${tone(r.steps[c], r.bits[c])}" title="${esc(r.steps[c])}: ${r.bits[c] >= 0 ? "+" : ""}${r.bits[c]} points">${esc(level(r.steps[c]))}</span>`)
      : c === "points" ? `<span class="pts ${r.points >= 0 ? "for" : "against"}">${r.points >= 0 ? "+" : ""}${r.points.toFixed(1)}</span>` : c === "then" ? then(r) : esc(fmt(r[c])),
    onPick: (i) => {
      t.select(i);
      $("pex").innerHTML = d.patterns[i].examples.map((e) => `<button class="btn" data-x="${idList(e.id_l, e.id_r)}">${esc(e.id_l)} · ${esc(e.id_r)}</button>`).join("");
      $("pex").querySelectorAll("[data-x]").forEach((b) => b.onclick = () => explainDialog("run", ...JSON.parse(b.dataset.x)));
    }});
}

// The two review queues, and what differs between them: their commands, columns, keys, the card a row is shown in, and
// how answers are applied (decisions join entities at once; answers need a rerun, so the page reloads its new sheet).
const QUEUES = {
  kinds: {title: "Kinds", list: "list kinds", one: "answer kind", apply: "apply answers", applyLabel: "Apply answers", rerun: true, written: "answered",
          rows: (d) => d.kinds.map((r) => ({...r, decision: {1: "person", 2: "company", 0: "unsure"}[r.kind] ?? null})), cols: ["why", "id", "name", "engine_says"], labels: {why: "status", engine_says: "engine"}, some: "records to check",
          keys: {"1": "person", "2": "company", "0": "unsure"}, answer: (r, value) => ({id: r.id, kind: value}), card: kindCard},
};

const keyHint = (keys) => `<span class="keys">${keys.map(([k, what]) => `<kbd>${esc(k)}</kbd> ${esc(what)}`).join(" · ")} · <kbd>S</kbd> skip · <kbd>↑</kbd><kbd>↓</kbd> move</span>`;
// A card's head: what it shows, one of the list; the question it asks; why this one is asked.
const cardHead = (r, at, of, written, [ic, what, question], why) => `${scope(ic, `${what} · ${fmt(at + 1)} of ${fmt(of)}`)}
  <h2 class="question">${esc(question)} ${chip(r.status, written, r.decision)}</h2><p class="why">${esc(why)}</p>`;
let graph = null;  // the run's describe matching, which the cards draw their ladders and the line from

async function explainDialog(id, first, second) {  // how any pair of the run scored, from step 3's patterns or a customer's pairs
  const dlg = $("dlg");
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body wide"><h2>${esc(first)} · ${esc(second)}</h2><div class="faint">Loading…</div></div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn" value="close">Close</button></div></form>`;
  const box = dlg.querySelector(".dlg-body div");
  dlg.onclose = null;
  dlg.returnValue = "";
  dlg.showModal();
  const x = await run(id, "explain pair", {first, second});
  if (!box.isConnected) return;  // closed, and another opened
  if (x.event === "error") { box.innerHTML = banner(x); return; }
  dlg.querySelector("h2").textContent = `Why these two scored ${x.weight.toFixed(1)}`;
  box.className = "";
  box.innerHTML = pairBody(rowOf(x), remember(x));
}

const rowOf = (x) => Object.assign({id_l: x.id_l, id_r: x.id_r, match_weight: x.weight},  // explain pair's result, shaped as a review sheet row
  ...Object.keys(x.records[0]).filter((k) => k !== "id").map((k) => ({[`${k}_l`]: x.records[0][k], [`${k}_r`]: x.records[1][k]})),
  ...x.comparisons.map((c) => ({[c.comparison]: c.reached, [`${c.comparison}_bits`]: c.bits})));

const FN = {jaro_winkler: "Jaro–Winkler", jaro: "Jaro", jaccard: "Jaccard", levenshtein: "Levenshtein", damerau_levenshtein: "Damerau–Levenshtein", hamming: "Hamming"};
const decider = (x, c) => {  // the test that set a comparison's step: the first that passed, else the last that had both values
  const tests = x.tests.filter((t) => t.comparison === c);
  return tests.find((t) => t.passed) || tests.filter((t) => t.a !== null && t.b !== null).pop() || null;
};
const testText = (x, c, t) => {
  if (!t) return "not on both";
  const on = x.tests.some((o) => o.comparison === c && o.field !== t.field) ? ` ${words(t.field)}` : "";
  if (t.function === "exact") return `${t.passed ? "same" : "different"}${on || " value"}${t.normalize ? ", spelling aside" : ""}`;  // a test on prepared values: their spelling may differ
  const similar = ["jaro_winkler", "jaro", "jaccard"].includes(t.function);
  return `${FN[t.function]}${on} ${similar ? t.score.toFixed(3) : fmt(t.score)} ${t.passed ? (similar ? "≥" : "≤") : (similar ? "<" : ">")} ${t.threshold}`;
};
const big = (n) => n < 10 ? n.toFixed(1) : new Intl.NumberFormat("en", {notation: "compact", compactDisplay: "long", maximumSignificantDigits: 3}).format(n);  // odds: 2⁸ is 256, not 260
const odds = (w) => `about ${big(2 ** Math.abs(w))} to 1 that they are ${w >= 0 ? "the same" : "different"}`;  // points as odds: each point doubles them
let dropped = {rules: [], keys: []};  // what the workspace's method leaves out (describe method): no longer in the graph, still worded
const looks = (k) => { const g = (graph && (graph.nodes.find((n) => n.id === "candidates") || {generators: []}).generators.find((x) => x.name === k)) || dropped.keys.find((x) => x.name === k); return g ? keyWords(g) : k; };
const ruleSays = (name) => {  // a match rule by what it compares, not its name
  const r = (graph && (graph.nodes.find((n) => n.id === "rules") || {rules: []}).rules.find((x) => x.name === name)) || dropped.rules.find((x) => x.name === name);
  return r ? `a rule: ${[...r.exact.map((f) => `same ${words(f)}`), ...r.fuzzy.map(said)].join(", ")}` : name;
};
const found = (f) => [f.rule && ruleSays(f.rule), f.keys && `${f.keys.slice(0, 2).map(looks).join(" · ")}${f.keys.length > 2 ? ` · ${f.keys.length - 2} more` : ""}`,
                      f.people && `a person: ${f.people === "match" ? "same" : "different"}`].filter(Boolean).join(" and ");

// A pair as it scored: both records, their differences marked; then a waterfall from the points two random records
// start at, each comparison's step moving the total toward same (blue) or different (orange) of 0, where both are as
// likely, and the total as odds. No line: what merges is the trust line's, which people earn on step 4, not a pair's.
// With explain pair's result (x): the test that set each step, its letters on a click, what found the pair, and when it
// joins two customers, every pair across them.
const pairBody = (r, x) => recordsOf(r) + waterfallOf(r, x) + pairExtra(x);
function recordsOf(r) {  // the two records side by side, their differences marked
  const fields = Object.keys(r).filter((k) => k.endsWith("_l") && k !== "id_l" && `${k.slice(0, -2)}_r` in r).map((k) => k.slice(0, -2))
    .filter((f) => r[`${f}_l`] !== null || r[`${f}_r`] !== null);
  return `<div class="tablecard"><table><thead><tr><th></th><th>${esc(r.id_l)}</th><th>${esc(r.id_r)}</th></tr></thead><tbody>${fields.map((f) => {
      const [a, b] = highlight(r[`${f}_l`], r[`${f}_r`]);

const who = (svg, ids, ya, yb) => ids.forEach((id, k) => put(svg, "text", {x: 16, y: [ya, yb][k], "font-size": 11, class: "faint num"}, id));  // each row's record

async function sameBeat(svg, t) {  // exact: the two prepared values, letter for letter

async function jaccardBeat(svg, t) {  // the letters both hold, of all the letters either holds

async function sceneTest(svg, t, alive, ids = ["", ""]) {  // one test end to end: preparing the values, the function, the threshold; rows named by `ids`
  svg.setAttribute("viewBox", "0 0 560 336");
  if (t.prep.length && t.raw.some((r, k) => String(r) !== [t.a, t.b][k])) {

  }

  const shown = await (t.function === "jaro_winkler" || t.function === "jaro" ? jaroBeat : t.function === "jaccard" ? jaccardBeat : t.function === "exact" ? sameBeat : editsBeat)(svg, t, alive, ids);

// One pair's comparison, step by step in one small stage: each step asked as a question, its values shown and their
// differences marked, a ✗ or ✓ stamped on the step, stopping at the first ✓ with its points. And one record against
// its candidates: a row each, a sweep across the same steps, each row stopping at its own first ✓.

const sameLength = (a, b) => Array.from(a).length === Array.from(b).length;
function differ(A, B, fn) {  // the letters of each value that are not the other's: what the step finds different
  const a = Array.from(A ?? ""), b = Array.from(B ?? ""), ma = new Set(), mb = new Set();
  if (fn === "jaro_winkler" || fn === "jaro") {  // the letters Jaro found no partner for
    const tr = jaroTrace(A, B), la = new Set(tr.links.map(([i]) => i)), lb = new Set(tr.links.map(([, j]) => j));
    a.forEach((_, i) => { if (!la.has(i)) ma.add(i); }); b.forEach((_, j) => { if (!lb.has(j)) mb.add(j); });
    return [ma, mb, tr.links];
  }
  if (["levenshtein", "damerau_levenshtein", "hamming"].includes(fn)) {  // the letters in an edit
    let i = 0, j = 0;
    for (const [x, y, kind] of editTrace(A, B, fn).cols) {
      if (kind !== "same") { if (x) ma.add(i); if (y) mb.add(j); }
      if (x) i++; if (y) j++;
    }
    return [ma, mb, []];
  }
  if (sameLength(A, B)) a.forEach((c, k) => { if (c !== b[k]) { ma.add(k); mb.add(k); } });  // letter for letter
  else {  // the middle part where they differ, as the record table marks it
    let p = 0, s = 0;
    while (p < a.length && p < b.length && a[p] === b[p]) p++;
    while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
    for (let k = p; k < a.length - s; k++) ma.add(k);
    for (let k = p; k < b.length - s; k++) mb.add(k);
  }
  return [ma, mb, []];

function tick(svg, kind, cx, cy) {  // ✓, ✗ or –, drawn on its centre: a glyph's width and baseline differ by font
  const d = {yes: `M${cx - 5} ${cy} l3.5 3.5 l6.5 -7.5`, no: `M${cx - 4} ${cy - 4} l8 8 M${cx + 4} ${cy - 4} l-8 8`, none: `M${cx - 4} ${cy} h8`}[kind];
  const el = put(svg, "path", {d, fill: "none", stroke: tok({yes: "good", no: "bad", none: "faint"}[kind]), "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round"});

  move(el, [{transform: "scale(0)", opacity: 0}, {transform: "scale(1.3)", opacity: 1, offset: .6}, {transform: "scale(1)"}], 380);
  return el;
}

function answer(t) {  // the step's question, answered in its own words
  if (t.a === null || t.b === null) return "not on both";
  if (t.function === "exact") return t.passed ? "yes" : "no";
  const similar = ["jaro_winkler", "jaro", "jaccard"].includes(t.function);
  return similar ? `${FN[t.function]} ${t.score.toFixed(3)}, needs ${t.threshold}` : `${t.score} edit${t.score === 1 ? "" : "s"}, allows ${t.threshold}`;

async function compareScene(svg, x, c, alive) {  // returns the step it stopped at, as the engine's comparisons name it

  const tests = x.tests.filter((t) => t.comparison === c), labels = [...new Set(tests.map((t) => t.step))];
  if (tests.every((t) => t.a === null || t.b === null)) {  // nothing to compare: the comparison gives no points either way
    const on = [x.id_l, x.id_r].filter((_, k) => tests.some((t) => [t.a, t.b][k] !== null));
    svg.setAttribute("viewBox", "0 0 560 96");  // three lines: the scene as tall as what it says
    put(svg, "text", {x: 16, y: 30, "font-size": 15}, `not on both: no ${comp(c)} to compare`);
    put(svg, "text", {x: 16, y: 56, "font-size": 13, class: "faint"}, on.length ? `only ${on.join(" has one")} has one` : "neither has one");
    put(svg, "text", {x: 16, y: 82, "font-size": 13, class: "faint"}, "this comparison adds 0 points");

        const box = put(svg, "rect", {x: b.x - 2, y: b.y - 1, width: b.width + 4, height: b.height + 2, rx: 4, fill: tok("mark")});

      }

  };
  for (const [i, label] of labels.entries()) {
    if (!alive()) return;
    const ch = chips[i];
    ch.r.setAttribute("stroke", tok("primary")); ch.t.style.fill = tok("primary");
    let pass = null, said = [];
    tell(`${level(label)}?`);
    for (const t of tests.filter((u) => u.step === label)) {
      if (!alive()) return;
      if (t.a !== null && t.b !== null) await draw(t);
      said.push(`${tests.filter((u) => u.step === label).length > 1 ? `${words(t.field)}: ` : ""}${answer(t)}`);
      tell(`${level(label)}? ${said.join(" · ")}`);

    }

      return label;
    }
    await beat(250);
  }
  tell(`none passed → different: ${reached ? reached.bits.toFixed(1) : ""} points`, tok("against-ink"));
  return "else";
}

async function lineupScene(svg, xs, c, alive) {  // one record, its candidates a row each; a sweep tries each step on every row
  const ref = xs[0].id_l, fields = xs[0].tests.filter((t) => t.comparison === c).map((t) => t.field);
  const main = fields.sort((p, q) => fields.filter((f) => f === q).length - fields.filter((f) => f === p).length)[0];  // the field most of its tests read
  const first = (x) => x.tests.find((t) => t.comparison === c && t.field === main);
  const labels = [...new Set(xs[0].tests.filter((t) => t.comparison === c).map((t) => t.step))];
  const more = xs.length - 8;
  xs = xs.slice(0, 8);  // shortcut: 8 rows at most, the rest counted; a scroll if customers of more records get common
  const H = 104 + 46 * xs.length + (more > 0 ? 22 : 0), x0 = 286, W = (544 - x0) / labels.length;
  svg.setAttribute("viewBox", `0 0 560 ${H}`);
  const raw = (x, side) => (first(x).raw[side] ?? "—");
  put(svg, "text", {x: 16, y: 26, "font-size": 11, class: "faint num"}, `${ref} · this record · ${words(main)}`);
  const refName = put(svg, "text", {x: 16, y: 50, "font-size": Math.min(18, 520 / Math.max(Array.from(raw(xs[0], 0)).length, 1))}, raw(xs[0], 0));
  labels.forEach((l, i) => {  // the steps, as columns
    const words2 = level(l).split(/,? /), cx = x0 + (i + 0.5) * W;
    words2.forEach((w, k) => put(svg, "text", {x: cx, y: 70 + k * 13 - (words2.length - 1) * 6.5, "text-anchor": "middle", "font-size": 11, class: "faint"}, w));
  });
  await fade(refName);
  const rows = xs.map((x, k) => {
    const y = 108 + k * 46, name = raw(x, 1), R = Array.from(raw(xs[0], 0)), N = Array.from(name);
    put(svg, "text", {x: 16, y: y - 12, "font-size": 11, class: "faint num"}, x.id_r);
    const step = Math.min(17, (x0 - 34) / Math.max(N.length, 1)), ls = N.map((ch, i) => put(svg, "text", {x: 16 + i * step, y: y + 6, "font-size": Math.min(15, step * 0.9)}, ch));
    const [, mb] = differ(R.join(""), N.join(""), "exact");
    if (mb.size > N.length / 2) mb.clear();  // wholly different: its ✗ say so
    for (const i of mb) { const b = ls[i].getBBox(); svg.insertBefore(put(svg, "rect", {x: b.x - 1, y: b.y, width: b.width + 2, height: b.height, rx: 3, fill: tok("mark")}), svg.firstChild); }
    put(svg, "path", {d: `M16 ${y + 22}H544`, stroke: tok("line")});
    const result = put(svg, "text", {x: 150, y: y - 12, "font-size": 12}, "");
    return {x, y, result, done: false};
  });
  if (more > 0) put(svg, "text", {x: 16, y: H - 10, "font-size": 12, class: "faint"}, `and ${more} more`);
  await beat(300);
  const band = put(svg, "rect", {x: x0, y: 82, width: W, height: H - 92, rx: 8, fill: tok("primary"), opacity: 0.08});
  svg.insertBefore(band, svg.firstChild);
  for (const [i, label] of labels.entries()) {
    if (!alive()) return;
    move(band, [{transform: `translateX(${Math.max(i - 1, 0) * W}px)`}, {transform: `translateX(${i * W}px)`}], i ? 300 : 1);
    await beat(300);
    for (const row of rows) {
      if (row.done) continue;
      const ts = row.x.tests.filter((t) => t.comparison === c && t.step === label), pass = ts.find((t) => t.passed);
      const none = ts.every((t) => t.a === null || t.b === null), cx = x0 + (i + 0.5) * W;
      tick(svg, pass ? "yes" : none ? "none" : "no", cx, row.y + 1);  // on the cell's centre, the row's middle
      if (pass) {
        row.done = label;
        const r = row.x.comparisons.find((q) => q.comparison === c);
        row.result.textContent = `${level(label)}${pass.field !== first(row.x).field ? ` · ${words(pass.field)}` : ""} · ${r.bits >= 0 ? "+" : ""}${r.bits.toFixed(1)}`;
        row.result.style.fill = tok("good");
        write(row.result);
      }
    }
    await beat(450);
  }
  move(band, [{opacity: 0.08}, {opacity: 0}], 300);
  for (const row of rows.filter((r) => !r.done)) {  // no step passed: different, or nothing to compare
    const none = row.x.tests.every((t) => t.comparison !== c || t.a === null || t.b === null), r = row.x.comparisons.find((q) => q.comparison === c);
    row.result.textContent = none ? "not on both · 0" : `different · ${r.bits.toFixed(1)}`;
    row.result.style.fill = tok(none ? "faint" : "against-ink");
    write(row.result);
  }
  return rows.map((row) => row.done || (row.x.tests.every((t) => t.comparison !== c || t.a === null || t.b === null) ? "missing" : "else"));  // where each row stopped
}

async function exampleOf(c, label) {  // a pair of this run that stopped at this step: the pattern with the most such pairs
  const d = await run(current, "list patterns");
  if (d.event === "error") return null;
  const p = d.patterns.filter((x) => x.steps[c] === label && x.examples.length).sort((a, b) => b.pairs - a.pairs)[0];
  return p ? p.examples : [];
}

async function playScene(a) {

  };
  place();

    const wait = say("comparing…");

function editOps(a, b, swaps) {  // the cheapest edits from a to b, as columns [a's letter, b's letter, same | edit | swap, swapped]
  const d = Array.from({length: a.length + 1}, (_, i) => Array.from({length: b.length + 1}, (_, j) => (i ? (j ? 0 : i) : j)));
  const swapped = (i, j) => swaps && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] && a[i - 1] !== b[j - 1];
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1), swapped(i, j) ? d[i - 2][j - 2] + 1 : Infinity);
  const ops = [];
  for (let i = a.length, j = b.length; i || j;) {
    if (swapped(i, j) && d[i][j] === d[i - 2][j - 2] + 1) { ops.push([a[i - 1], b[j - 1], "swapped"], [a[i - 2], b[j - 2], "swap"]); i -= 2; j -= 2; }
    else if (i && j && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) { ops.push([a[i - 1], b[j - 1], a[i - 1] === b[j - 1] ? "same" : "edit"]); i--; j--; }
    else if (i && d[i][j] === d[i - 1][j] + 1) { ops.push([a[i - 1], "", "edit"]); i--; }
    else { ops.push(["", b[j - 1], "edit"]); j--; }
  }
  return ops.reverse();
}

// A review page: the queue as a table, the picked row in a card beside it, answered by keyboard, one answer at a time.
async function review(el, which, note = "") {  // Review's person-or-company tab

  let i = Math.max(0, rows.findIndex((r) => r.status === "open")), pending = false;

      ${seg([[done, "var(--people)", q.written], [Math.max(rows.length - done, 0), "var(--line)", "open"]])}`;
  };
  const t = grid($("left"), rows, q.cols, {labels: q.labels, selected: i, cell: (r, c) => c === "why" ? chip(r.status === "open" ? r.why : r.status, q.written, r.decision) : c === "name" ? `<span class="clip" title="${esc(r.name)}">${esc(r.name)}</span>` : c === "engine_says" ? esc(kindSays(r[c])) : esc(fmt(r[c])),
                                           onPick: (k) => { i = k; show(); }});
  const move = (step) => { i = Math.min(rows.length - 1, Math.max(0, i + step)); show(); };
  const local = () => {  // the stepper's line, from the rows this page holds: no server call per answer
    const open = rows.filter((r) => r.why === "decide" && r.status === "open").length, w = rows.filter((r) => r.status === "written in").length;
    const line = open ? `${fmt(open)} to answer` : `${fmt(w)} ${q.written}, to apply`;

  };

    $("right").innerHTML = q.card(rows[i], i, rows.length);
