    where();
    $("right").querySelectorAll("[data-a]").forEach((b) => b.onclick = () => answer(b.dataset.a));
    $("right").querySelector("[data-skip]").onclick = () => move(1);
  };
  const applied = (e) => e.event === "error" ? $("note").innerHTML = banner(e)  // the page again: its rows, counts and lines as the workspace now says them
    : go(which, q.rerun ? `<div class="banner info">${icon("check")}<div><b>Answers applied: matched again, and these are the records still open.</b></div></div>` : q.applied(e));
  $("apply").onclick = () => q.rerun ? action(which, q.apply, q.applyLabel, applied) : run(which, q.apply).then(applied);
  const keys = Object.fromEntries(Object.entries(q.keys).map(([k, value]) => [k, () => answer(value)]));
  keyHandler = (k) => ({...keys, s: () => move(1), ArrowDown: () => move(1), ArrowUp: () => move(-1), j: () => move(1), k: () => move(-1)})[k];
  tally();
  show();
}

const EXAMPLE = [["ヤマモトマサヒゴ", "熊本県天草市有明町大浦1番26号"], ["ャマモトマサヒコ", "天草市有明町大浦1-26 コーポ山田306"], ["ャマモトマサヒコ", "1728 · 19710510"]];  // what it does, on records like yours
function emptyRun(d) {  // d: the workspace described, when the page has it
  if (!state.workspace) return `<div class="card welcome"><div class="qa"><div class="q"><h2 class="question">Give each entity one ID</h2>
      <p class="answer">Records of one person or company, written differently, are found and joined under one ID.</p></div>
      <span class="actions" style="margin-top:0"><button class="btn outlined" data-auto>${icon("wand")}Auto mode</button><button class="btn filled" data-pick>${icon("add")}Create a workspace</button></span></div>
    <div class="example">${EXAMPLE.map(([name, more]) => `<span class="node static"><span class="n">${esc(name)}</span><span class="faint">${esc(more)}</span></span>`).join("")}
      ${ARROW}<span class="node static one"><span class="top">${icon("customers")}one entity</span><span class="n">0000262688</span></span></div>
    <div class="faint" style="font-size:12px">example</div></div><div id="auto"></div><div id="continue"></div>`;
  return `<div class="card empty">${icon("folder")}<h2>Nothing matched in ${esc(baseName(state.workspace))} yet</h2>
    <div class="actions" style="justify-content:center">${d && d.inputs && d.inputs.length ? '<a class="btn filled" data-go="run">3 · Find matches</a>'
      : '<a class="btn filled" data-go="columns">2 · Prepare your data</a>'}</div></div>`;
}

async function notYet(el, id, failed = null) {  // a page whose work follows a run, before one (or a workspace): the next step, across the page; else why it failed
  const w = state.workspace ? await run(id, "describe workspace") : null, box = el.querySelector(".split") || $("out") || $("left");
  const html = !state.workspace || (w.event !== "error" && !w.records) ? emptyRun(w) : banner(failed || w);
  if (box.classList.contains("split")) box.outerHTML = `<div>${html}</div>`; else box.innerHTML = html;
}

// Auto mode: every step on one file, in a workspace of its own (try everything), then the report to send.
const AUTO = {workspace: "making a workspace", load: "reading the file", place: "placing the columns its contents suggest", describe: "describing the file again",
              check: "checking a run will go through", rehearse: "rehearsing at the file's size", resolve: "finding matches", method: "reading what the run shows",
              patterns: "counting the patterns", review: "counting the checks people need"};
const AUTO_NEXT = {workspace: "load", load: "check", place: "describe", describe: "check", check: "rehearse", rehearse: "resolve", resolve: "method", method: "patterns"};
const autoSays = (s) => AUTO[s] || (s.startsWith("trial") ? "trying a change of method" : s.startsWith("offers") ? "trying the names in another script" : s);
async function autoMode() {
  if (longRun) { snack(`<span class="msg">Wait for <code>${esc(longRun.command)}</code> to end</span>`, 4000); return; }  // one long command at a time
  if (current !== "records" || !$("auto")) await go("records");
  const box = $("auto");
  let t0 = 0, now = "", clock = 0;
  const say = () => {
    const a = box.querySelector(".steps-card .answer");
    if (!a || !box.isConnected) { clearInterval(clock); return; }  // the page was left: its card is gone
    a.textContent = `${Math.round((Date.now() - t0) / 1000)} s · now: ${now}`;
  };
  const step = (e) => {
    if (e.event === "start") {
      t0 = Date.now(); now = autoSays("workspace"); longRun = {command: "try everything", visit, page: "records"};
      for (const id of ["next", "out", "flow", "continue"]) if ($(id)) $(id).innerHTML = "";  // the workspace open before is not the one it makes
      box.innerHTML = `<div class="card steps-card"><div class="qa"><div class="q"><h2 class="question"><span class="spin" style="border-color:var(--primary);border-right-color:transparent"></span>Auto mode…</h2>
        <p class="answer"></p></div></div><ul class="steps"></ul></div>`;
      clearInterval(clock); clock = setInterval(say, 1000); say();
      return;
    }
    if (e.event !== "step") return;
    const [top, sub] = e.step.split(": ");
    if (sub === undefined) {  // one of its steps ended
      box.querySelector(".steps")?.insertAdjacentHTML("beforeend", `<li>${icon(e.ok === false ? "error" : "check")}${esc(e.step)} <span class="faint">${e.seconds.toFixed(1)} s</span></li>`);
      if (e.workspace) { useWorkspace(e.workspace); longRun.workspace = e.workspace; memoAt = -1; refresh(); }  // the page opens it from now on, should the person go elsewhere meanwhile
      now = AUTO_NEXT[top] ? autoSays(AUTO_NEXT[top]) : "the next step";
    } else now = `${autoSays(top)} · ${DOING[sub] || sub}`;
    say();
  };
  action("records", "try everything", "Run auto mode", (d) => {
    clearInterval(clock);
    if (longRun && longRun.command === "try everything") longRun = null;  // ended, or never started (another long command runs)
    if (d.event === "error") { box.innerHTML = banner(d); return; }
    setWorkspace(d.workspace);  // its Overview: the report to send
  }, step, {about: "A new workspace, every step on your file, and a report to send"});
}
const runningCard = (run) => `<div class="card"><div class="qa"><div class="q"><h2 class="question"><span class="spin" style="border-color:var(--primary);border-right-color:transparent"></span>${
  esc(BUSY[run.command] || (run.command === "try everything" ? "Auto mode" : run.command))}…</h2><p class="answer"><span class="run-line">${esc(task.line || "")}</span>${
  run.page === current ? " · it shows here when it ends" : ""}</p></div>${run.page && run.page !== current ? `<a class="btn filled" data-go="${run.page}">Open</a>` : ""}</div></div>`;  // a long run this page didn't draw: how far, and its page
const runsHere = () => longRun && longRun.page && (!longRun.workspace || longRun.workspace === state.workspace);  // a long run of this workspace
function sendCard(box, a) {  // the auto mode report: what to send, and a way to copy it
  box.innerHTML = `<div class="card"><div class="qa"><div class="q"><h2 class="question">What should I send?</h2><p class="answer">This report: it holds no record's value</p></div>
      <button class="btn filled" id="copy-report">${icon("copy")}Copy the report</button></div>
    <pre class="report" tabindex="0">${esc(a.markdown)}</pre><p class="faint" style="margin:0;font-size:12px;overflow-wrap:anywhere">${esc(a.report)}</p></div>`;
  const pre = box.querySelector(".report"), copied = () => snack(`${icon("check")}<span class="msg">Copied the report</span>`, 4000);
  const select = () => { getSelection().selectAllChildren(pre); pre.focus(); snack(`<span class="msg">Selected: press ⌘C or Ctrl-C to copy</span>`, 6000); };  // no clipboard here: the person copies
  $("copy-report").onclick = () => navigator.clipboard ? navigator.clipboard.writeText(a.markdown).then(copied, select) : select();
}

// The workspace picker, as a console's project picker: the workspaces on disk (list workspaces), or a new one.
async function pick() {
  const dlg = $("dlg"), list = await run("records", "list workspaces"), rows = list.workspaces || [];
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body"><h2>Choose a workspace</h2>
    <label class="field"><span class="lab">New workspace</span><span style="display:flex;gap:8px"><input type="text" id="new-name" placeholder="acme-2026" aria-label="New workspace name">
      <button type="button" class="btn filled" id="create">Create</button></span></label><div id="made"></div>
    ${rows.length ? `<span class="lab faint" style="font-size:12px">Open one</span><div class="tablecard"><table><tbody>${rows.map((w) =>
      `<tr class="pick" data-w="${esc(w.workspace)}"><td style="width:40px">${icon("folder")}</td><td>${esc(w.name)}</td><td class="faint">${fmt(w.files)} file${w.files === 1 ? "" : "s"} · ${w.ran ? "matched" : "not run yet"}</td>
       <td class="faint">${esc(String(w.last).slice(0, 10))}</td></tr>`).join("")}</tbody></table></div>` : ""}${banner(list)}</div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn" value="cancel" formnovalidate>Cancel</button></div></form>`;
  dlg.querySelectorAll("[data-w]").forEach((tr) => tr.onclick = () => { dlg.close(); setWorkspace(tr.dataset.w); });
  $("create").onclick = async () => {
    if (!$("new-name").value.trim()) { $("made").innerHTML = banner({event: "error", error: "Give it a name"}); $("new-name").focus(); return; }
    const d = await run("records", "create workspace", {name: $("new-name").value.trim()});
    if (d.event === "error") { $("made").innerHTML = banner(d); return; }
    dlg.close();
    current = "columns";  // a new workspace's next step
    setWorkspace(d.workspace);
  };
  $("new-name").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("create").click(); } };
  dlg.onclose = null;
  dlg.returnValue = "";
  dlg.showModal();
}
function useWorkspace(r) {  // the workspace every page reads from now on
  if (state.workspace !== r) $("search").value = "";  // a record ID of another workspace means nothing here
  state.workspace = r;
  store("workspace", r);  // per viewer: the workspace this browser opens with
  $("picker").innerHTML = `${icon("folder")}<span title="${esc(r)}">${esc(r ? `Workspace: ${baseName(r)}` : "Choose a workspace")}</span>${icon("down")}`;
}
function setWorkspace(r) {
  useWorkspace(r);
  go(current);
}

// Every command, from the declarations.
function help() {
  const dlg = $("dlg");
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body"><h2>Commands</h2><p class="about">Every button runs one of these, as <code>nayose VERB NOUN</code>; docs/commands.md has them all.</p>
    <div class="tablecard"><div class="tablewrap" style="max-height:50vh"><table><tbody>${Object.values(COMMANDS).map((c) => `<tr><td><code>${esc(c.name)}</code></td><td class="wrap">${esc(c.help)}</td></tr>`).join("")}</tbody></table></div></div></div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn filled" value="close">Close</button></div></form>`;
  dlg.onclose = null;
  dlg.showModal();
}

async function go(id, arg) {
  if (location.hash.slice(1) !== id) history[location.hash ? "pushState" : "replaceState"](null, "", `#${id}`);  // Back and Forward walk the steps; a reload keeps one
  current = id; keyHandler = null; visit++;
  sceneClose();
  document.body.classList.remove("nav-open");
  scrollTo(0, 0);  // a page opens at its top, not where the last one was left
  rail();
  await refresh(await SCREENS[id]($("screen"), arg));
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-go]");
  if (a) {  // a link to a page: with the tab, the record or the dialog it opens there
    e.preventDefault(); a.closest("dialog")?.close();
    const {go: to, tab, record} = a.dataset;
    go(to, tab ? {tab} : record ? {record} : "merge" in a.dataset ? {merge: true} : undefined);
  }
  if (e.target.closest("[data-pick]")) pick();
  if (e.target.closest("[data-auto]")) autoMode();
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey || $("dlg").open) return;
  if (e.key === "/") { e.preventDefault(); $("search").focus(); return; }
  const act = keyHandler && keyHandler(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (act) { e.preventDefault(); act(); }
});

(async () => {
  for (const [id, name] of [["menu", "menu"], ["search-ic", "search"], ["term-toggle", "terminal"], ["help", "help"], ["term-ic", "terminal"], ["term-clear", "clear"], ["term-close", "close"], ["task-fold", "down"], ["task-close", "close"]]) $(id).innerHTML = icon(name);
  const d = await api("/api/commands");
  if (!d.commands) { $("screen").innerHTML = `<div style="padding:24px">${banner({event: "error", error: d.error || "This page needs the link nayose open ui printed"})}</div>`; return; }
  COMMANDS = Object.fromEntries(d.commands.map((c) => [c.name, c]));
  state.home = d.home;
  $("menu").onclick = () => document.body.classList.toggle(matchMedia("(max-width: 860px)").matches ? "nav-open" : "collapsed");
  $("picker").onclick = pick;
  $("help").onclick = help;
  $("term-toggle").onclick = () => term.show($("term").hidden);
  $("term-close").onclick = () => term.show(false);
  $("term-clear").onclick = () => { $("term-body").innerHTML = ""; };
  $("task-fold").onclick = () => task.fold();
  $("task-close").onclick = () => { $("task").hidden = true; };  // the command runs on; the next one opens it again
  const tall = (h) => document.documentElement.style.setProperty("--term-h", `${Math.round(Math.min(innerHeight * 0.85, Math.max(120, h)))}px`);
  const keep = () => { try { localStorage.setItem("term-h", String($("term").offsetHeight)); } catch { /* not kept: the next visit starts at the default */ } };
  try { const h = Number(localStorage.getItem("term-h")); if (h) tall(h); } catch { /* the default */ }
  $("term-grip").onpointerdown = (e) => {  // the drawer's height, dragged by its top edge, kept for the next visit
    $("term-grip").setPointerCapture(e.pointerId);
    $("term-grip").onpointermove = (m) => tall(innerHeight - m.clientY);
  };
  $("term-grip").onpointerup = () => { $("term-grip").onpointermove = null; keep(); };
  $("term-grip").onkeydown = (e) => { if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); tall($("term").offsetHeight + (e.key === "ArrowUp" ? 40 : -40)); keep(); } };
  $("search").onkeydown = (e) => { if (e.key === "Enter" && $("search").value.trim()) { go("results", $("search").value.trim()); $("search").blur(); } };
  if (SCREENS[location.hash.slice(1)]) current = location.hash.slice(1);  // reloaded: the step it was on
  addEventListener("popstate", () => { const id = location.hash.slice(1); if (SCREENS[id] && id !== current) go(id); });
  setWorkspace(d.workspace || store("workspace") || "");
  rejoin();
})();
</script>
