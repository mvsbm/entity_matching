<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nayose</title>
<style>
:root {
  --bg: #f8fafd; --surface: #ffffff; --hover: #eef2f8; --sel: #d3e3fd; --sel-ink: #041e49;
  --primary: #0b57d0; --on-primary: #ffffff; --primary-soft: #e8f0fe;
  --ink: #1f1f1f; --muted: #444746; --faint: #747775; --outline: #c4c7c5; --line: #e3e3e3;
  --good: #146c2e; --good-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6; --warn: #7a5900; --warn-bg: #fef7e0;
  --mark: #fff4ce; --mark-ink: #3d2e00; --term: #1e1f20; --term-ink: #e3e3e3; --term-dim: #9aa0a6; --term-ok: #6dd58c; --term-bad: #f2b8b5;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131314; --surface: #1e1f20; --hover: #282a2c; --sel: #004a77; --sel-ink: #c2e7ff;
    --primary: #a8c7fa; --on-primary: #062e6f; --primary-soft: #1f3760;
    --ink: #e3e3e3; --muted: #c4c7c5; --faint: #8e918f; --outline: #5c5f5e; --line: #3c4043;
    --good: #6dd58c; --good-bg: #0f3d1f; --bad: #f2b8b5; --bad-bg: #4b1713; --warn: #fdd663; --warn-bg: #3d2f00;
    --mark: #4a3f10; --mark-ink: #ffe7a3; --term: #0e0e0f; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 14px/1.43 Roboto, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* the app bar */
.appbar { position: fixed; inset: 0 0 auto 0; height: 56px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px;
          background: var(--surface); border-bottom: 1px solid var(--line); }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.iconbtn:hover { background: var(--hover); }
.iconbtn[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); }
.logo { display: flex; align-items: center; gap: 8px; font-size: 20px; color: var(--ink); white-space: nowrap; margin-right: 8px; }
.mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 600; }
.picker { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid var(--outline); border-radius: 8px; background: transparent;
          cursor: pointer; max-width: 260px; }
.picker span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker:hover { background: var(--hover); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; height: 44px; padding: 0 14px; border-radius: 22px; background: var(--hover); color: var(--muted); }
.search input { flex: 1; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; outline: none; min-width: 0; }
.search kbd { border: 1px solid var(--outline); border-radius: 4px; padding: 0 5px; font-size: 12px; }

/* the side navigation */
.sidenav { position: fixed; top: 56px; bottom: 0; left: 0; width: 256px; overflow-y: auto; padding: 8px 12px 8px 0; background: var(--surface); border-right: 1px solid var(--line); z-index: 4; }
.sidenav h3 { margin: 16px 0 4px 24px; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--faint); text-transform: uppercase; }
.navitem { display: flex; align-items: center; gap: 16px; width: 100%; height: 40px; padding: 0 16px 0 24px; border: 0; border-radius: 0 20px 20px 0; background: transparent;
           cursor: pointer; text-align: left; color: var(--ink); font-weight: 500; }
.navitem:hover { background: var(--hover); }
.navitem[aria-current="page"] { background: var(--sel); color: var(--sel-ink); }
.navitem .count { margin-left: auto; font-size: 12px; color: var(--faint); }
body.collapsed .sidenav { width: 72px; }
body.collapsed .sidenav h3, body.collapsed .navitem span { display: none; }
body.collapsed main { margin-left: 72px; }

/* the page */
main { margin: 56px 0 0 256px; padding: 0 24px 120px; min-height: calc(100% - 56px); }
.pagehead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 64px; border-bottom: 1px solid var(--line); margin: 0 -24px 16px; padding: 8px 24px; background: var(--surface); }
.pagehead h1 { font-size: 22px; font-weight: 400; margin: 0 16px 0 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid transparent; background: transparent; cursor: pointer;
       font-weight: 500; letter-spacing: .01em; color: var(--primary); white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--primary-soft); }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.filled:hover { box-shadow: var(--shadow); filter: brightness(1.05); }
.btn.outlined { border-color: var(--outline); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn .badge { background: var(--on-primary); color: var(--primary); border-radius: 10px; padding: 0 7px; font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
.card h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; margin: 0 0 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.tile[data-go] { cursor: pointer; }
.tile[data-go]:hover { box-shadow: var(--shadow); }
.tile .k { color: var(--muted); font-size: 13px; }
.tile .v { font-size: 28px; font-weight: 400; margin-top: 4px; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
.panel-sticky { position: sticky; top: 72px; }

/* tables, with a filter bar */
.tablecard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; margin-bottom: 16px; }
.filterbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.filterbar input { flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; outline: none; }
.tablewrap { overflow: auto; max-height: 62vh; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
td.wrap { white-space: normal; }
thead th { position: sticky; top: 0; background: var(--surface); font-weight: 500; font-size: 12px; color: var(--muted); z-index: 1; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover { background: var(--hover); }
tbody tr[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); }
.tablefoot { padding: 8px 16px; color: var(--faint); font-size: 12px; }
tr.differ td.v { background: var(--mark); color: var(--mark-ink); }

/* status, banners, chips */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: var(--hover); color: var(--muted); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.info { background: var(--primary-soft); color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--primary-soft); color: var(--ink); }
.banner b { display: block; }
.banner .fix { color: var(--ink); margin-top: 2px; }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--primary); }
.inline { font: inherit; padding: 6px 8px; border: 1px solid var(--outline); border-radius: 4px; background: var(--surface); color: var(--ink); width: 100%; min-width: 14em; }
.field { display: block; margin: 0 0 16px; }
.field .lab { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input[type=text], .field select { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--outline); border-radius: 4px; background: var(--surface); color: var(--ink); }
.field .help { font-size: 12px; color: var(--faint); margin-top: 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; }
.big { font-size: 26px; margin: 4px 0 12px; }
.keys { color: var(--faint); font-size: 12px; }
kbd { border: 1px solid var(--outline); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, Menlo, monospace; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
a.link { color: var(--primary); cursor: pointer; text-decoration: none; font-weight: 500; }
a.link:hover { text-decoration: underline; }
.empty { text-align: center; padding: 48px 16px; }
.empty > .ic { width: 48px; height: 48px; color: var(--faint); stroke-width: 1.2; }
.empty h2 { justify-content: center; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.steps li { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.steps li .ic { color: var(--good); width: 18px; height: 18px; }
code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

/* the dialog */
dialog { border: 0; border-radius: 28px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 8px 28px rgba(0,0,0,.28); }
dialog::backdrop { background: rgba(0,0,0,.32); }
.dlg-body { padding: 24px 24px 8px; max-height: 70vh; overflow-y: auto; }
.dlg-body h2 { font-size: 22px; font-weight: 400; margin: 0 0 8px; }
.dlg-body p.about { color: var(--muted); margin: 0 0 20px; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 8px 16px 16px 24px; }
.dlg-foot .grow { flex: 1; }
.equiv { margin: 0 0 16px; background: var(--hover); border-radius: 8px; padding: 6px 6px 6px 12px; display: flex; gap: 8px; align-items: center; }
.equiv code { flex: 1; overflow-wrap: anywhere; }
.cmdline summary { cursor: pointer; font-size: 12px; color: var(--faint); margin: 4px 0 8px; }

/* the command drawer, at the bottom: every command the page ran */
.term { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: 260px; display: flex; flex-direction: column; background: var(--term); color: var(--term-ink); box-shadow: 0 -2px 8px rgba(0,0,0,.25); }
.term[hidden] { display: none; }
.term-bar { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 16px; border-bottom: 1px solid #3c4043; font-size: 13px; }
.term-bar .faint { color: var(--term-dim); }
.term-bar .iconbtn { color: var(--term-dim); width: 32px; height: 32px; }
.term-bar .iconbtn:hover { background: #2d2f31; }
.term-body { flex: 1; overflow-y: auto; padding: 8px 16px; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
.term-body .cmd::before { content: "$ "; color: var(--term-ok); }
.term-body .out { color: var(--term-dim); white-space: pre-wrap; }
.term-body .ok { color: var(--term-ok); }
.term-body .bad { color: var(--term-bad); white-space: pre-wrap; }
.term-body .faint { color: var(--term-dim); }
body.term-open main { padding-bottom: 300px; }

/* the snackbar */
.snack { position: fixed; left: 24px; bottom: 24px; z-index: 7; display: flex; align-items: center; gap: 12px; min-width: 288px; max-width: 560px; padding: 12px 16px; border-radius: 4px;
         background: #313033; color: #f4eff4; box-shadow: 0 4px 12px rgba(0,0,0,.3); font-size: 14px; }
.snack[hidden] { display: none; }
.snack code { overflow-wrap: anywhere; }
.snack .msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.snack .btn { color: #a8c7fa; height: 32px; padding: 0 8px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #a8c7fa; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } .panel-sticky { position: static; } }
@media (max-width: 860px) {
  .sidenav { transform: translateX(-100%); transition: transform .2s; width: 256px; box-shadow: var(--shadow); }
  body.nav-open .sidenav { transform: none; }
  main, body.collapsed main { margin-left: 0; padding: 0 16px 120px; }
  .pagehead { margin: 0 -16px 16px; padding: 8px 16px; }
  .logo .name, .search kbd { display: none; }
  .picker { max-width: 120px; }
  .appbar { gap: 4px; }
  #help { display: none; }
}

/* the workflow: who joined what, one color each, on every page */
:root { --rule: #00796b; --rule-bg: #e0f2f1; --model: #0b57d0; --model-bg: #e8f0fe; --people: #8e24aa; --people-bg: #f3e5f5; --neg: #c5221f; }
@media (prefers-color-scheme: dark) { :root { --rule: #4db6ac; --rule-bg: #10302d; --model: #a8c7fa; --model-bg: #1f3760; --people: #ce93d8; --people-bg: #3a1f40; --neg: #f28b82; } }

/* the stepper, in the navigation */
.rail { list-style: none; margin: 4px 0 0; padding: 0; }
.rail li { position: relative; }
.rail li:not(:last-child)::before { content: ""; position: absolute; left: 37px; top: 34px; bottom: -6px; width: 2px; background: var(--line); }
.rail li.done:not(:last-child)::before { background: var(--good); }
.navitem.step { height: auto; min-height: 52px; align-items: flex-start; padding-top: 8px; padding-bottom: 8px; }
.navitem .stack { display: flex; flex-direction: column; min-width: 0; }
.navitem .sub { font-size: 12px; font-weight: 400; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 600;
       border: 2px solid var(--outline); color: var(--faint); background: var(--surface); position: relative; z-index: 1; }
.dot .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.done .dot { border-color: var(--good); background: var(--good); color: #fff; }
.current .dot { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.attention .dot { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.attention .sub { color: var(--warn); font-weight: 500; }
.optional .dot { border-style: dashed; }
.loopitem { font-weight: 400; height: auto; min-height: 36px; }
.navitem:disabled { color: var(--faint); cursor: default; }
.navitem:disabled:hover { background: transparent; }
.search:has(input:disabled) { opacity: .6; }
body.collapsed .navitem .stack, body.collapsed .rail li::before { display: none; }

/* the flow strip: what this step computes, as chips joined by arrows */
.flow { display: flex; align-items: stretch; flex-wrap: wrap; gap: 6px 0; margin: 0 0 16px; }
.node { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 104px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line);
        background: var(--surface); cursor: pointer; text-align: left; }
.node:hover { box-shadow: var(--shadow); }
.node[aria-expanded="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.node .top { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.node .n { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--ink); }
.node.rule .top { color: var(--rule); } .node.model .top { color: var(--model); } .node.people .top { color: var(--people); }
.node.dim { opacity: .55; }
.arrow { display: flex; align-items: center; color: var(--outline); padding: 0 2px; }
.arrow svg { width: 26px; height: 14px; }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: -6px 0 16px; }
.detail h3 { font-size: 14px; font-weight: 500; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
.detail h3 small { font-weight: 400; color: var(--faint); }

/* bars, ladders, rulers: numbers drawn, not written */
.bars { display: grid; grid-template-columns: minmax(90px, max-content) 1fr max-content; gap: 4px 10px; align-items: center; font-size: 13px; }
.bars .lab { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .val { font-variant-numeric: tabular-nums; color: var(--faint); text-align: right; }
.bar { display: block; height: 10px; border-radius: 5px; background: var(--primary); min-width: 2px; }
.bar.rule { background: var(--rule); } .bar.people { background: var(--people); } .bar.neg { background: var(--neg); } .bar.good { background: var(--good); }
.bar.pick { cursor: pointer; } .bar.pick:hover { filter: brightness(1.15); }
.bits { display: block; position: relative; height: 10px; }
.bits::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--outline); }
.bits i { position: absolute; top: 0; height: 10px; border-radius: 5px; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; background: var(--hover); color: var(--muted); margin: 0 3px 0 0; white-space: nowrap; }
.diff { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.chain .to { color: var(--faint); }
.ladder { display: inline-flex; gap: 3px; vertical-align: middle; }
.ladder i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--outline); }
.ladder i.on { background: var(--model); border-color: var(--model); }
.ladder i.on.neg { background: var(--neg); border-color: var(--neg); }
.ruler { width: 100%; height: 74px; margin-top: 8px; }
.ruler text { font: 11px system-ui, sans-serif; fill: var(--muted); }
.ruler.hist text { font-size: 7px; }  /* this one is drawn taller: its labels stay at label size */
.slider { position: relative; height: 54px; margin: 8px 0 4px; }
.slider .track { position: absolute; left: 0; right: 0; top: 20px; height: 8px; border-radius: 4px;
                 background: linear-gradient(90deg, var(--model-bg), var(--hover) 50%, var(--people-bg)); }
.slider .mid { position: absolute; left: 50%; top: 14px; height: 20px; width: 1px; background: var(--outline); }
.slider .pin { position: absolute; top: 15px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: var(--shadow); }
.slider .pin.engine { background: var(--ink); } .slider .pin.name { background: var(--surface); border: 3px solid var(--faint); }
.slider .ends { position: absolute; left: 0; right: 0; top: 36px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.slider .pin span { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--faint); white-space: nowrap; }
.web { width: 100%; max-width: 460px; height: 240px; display: block; margin: 0 auto 8px; }
.web text { font: 11px system-ui, sans-serif; fill: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.stepfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.stepfoot .grow { flex: 1; }
.stepfoot .btn { white-space: normal; height: auto; min-height: 36px; text-align: left; }
.next { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; background: var(--primary-soft); margin-bottom: 16px; }
.next b { font-weight: 500; }

/* how much a part of the page covers: all the records (a grey band), some of them (a list), one (a card with a blue edge) */
.zone.all { background: var(--hover); border-radius: 14px; padding: 10px 14px 0; margin: 0 0 16px; }
.zone.all .flow { margin-bottom: 10px; }
.zone.all .detail { margin: 0 0 14px; }
.scope { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scope .ic, .path .ic { width: 16px; height: 16px; }
.card.one { border-left: 4px solid var(--primary); }
.card h2.question { font-size: 22px; font-weight: 400; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.why { color: var(--muted); margin: 0 0 12px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: -6px 0 14px; font-size: 13px; color: var(--muted); }
.path:empty { display: none; }
.path span { display: inline-flex; align-items: center; gap: 4px; }
.path span:last-of-type { color: var(--ink); font-weight: 500; }
.path i { font-style: normal; color: var(--faint); }
.empty .flow { justify-content: center; margin: 20px 0 24px; }
.node.static { cursor: default; max-width: 210px; }
.node.static:hover { box-shadow: none; }
.loadrow { display: flex; gap: 8px; } .loadrow input { flex: 1; min-width: 0; }
.tray .trayhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .tray .trayhead .btn:first-of-type { margin-left: auto; }
.colchip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--outline);
           background: var(--surface); font-size: 12px; cursor: grab; white-space: nowrap; user-select: none; }
.colchip.used { opacity: .45; } .colchip.in { background: var(--primary-soft); border-color: transparent; } .colchip.gone { text-decoration: line-through; opacity: .6; }
.colchip.ghost { border-style: dashed; border-color: var(--primary); color: var(--primary); background: transparent; cursor: default; }
.colchip .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; padding: 0 0 0 2px; }
.colchip .x.keep { color: var(--primary); font-weight: 600; }
.fgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.fgroup summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; }
.fgroup summary::-webkit-details-marker { display: none; }
.fgroup summary::before { content: "▸"; color: var(--faint); width: 12px; }
.fgroup[open] summary::before { content: "▾"; }
.fgroup b { font-weight: 500; }
.gstat { margin-left: auto; font-size: 12px; color: var(--faint); } .gstat.bad { color: var(--bad); } .gstat.warn { color: var(--warn); }
.frow { display: grid; grid-template-columns: 180px minmax(220px, 1fr) 110px minmax(0, 200px) 120px; gap: 10px; align-items: center;
        padding: 6px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.frow[data-depth="1"] .flab { padding-left: 14px; }
.frow .flab { color: var(--muted); white-space: nowrap; } .frow .need { color: var(--bad); font-weight: 500; font-size: 11px; }
.drop { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 32px; padding: 2px; border-radius: 8px; }
.drop.over, .colchip.over { outline: 2px dashed var(--primary); outline-offset: 1px; }
.drop .hole { color: var(--faint); border: 1px dashed var(--outline); border-radius: 13px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.drop .else, .drop .plus { color: var(--faint); font-size: 11px; }
.drop select { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--ink); }
.frow .fex { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .frow .fwarn { color: var(--warn); font-size: 12px; white-space: nowrap; }
.mini { border: 0; background: transparent; color: var(--primary); cursor: pointer; font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.mini:hover { background: var(--primary-soft); }
@media (max-width: 860px) { .frow { grid-template-columns: 1fr; gap: 4px; } }
@media (max-width: 600px) { .empty .flow { flex-direction: column; align-items: center; } .empty .flow .arrow { transform: rotate(90deg); } }
</style>
</head>
<body>
<header class="appbar">
  <button class="iconbtn" id="menu" aria-label="Show or hide the navigation"></button>
  <span class="logo"><span class="mark">名</span><span class="name">nayose</span></span>
  <button class="picker" id="picker" aria-label="Choose the workspace"></button>
  <label class="search"><span id="search-ic"></span><input id="search" type="search" placeholder="Look up a record ID" aria-label="Look up a record ID"><kbd>/</kbd></label>
  <button class="iconbtn" id="term-toggle" aria-label="Show the commands run" aria-pressed="false"></button>
  <button class="iconbtn" id="help" aria-label="Every command"></button>
</header>
<nav class="sidenav" id="nav" aria-label="Pages"></nav>
<main id="screen" aria-live="polite"></main>
<section class="term" id="term" hidden aria-label="Commands run">
  <div class="term-bar"><span id="term-ic"></span><b>nayose</b><span class="faint">every button runs one of these; each can be typed in a terminal as it is</span>
    <span style="flex:1"></span><button class="iconbtn" id="term-clear" aria-label="Clear"></button><button class="iconbtn" id="term-close" aria-label="Close"></button></div>
  <div class="term-body" id="term-body"></div>
</section>
<div class="snack" id="snack" hidden role="status"></div>
<dialog id="dlg"></dialog>

<script type="application/json" id="layout">
{"workflow": {"steps": ["workspace", "columns", "run", "pairs", "kinds", "results"],
  "loops": [{"name": "Add new records", "icon": "add", "screen": "run", "via": ["match records", "add records"], "to": "pairs"},
            {"name": "Run matching again", "icon": "refresh", "screen": "run", "via": ["rerun records"], "to": "pairs"}]},
 "screens": [
  {"id": "records", "title": "Overview", "icon": "overview", "what": "The whole workflow, and what it did with your records.",
   "strip": ["records", "prepare", "rules", "candidates", "score", "accept", "people", "group", "customers"],
   "uses": [{"command": "describe workspace", "args": {"workspace": "@workspace"}, "reads": ["records", "entities", "runs", "pairs", "kinds", "set_aside", "write_owed", "inputs"]},
            {"command": "describe matching", "args": {"workspace": "@workspace"}, "reads": ["nodes", "edges"]},
            {"command": "list workspaces", "args": {"home": "@home"}, "reads": ["home", "workspaces"]},
            {"command": "create workspace", "args": {"name": "@name", "home": "@home"}, "reads": ["workspace"]}]},
  {"id": "columns", "title": "Prepare your data", "icon": "columns", "what": "Which of your columns hold each field, and how each value is made comparable.",
   "strip": ["records", "prepare"],
   "uses": [{"command": "load records", "args": {"input": "@input", "workspace": "@workspace"}, "reads": ["columns", "slots", "features", "placements", "fields", "needed", "loaded"]},
            {"command": "describe records", "args": {"input": "@loaded", "workspace": "@workspace"}, "reads": ["columns", "slots", "features", "placements", "fields", "needed"]},
            {"command": "set feature", "args": {"mapping": "@mapping", "workspace": "@workspace"}, "reads": ["slots"]},
            {"command": "describe workspace", "args": {"workspace": "@workspace"}, "reads": ["inputs"]},
            {"command": "describe matching", "args": {"workspace": "@workspace"}, "reads": ["nodes"]}]},
  {"id": "run", "title": "Find matches", "icon": "run", "what": "Rules settle the certain pairs; the rest are listed, scored and accepted at the line; linked records become one customer.",
   "strip": ["records", "rules", "candidates", "score", "accept", "group", "customers"],
   "uses": [{"command": "resolve records", "args": {"input": "@input", "workspace": "@workspace", "overwrite": "@overwrite", "compute": "@compute"}, "form": ["input", "overwrite"], "reads": ["summary", "seconds"]},
            {"command": "add records", "args": {"input": "@input", "workspace": "@workspace", "compute": "@compute"}, "form": ["input"], "reads": ["summary"]},
            {"command": "match records", "args": {"input": "@input", "workspace": "@workspace"}, "form": ["input"], "reads": ["counts", "records"]},
            {"command": "rerun records", "args": {"workspace": "@workspace", "compute": "@compute"}, "form": [], "reads": ["summary"]},
            {"command": "describe matching", "args": {"workspace": "@workspace"}, "reads": ["nodes"]}]},
  {"id": "pairs", "title": "Review possible matches", "icon": "pairs", "what": "Close calls, just below the line, and pairs with no name compared: you decide.",
   "strip": ["score", "accept", "people", "group"],
   "uses": [{"command": "list pairs", "args": {"workspace": "@workspace", "open": true}, "reads": ["pairs", "counts"]},
            {"command": "decide pair", "args": {"first": "@first", "second": "@second", "decision": "@decision", "workspace": "@workspace"}, "reads": ["decision"]},
            {"command": "apply decisions", "args": {"workspace": "@workspace"}, "reads": ["decisions", "matches", "clusters_joined", "summary"]},
            {"command": "describe matching", "args": {"workspace": "@workspace"}, "reads": ["nodes"]}]},
  {"id": "kinds", "title": "Confirm person or company", "icon": "kinds", "what": "Records the engine holds back, and a sample that sharpens it: person or company?",
   "strip": ["records", "kind", "score"],
   "uses": [{"command": "list kinds", "args": {"workspace": "@workspace", "open": true}, "reads": ["kinds", "counts"]},
            {"command": "answer kind", "args": {"id": "@id", "kind": "@kind", "workspace": "@workspace"}, "reads": ["kind"]},
            {"command": "apply answers", "args": {"workspace": "@workspace", "compute": "@compute"}, "form": [], "reads": ["summary"]},
            {"command": "describe matching", "args": {"workspace": "@workspace"}, "reads": ["nodes"]}]},
  {"id": "results", "title": "View customers", "icon": "customers", "what": "Every customer, and what joined its records.",
   "strip": ["group", "customers"],
   "uses": [{"command": "describe workspace", "args": {"workspace": "@workspace"}, "reads": ["summary", "largest"]},
            {"command": "describe entity", "args": {"id": "@id", "workspace": "@workspace"}, "reads": ["entity", "records", "links"]},
            {"command": "describe matching", "args": {"workspace": "@workspace"}, "reads": ["nodes"]}]}
]}
</script>
<script>
"use strict";
const LAYOUT = JSON.parse(document.getElementById("layout").textContent);
const token = new URLSearchParams(location.search).get("token") || "";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "—").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v) => v === null || v === undefined ? "—" : typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(2)) : typeof v === "boolean" ? (v ? "yes" : "no") : String(v);
const pct = (v) => v === null || v === undefined ? "—" : `${Math.round(v * 100)}%`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = (k, v) => { try { if (v !== undefined) localStorage.setItem(`nayose.${k}`, v); return localStorage.getItem(`nayose.${k}`); } catch { return null; } };
const words = (s) => String(s).replaceAll("_", " ");

// Line icons, drawn here: nothing comes from the network.
const ICON = {
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',
  overview: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  columns: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>',
  run: '<path d="M8 5.5v13l10-6.5z"/>',
  pairs: '<rect x="3" y="6" width="8" height="12" rx="2"/><rect x="13" y="6" width="8" height="12" rx="2"/><path d="M11 12h2"/>',
  kinds: '<circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M15 10h6v9h-6M17 13h2M17 16h2"/>',
  customers: '<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2.5 19a5.5 5.5 0 0 1 11 0M10.5 19a5.5 5.5 0 0 1 11 0"/>',
  records: '<path d="M4 6h16M4 10h16M4 14h16M4 18h10"/>',
  wand: '<path d="M4 20l11-11M14 4v2M18 6l-1.5 1.5M20 10h-2M13 9l2 2"/>',
  rule: '<path d="M5 7h9M5 12h14M5 17h9M17 15l2 2 3-4"/>',
  fan: '<path d="M4 12h5M9 12l9-6M9 12h11M9 12l9 6"/>',
  scale: '<path d="M12 4v16M5 20h14M6 8h12M6 8l-3 6h6zM18 8l-3 6h6z"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
  tick: '<path d="M6 12.5l4 4L18 8"/>',
  person: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  group: '<circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M11 8.2L7.2 15.8M13 8.2l3.8 7.6M8.5 18h7"/>',
  add: '<path d="M12 5v14M5 12h14"/>',
  refresh: '<path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  clear: '<path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>',
  error: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
  down: '<path d="M7 10l5 5 5-5"/>',
  empty: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M9 14h6"/>',
  stack: '<path d="M12 4l9 4.5-9 4.5-9-4.5z"/><path d="M3 12.5l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"/>',
};
const icon = (name) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;

let COMMANDS = {}, current = "records", keyHandler = null, steps = {};
const state = {};

async function api(path, body) {  // the page's one network call: a lost server is a value, never a throw
  try {
    const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"X-Token": token, "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
    return await r.json();
  } catch {
    return {error: "Lost the server: is nayose open ui still running?", fix: "Start it again, then reload this page."};
  }
}
const screen = (id) => LAYOUT.screens.find((s) => s.id === id);
const use = (id, command) => screen(id).uses.find((u) => u.command === command);

function argsFor(id, command, extra) {
  const args = {};
  for (const [k, v] of Object.entries(use(id, command).args)) {
    const value = typeof v === "string" && v.startsWith("@") ? (extra[v.slice(1)] ?? state[v.slice(1)]) : v;
    if (value !== undefined && value !== "" && value !== null) args[k] = value;
  }
  return args;
}

// ---------- the command drawer and the snackbar ----------

const term = {
  add(line) {
    const div = document.createElement("div");
    div.innerHTML = `<div class="cmd">${esc(line)}</div><div class="out"></div><div class="state faint">running…</div>`;
    $("term-body").append(div);
    $("term-body").scrollTop = $("term-body").scrollHeight;
    return {
      step: (e) => { div.querySelector(".out").textContent += `${e.step.padEnd(11)} ${e.seconds.toFixed(1).padStart(6)} s\n`; },
      end: (e, code) => {
        const s = div.querySelector(".state");
        s.className = code === 0 ? "ok" : "bad";
        s.textContent = code === 0 ? "✓ done" : `✗ exit ${code}${e && e.error ? `: ${e.error}${e.fix ? `\n  ${e.fix}` : ""}` : ""}`;
        $("term-body").scrollTop = $("term-body").scrollHeight;
      },
    };
  },
  show(open = true) {
    $("term").hidden = !open;
    document.body.classList.toggle("term-open", open);
    $("term-toggle").setAttribute("aria-pressed", String(open));
    if (open) $("term-body").scrollTop = $("term-body").scrollHeight;
  },
};
let snackTimer = null;
function snack(html, ms = 0) {
  clearTimeout(snackTimer);
  $("snack").innerHTML = html;
  $("snack").hidden = false;
  const view = $("snack").querySelector("[data-term]");
  if (view) view.onclick = () => term.show(true);
  if (ms) snackTimer = setTimeout(() => { $("snack").hidden = true; }, ms);
}

// Run one command as the layout places it, its arguments filled from what the person typed or chose. The same command
// with the same arguments, asked again while it runs, is that run: a write is never sent twice. A page left while its
// command runs draws nothing from it: its events and its result go nowhere, and the command runs on.
const inflight = new Map();
let visit = 0;  // one per page drawn (go)
function run(id, command, extra = {}, onEvent = null) {
  const args = argsFor(id, command, extra), key = JSON.stringify([command, args]), mine = visit;
  const here = () => mine === visit;
  if (!inflight.has(key)) inflight.set(key, runOnce(command, args, onEvent && ((e) => here() && onEvent(e))).finally(() => inflight.delete(key)));
  return inflight.get(key).then((r) => here() ? r : new Promise(() => {}));  // never settles: the page that asked is gone
}

async function runOnce(command, args, onEvent) {
  const quick = COMMANDS[command].quick, failed = (j) => ({event: "error", error: j.error, fix: j.fix || ""});
  const started = await api("/api/run", {command, args});
  if (started.error) return failed(started);
  const entry = term.add(started.command);
  if (!quick) snack(`<span class="spin"></span><span class="msg">Running <code>${esc(command)}</code></span>`);
  let from = 0, last = {};
  for (;;) {
    const j = await api(`/api/job/${started.job}?from=${from}`);
    if (j.error) {  // the server is gone: the command ends here, the page never waits forever
      entry.end(failed(j), 1);
      snack(`${icon("error")}<span class="msg">${esc(j.error)}</span>`, 6000);
      return failed(j);
    }
    for (const e of j.events) { last = e; if (e.event === "step") entry.step(e); if (onEvent) onEvent(e); }
    from += j.events.length;
    if (j.done) {
      entry.end(last, j.exit);
      if (!quick && j.exit === 0) refresh();  // the stepper, whichever page is open now
      if (!quick) snack(j.exit === 0 ? `${icon("check")}<span class="msg">Done <code>${esc(command)}</code></span>`
                                     : `${icon("error")}<span class="msg">Failed <code>${esc(command)}</code></span><button class="btn" data-term>View</button>`, 6000);
      return last;
    }
    await sleep(quick ? 120 : 300);
  }
}

// ---------- the workflow: six steps, each one's state read from the workspace ----------

const STEP = {workspace: "Choose a workspace", columns: "Prepare your data", run: "Find matches", pairs: "Review possible matches",
              kinds: "Confirm person or company", results: "View customers"};
const ORDER = LAYOUT.workflow.steps;
const STATE_WORD = {done: "done", current: "next", attention: "needs you", optional: "optional", later: "later"};

// Each step's state (done, current, attention, optional, later) and one-line status, from describe workspace's result.
function progress(d) {
  const ran = d && d.event !== "error" && d.records > 0, s = {};
  s.workspace = state.workspace ? {state: "done", line: state.workspace.split("/").filter(Boolean).pop()} : {state: "current", line: "choose one"};
  const files = (d && d.inputs) || [], last = files.length ? files[files.length - 1].name.replace(/^\d+-/, "") : "";
  s.columns = ran || last ? {state: "done", line: last ? `${last} loaded` : "ready"} : {state: state.workspace ? "current" : "later", line: "load your file"};
  s.run = ran ? {state: "done", line: `${fmt(d.records)} → ${fmt(d.entities)} customers`} : {state: last ? "current" : "later", line: last ? "ready to run" : "not yet"};
  if (!ran) {
    for (const k of ["pairs", "kinds", "results"]) s[k] = {state: "later", line: "after matching"};
  } else {
    const p = d.pairs, k = d.kinds;
    s.pairs = p.decide ? {state: "attention", line: `${fmt(p.decide)} to decide`}
      : p.written_in ? {state: "attention", line: `${fmt(p.written_in)} decided, to apply`} : {state: "done", line: "all decided"};
    s.kinds = k.decide ? {state: "attention", line: `${fmt(k.decide)} to decide`}
      : k.written_in ? {state: "attention", line: `${fmt(k.written_in)} answered, to apply`}
      : {state: "optional", line: k.measure ? `${fmt(k.measure)} to check` : "nothing to check"};
    s.results = {state: "done", line: `${fmt(d.entities)} customers`};
  }
  const next = ORDER.find((id) => ["current", "attention"].includes(s[id].state)) || "results";
  if (s[next].state !== "attention") s[next] = {...s[next], state: "current"};
  return {steps: s, next};
}

function rail() {  // the stepper: the navigation, in the order the work is done
  const p = steps.steps || {}, ran = p.run && p.run.state === "done";
  const here = !state.workspace && current === "records" ? "workspace" : current;  // with no workspace, the Overview is step 1
  const at = (id) => `aria-current="${id === here ? "page" : "false"}"`;
  $("nav").innerHTML = `<button class="navitem" data-screen="records" ${at("records")}>${icon("overview")}<span>Overview</span></button><ol class="rail">${ORDER.map((id, n) => {
    const s = p[id] || {state: "later", line: ""};
    const dot = s.state === "done" ? icon("tick") : s.state === "attention" ? "!" : n + 1;
    const go = id === "workspace" ? "data-pick" : `data-screen="${id}"`;
    return `<li class="${s.state}"><button class="navitem step" ${go} ${at(id)} title="${esc(STEP[id])}: ${esc(STATE_WORD[s.state])}">
      <span class="dot">${dot}</span><span class="stack"><span>${n + 1} · ${esc(STEP[id])}</span><span class="sub">${esc(s.line)}</span></span></button></li>`;
  }).join("")}</ol><h3>When things change</h3>${LAYOUT.workflow.loops.map((l, n) =>
    `<button class="navitem loopitem" data-loop="${n}" ${ran ? "" : "disabled"}>${icon(l.icon)}<span class="stack"><span>${esc(l.name)}</span>${
      ran ? "" : '<span class="sub">after the first run</span>'}</span></button>`).join("")}`;
  $("nav").querySelectorAll("[data-screen]").forEach((b) => b.onclick = () => go(b.dataset.screen));
  $("nav").querySelectorAll("[data-loop]").forEach((b) => b.onclick = () => go(LAYOUT.workflow.loops[b.dataset.loop].screen, LAYOUT.workflow.loops[b.dataset.loop]));
}

async function refresh(d) {  // the stepper, from the page's own describe workspace when it made one, else from one of its own
  if (d === undefined && state.workspace) d = await run("records", "describe workspace");
  steps = progress(state.workspace ? d : null);
  rail();
  const ran = steps.steps.run.state === "done";
  $("search").disabled = !ran;
  $("search").placeholder = ran ? "Look up a record ID" : "Look up a record ID, after the first run";
  const s = steps.steps[current], chip = $("stepchip");
  if (s && chip) { chip.className = `chip ${s.state === "done" ? "good" : s.state === "attention" ? "warn" : "info"}`; chip.textContent = `${STATE_WORD[s.state]} · ${s.line}`; }
}

const head = (id, actions = "") => {
  const n = ORDER.indexOf(id), s = (steps.steps || {})[id];
  return `<div class="pagehead"><h1>${n >= 0 ? `<span class="faint">Step ${n + 1} of ${ORDER.length} · </span>` : ""}${esc(screen(id) ? screen(id).title : STEP[id])}</h1>${
    s ? `<span class="chip ${s.state === "done" ? "good" : s.state === "attention" ? "warn" : "info"}" id="stepchip">${esc(STATE_WORD[s.state])} · ${esc(s.line)}</span>` : ""}${actions}</div>
    <nav class="path" id="path" aria-label="What this page shows"></nav>`;
};

// How much each part of a page covers, as a label on it; the path under the heading strings them together, widest first.
const scope = (ic, text) => `<div class="scope">${icon(ic)}${esc(text)}</div>`;
const where = () => {  // one part is the band's own label: a path once the page narrows
  const parts = [...$("screen").querySelectorAll(".scope")].map((s) => `<span>${s.innerHTML}</span>`);
  $("path").innerHTML = parts.length > 1 ? parts.join("<i>›</i>") : "";
};

function stepFoot(id) {  // back and next, in the workflow's order
  const n = ORDER.indexOf(id), back = ORDER[n - 1], next = ORDER[n + 1];
  const link = (to, k, cls) => to === "workspace" ? `<button class="btn ${cls}" data-pick>${k}</button>` : `<a class="btn ${cls}" data-go="${to}">${k}</a>`;
  return `<div class="stepfoot">${back ? link(back, `← ${ORDER.indexOf(back) + 1} ${esc(STEP[back])}`, "") : ""}<span class="grow"></span>${
    next ? link(next, `Next: ${ORDER.indexOf(next) + 1} ${esc(STEP[next])} →`, "filled") : ""}</div>`;
}

// ---------- the flow strip: each stage of the pipeline as a chip, its details drawn, not written ----------

const NODE = {  // each stage in everyday words; describe matching's own name and method show on a click
  records: {icon: "records", name: "Records", word: "records", n: (x) => x.count},
  prepare: {icon: "wand", name: "Made comparable", word: "fields", n: (x) => x.fields.filter((f) => f.filled).length || null},
  rules: {icon: "rule", name: "Sure matches", word: "pairs", tone: "rule", n: (x) => x.pairs},
  candidates: {icon: "fan", name: "Compared", word: "pairs", n: (x) => x.pairs},
  score: {icon: "scale", name: "Weighed", word: "pairs", n: (x) => x.pairs},
  accept: {icon: "check", name: "Matched", word: "pairs", tone: "model", n: (x) => x.accepted},
  people: {icon: "person", name: "You decide", word: "pairs", tone: "people", n: (x) => x.to_decide},
  group: {icon: "group", name: "Customers formed", word: "customers", n: (x) => x.customers},
  kind: {icon: "kinds", name: "Person or company", word: "told apart", n: (x) => x.counts ? x.counts.company + x.counts.person : null},
  customers: {icon: "customers", name: "Customers", word: "customers", n: (x) => x.count},
};
const LEVEL = {exact: "same", "fold exact": "same, spelling aside", "fold JW high": "very similar", "JW high": "very similar", "given name": "same given name", "same address": "same",
               "fold JW low": "somewhat similar", "JW low": "somewhat similar", "address close": "nearly the same", "same postal": "same postal code",
               "one digit off": "1 digit different", else: "different", missing: "not given"};
const level = (l) => LEVEL[l] || l;
const comp = (c) => ({cif: "customer ID", birth: "birth date"})[c] || c;
const ARROW = '<span class="arrow"><svg viewBox="0 0 26 14" aria-hidden="true"><path d="M1 7h20M16 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>';

function strip(box, graph, ids, open = null) {
  const nodes = Object.fromEntries(graph.nodes.map((x) => [x.id, x])), all = nodes.records.count;
  box.className = "zone all";
  box.innerHTML = `${scope("stack", all === null ? "All records" : `All ${fmt(all)} records`)}<div class="flow">${ids.map((id, i) => {
    const x = nodes[id], k = NODE[id], n = k.n(x);
    return `${i ? ARROW : ""}<button class="node ${k.tone || ""} ${n === null || n === undefined ? "dim" : ""}" data-node="${id}" aria-expanded="false" title="${esc(x.name)}: ${esc(x.method || "")}">
      <span class="top">${icon(k.icon)}${esc(k.name)}</span><span class="n">${n === null || n === undefined ? "—" : fmt(n)}</span><span class="faint" style="font-size:12px">${esc(k.word)}</span></button>`;
  }).join("")}</div><div class="slot"></div>`;
  const slot = box.querySelector(".slot");
  const show = (id) => {
    box.querySelectorAll(".node").forEach((b) => b.setAttribute("aria-expanded", String(b.dataset.node === id && slot.dataset.open !== id)));
    if (slot.dataset.open === id) { slot.innerHTML = ""; slot.dataset.open = ""; return; }
    slot.dataset.open = id;
    slot.innerHTML = `<div class="detail"><h3>${esc(NODE[id].name)} <small>${esc(nodes[id].name)}: ${esc(nodes[id].method || "")}</small></h3>${(DETAIL[id] || (() => ""))(nodes[id], nodes)}</div>`;
    slot.querySelectorAll("[data-example]").forEach((b) => b.onclick = () => go("results", b.dataset.example));
  };
  box.querySelectorAll(".node").forEach((b) => b.onclick = () => show(b.dataset.node));
  if (open) show(open);
}

const bars = (rows, opts = {}) => {  // label, a bar whose length is the value, the value
  const max = Math.max(1, ...rows.map((r) => Math.abs(r.value ?? 0)));
  return `<div class="bars">${rows.map((r) => `<span class="lab" title="${esc(r.title || r.label)}">${esc(r.label)}</span>
    <span><span class="bar ${r.tone || opts.tone || ""} ${r.example ? "pick" : ""}" ${r.example ? `data-example="${esc(r.example)}" title="see a pair it found"` : ""}
      style="width:${r.value === null || r.value === undefined ? 0 : Math.max(1, 100 * Math.abs(r.value) / max)}%"></span></span>
    <span class="val">${r.text ?? fmt(r.value)}</span>`).join("")}</div>`;
};
const bitsBar = (v, max) => {  // a bit count drawn from the middle: right for, left against; 20 bits fill a side
  if (v === null || v === undefined) return '<span class="bits"></span>';
  const w = Math.min(50, 50 * Math.abs(v) / Math.min(max, 20));
  return `<span class="bits"><i style="${v >= 0 ? `left:50%;width:${w}%;background:var(--good)` : `right:50%;width:${w}%;background:var(--neg)`}"></i></span>`;
};
const NORM = {nfkc: "same width", strip_spaces: "no spaces", kana_fold: "kana folded", strip_legal_form: "no legal form", reverse: "reversed",
              initial: "initial", first3: "first 3", address: "address rules"};
const norm = (list) => list.map((n) => NORM[n] || words(n));
const SHAPE = {reverse: "reversed", initial: "initial", first3: "first 3"};  // the ones that change what a key compares
const keyName = (k) => `${words(k.field)}${k.normalize.filter((n) => SHAPE[n]).map((n) => ` ${SHAPE[n]}`).join("")}`;
const METHOD = {jaro_winkler: "≈", levenshtein: "edits", damerau_levenshtein: "edits", hamming: "digits off", exact: "="};
const test = (t) => `${words(t.field)} ${METHOD[t.function] || t.function}${t.threshold !== null && t.threshold !== undefined ? ` ${t.function === "jaro_winkler" ? "≥" : "≤"} ${t.threshold}` : ""}`;
const tags = (list) => list.map((x) => `<span class="tag">${esc(x)}</span>`).join("");

function highlight(a, b) {  // two values, the part where they differ marked in each
  a = String(a ?? ""); b = String(b ?? "");
  let i = 0, j = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const mark = (s) => `${esc(s.slice(0, i))}<span class="diff">${esc(s.slice(i, s.length - j))}</span>${esc(s.slice(s.length - j))}`;
  return a === b ? [esc(a), esc(b)] : [mark(a), mark(b)];
}

function chainOf(f) {  // a field's real value, step by step: the column as read, the field, each form it is compared as
  const e = f.example || {}, raw = Object.entries(e).find(([k]) => !k.includes("__") && k !== f.field);
  const seen = [raw && raw[1], e[f.field], ...Object.entries(e).filter(([k]) => k.startsWith(`${f.field}__`)).map(([, v]) => v)]
    .filter((v, n, all) => v !== undefined && v !== null && v !== all[n - 1]);
  return `<span class="chain">${seen.map((v, n) => n ? `<span class="to">▸</span>${highlight(seen[n - 1], v)[1]}` : esc(v)).join("") || '<span class="faint">no value</span>'}
    ${tags([...new Set([...norm(f.normalize), ...f.compared_as.flatMap(norm)])])}</span>`;
}

const DETAIL = {
  records: (x) => x.files && x.files.length ? tags(x.files.map((f) => f.split("/").pop())) : '<span class="faint">no run yet</span>',
  prepare: (x) => `<div class="bars" style="grid-template-columns:minmax(90px,max-content) 1fr 60px">${x.fields.map((f) =>
    `<span class="lab">${esc(words(f.field))}</span>${chainOf(f)}<span class="val">${pct(f.filled)}</span>`).join("")}</div>`,
  rules: (x) => bars(x.rules.map((r) => ({label: `${r.exact.map((f) => `= ${words(f)}`).concat(r.fuzzy.map((t) => test(t))).join(" · ")}`,
                                           title: `${r.stage}: ${r.name}`, value: r.pairs, tone: "rule", example: r.example && r.example[0]}))),
  candidates: (x) => bars(x.generators.slice().sort((a, b) => (b.pairs ?? 0) - (a.pairs ?? 0)).map((g) => ({
    label: `${{"same value": "=", "sorted neighbours": "↕", "TF-IDF nearest": "≈", "one letter deleted": "−1"}[g.method] || ""} ${g.keys.map(keyName).join(" + ")}`,
    title: `${g.method}${g.window ? `, window ${g.window}` : ""}${g.k ? `, ${g.k} nearest, cosine ≥ ${g.min_cosine}` : ""}: ${g.pairs ?? "—"} pairs, ${g.matched ?? "—"} matched`,
    value: g.pairs, text: g.pairs === null ? "—" : `${fmt(g.pairs)} · ✓${fmt(g.matched)}`, example: g.example && g.example[0]}))),
  score: (x) => {
    const max = Math.max(1, ...x.comparisons.flatMap((c) => c.levels.map((l) => Math.abs(l.bits ?? 0))), Math.abs(x.prior_bits ?? 0));
    return `<div class="bars" style="grid-template-columns:minmax(120px,max-content) minmax(120px,1fr) 56px">${x.comparisons.map((c) => c.levels.map((l, n) =>
      `<span class="lab" title="${esc(l.tests.map(test).join(" or ") || "anything else")}">${n ? "" : `<b>${esc(comp(c.name))}</b> `}${esc(level(l.label))}</span>${bitsBar(l.bits, max)}
       <span class="val">${l.bits === null || l.bits === undefined ? "—" : `${l.bits >= 0 ? "+" : ""}${l.bits.toFixed(1)}`}</span>`).join("")).join("")}
      <span class="lab"><b>starting doubt</b></span>${bitsBar(x.prior_bits, max)}<span class="val">${x.prior_bits === null ? "—" : x.prior_bits.toFixed(1)}</span></div>`;
  },
  accept: (x) => {
    if (!x.bands.length) return `${ruler([], x.threshold)}`;
    const bands = x.bands.map(([from, pairs, accepted]) => ({from: Number(from), pairs: Number(pairs), accepted: Number(accepted)})).filter((b) => b.from > -40);
    const max = Math.max(1, ...bands.map((b) => b.pairs)), w = 600 / bands.length, at = (v) => (bands.findIndex((b) => b.from >= v) + 0) * w;
    return `<svg class="ruler hist" style="height:150px" viewBox="0 0 600 90" role="img" aria-label="pairs by points, with the line at ${x.threshold} points">
      <rect x="${at(x.review_from)}" y="0" width="${at(x.threshold) - at(x.review_from)}" height="70" fill="var(--people-bg)"/>
      ${bands.map((b, i) => `<rect x="${i * w + 1}" y="${70 - 66 * Math.sqrt(b.pairs / max)}" width="${w - 2}" height="${66 * Math.sqrt(b.pairs / max)}" rx="2"
        fill="${b.accepted ? "var(--model)" : "var(--outline)"}"><title>${b.from} to ${b.from + 2} points: ${b.pairs} pairs</title></rect>`).join("")}
      <line x1="${at(x.threshold)}" x2="${at(x.threshold)}" y1="0" y2="74" stroke="var(--ink)" stroke-width="2"/>
      <text x="${at(x.threshold) + 4}" y="86">${x.threshold} points needed: matched →</text><text x="${at(x.review_from) - 3}" y="12" text-anchor="end" style="fill:var(--people)">you decide ▸</text>
      <text x="0" y="86">← fewer points</text></svg>`;
  },
  people: (x) => bars([{label: "to decide", value: x.to_decide, tone: "people"}, {label: "decided", value: x.decided, tone: "people"}, {label: "joined by you", value: x.joined, tone: "people"}]),
  group: (x) => bars(x.sizes.map((s) => ({label: `${s.records} record${s.records > 1 ? "s" : ""}`, value: s.customers, text: `${fmt(s.customers)} customers`}))),
  kind: (x) => x.counts ? bars([{label: "company", value: x.counts.company}, {label: "person", value: x.counts.person}, {label: "not sure", value: x.counts.unsure, tone: "neg"}]) +
    `<div class="faint" style="margin-top:8px">${tags([`${x.legal_forms} legal forms`, `name model: 1–${x.ngram} letter chunks`])}</div>` : '<span class="faint">no run yet</span>',
  customers: (x, all) => DETAIL.group(all.group),
};

function ruler(parts, threshold, prior = 0) {  // evidence stacking from the start toward the line: matched past it
  const steps = [{label: "starting doubt", bits: prior}, ...parts], ends = [];
  let at = 0;
  for (const p of steps) { ends.push([at, at + p.bits, p]); at += p.bits; }
  const lo = Math.min(0, ...ends.flat().filter(Number.isFinite)), hi = Math.max(threshold + 2, ...ends.flat().filter(Number.isFinite));
  const x = (v) => 20 + 560 * (v - lo) / (hi - lo);
  return `<svg class="ruler" viewBox="0 0 600 74" role="img" aria-label="evidence: ${at.toFixed(1)} points, ${threshold} needed">
    ${ends.map(([a, b, p], i) => `<rect x="${Math.min(x(a), x(b))}" y="${10 + i * 4}" width="${Math.max(1.5, Math.abs(x(b) - x(a)))}" height="14" rx="3"
      fill="${p.bits >= 0 ? "var(--good)" : "var(--neg)"}" opacity="${i ? 0.85 : 0.55}"><title>${esc(p.label)}: ${p.bits >= 0 ? "+" : ""}${p.bits.toFixed(1)} points</title></rect>`).join("")}
    <line x1="${x(threshold)}" x2="${x(threshold)}" y1="2" y2="56" stroke="var(--ink)" stroke-width="2"/><text x="${x(threshold) + 4}" y="68">${threshold} needed · matched →</text>
    <line x1="${x(0)}" x2="${x(0)}" y1="2" y2="56" stroke="var(--outline)"/><text x="${x(0) - 4}" y="68" text-anchor="end">0</text>
    ${parts.length ? `<circle cx="${x(at)}" cy="${20 + steps.length * 2}" r="6" fill="var(--ink)"/><text x="${x(at)}" y="${46 + steps.length * 2}" text-anchor="middle" style="font-weight:600">${at.toFixed(1)}</text>` : ""}</svg>`;
}

function web(records, links) {  // a customer's records as dots, joined by what linked them: rule, model or person
  const n = records.length, r = n > 1 ? 85 : 0, turn = (i) => 2 * Math.PI * i / n - Math.PI / 2, at = (i, out) => [230 + out * Math.cos(turn(i)), 118 + out * Math.sin(turn(i))];
  const pos = Object.fromEntries(records.map((x, i) => [x.id, at(i, r)]));
  const label = (i) => {  // outside the circle, so no link runs through it
    if (!r) return `x="${pos[records[i].id][0]}" y="${pos[records[i].id][1] + 24}" text-anchor="middle"`;
    const [x, y] = at(i, r + 18), c = Math.cos(turn(i));
    return `x="${x}" y="${y + 4}" text-anchor="${c < -0.3 ? "end" : c > 0.3 ? "start" : "middle"}"`;
  };
  const tone = (by) => by === "fs" ? "var(--model)" : by.startsWith("people") ? "var(--people)" : "var(--rule)";
  return `<div class="legend"><span><i style="background:var(--rule)"></i>a rule</span><span><i style="background:var(--model)"></i>the model's points</span><span><i style="background:var(--people)"></i>a person</span></div>
    <svg class="web" viewBox="0 0 460 240" role="img" aria-label="${n} records joined by ${links.length} links">
    ${links.filter((l) => pos[l.id_l] && pos[l.id_r]).map((l) => { const [a, b] = [pos[l.id_l], pos[l.id_r]];
      return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${tone(l.by)}" stroke-width="3"><title>${esc(l.by)}${l.weight ? ` · ${l.weight.toFixed(1)} points` : ""}</title></line>
        ${l.weight ? `<text x="${(a[0] + b[0]) / 2}" y="${(a[1] + b[1]) / 2 - 4}" text-anchor="middle">${l.weight.toFixed(1)}</text>` : ""}`; }).join("")}
    ${records.map((x, i) => `<circle cx="${pos[x.id][0]}" cy="${pos[x.id][1]}" r="9" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
      <text ${label(i)}>${esc(x.id)}</text>`).join("")}</svg>`;
}

function slider(r) {  // where the engine and the name alone place a record, from person to company
  const at = (p) => 3 + 94 * p, e = Number(r.engine_p), n = Number(r.name_p), same = Math.abs(e - n) < 0.06;
  const pin = (p, cls, label) => Number.isNaN(p) ? "" : `<span class="pin ${cls}" style="left:${at(p)}%"><span style="transform:translateX(-${Math.round(100 * p)}%)">${label}</span></span>`;
  return `<div class="slider"><span class="track"></span><span class="mid"></span>${same ? "" : pin(n, "name", "name")}${pin(e, "engine", same ? "engine and name" : "engine")}
    <span class="ends"><span>${icon("person")} person</span><span>company ${icon("kinds")}</span></span></div>`;
}

// Step 2: the file's columns as chips, and each group's features and their parts as slots to drop them into. A slot shows
// its columns (else: read where the ones before are empty; +: joined), its share filled, an example, and a warning when
// few of its values look like it; ✦ Suggest shows what the file's contents place there, kept with ✓.
function features(d, view) {
  const slot = Object.fromEntries(d.slots.map((x) => [x.feature, x])), info = Object.fromEntries(d.columns.map((c) => [c.column, c]));
  const field = Object.fromEntries(d.fields.map((f) => [f.field, f])), lost = (f) => !field[f] || field[f].filled === null;
  const used = new Set(d.slots.flatMap((x) => x.alternatives.filter((a) => a.found).flatMap((a) => a.columns)));
  const ghost = Object.fromEntries(d.placements.map((x) => [x.feature, x]));
  const FEW = 0.5;  // under this share of values that look like the slot, the column is likely the wrong one
  const meter = (v) => v === null || v === undefined ? "" : `<span class="meter"><i style="width:${Math.round(v * 100)}%"></i></span>${pct(v)}`;
  const chipOf = (c, from, alt) => `<span class="colchip ${from ? "in" : used.has(c) ? "used" : ""} ${info[c] ? "" : "gone"}" draggable="true" data-col="${esc(c)}"
    ${from ? `data-from="${esc(from)}" data-alt="${alt}"` : ""} title="${info[c] ? `${pct(info[c].filled)} filled · ${esc(info[c].example ?? "")}` : "not in this file"}">${esc(c)}${
      from ? `<button class="x" data-x aria-label="Take ${esc(c)} off">×</button>` : ""}</span>`;
  const needs = (x) => (x.field && d.needed.every.includes(x.field) && lost(x.field)) ||
    (x.type === "person name" || x.field === "company_name") && d.needed.one_of.some((g) => g.every(lost));
  const row = (path, x, depth, last, shown) => {
    const s = slot[path], alts = s.sources.filter((a) => a.every((c) => info[c]));  // a column this file lacks is no column here
    const chips = alts.map((a, i) => (i ? '<span class="else">else</span>' : "") + a.map((c) => chipOf(c, path, i)).join('<span class="plus">+</span>')).join("");
    const g = shown && ghost[path];
    return `<div class="frow" data-depth="${depth}"><span class="flab">${depth ? (last ? "└ " : "├ ") : ""}${esc(x.name)}${x.script ? ` <span class="tag">${esc(x.script)}</span>` : ""}${
        needs(x) ? ' <b class="need">needed</b>' : ""}</span>
      <span class="drop" data-slot="${esc(path)}">${chips}${alts.length ? "" : '<span class="hole" tabindex="0">drop a column</span>'}${
        g ? `<span class="colchip ghost" title="${esc(g.why)}">✦ ${esc(g.column)}<button class="x keep" data-keep='${esc(JSON.stringify([path, g.column]))}' aria-label="Keep it">✓</button></span>` : ""}</span>
      <span class="fstat">${meter(s.filled)}</span><span class="fex faint">${esc(s.example ?? "")}</span>
      <span class="fwarn">${s.looks_right !== null && s.looks_right !== undefined && s.looks_right < FEW ? `⚠ ${pct(s.looks_right)} look right` : ""}</span></div>`;
  };
  const status = (g) => {
    const need = g.features.filter(needs);
    const paths = g.features.flatMap((f) => [`${g.group}/${f.name}`, ...(f.parts || []).map((p) => `${g.group}/${f.name}/${p.name}`)]);
    const bad = paths.filter((p) => slot[p].looks_right !== null && slot[p].looks_right !== undefined && slot[p].looks_right < FEW);
    const found = paths.filter((p) => slot[p].filled !== null).length;
    const either = need.every((f) => f.type === "person name" || f.field === "company_name");  // a run needs one of them
    return need.length ? ["bad", `✗ ${need.map((f) => f.name).join(either ? " or " : ", ")} needed`] : bad.length ? ["warn", `⚠ ${bad.map((p) => p.split("/").pop()).join(", ")}`]
      : ["", `${found} of ${paths.length} found`];
  };
  const waiting = d.placements.length;
  return `<div class="card tray"><div class="trayhead"><b>Columns in your file</b><span class="faint">drag one into a feature</span>
      ${waiting ? `<button class="btn" data-suggest="*">✦ ${view.ghosts.size ? "Hide" : "Suggest all"}</button>` : ""}${
        waiting && view.ghosts.size ? '<button class="btn filled" data-keepall="*">Keep all</button>' : ""}</div>
      <div class="chips">${d.columns.map((c) => chipOf(c.column)).join("")}</div></div>` +
    d.features.map((g) => {

// ---------- pieces every page draws with ----------

function banner(e, kind = "bad") {
  if (!e || e.event !== "error") return "";
  return `<div class="banner ${kind}" role="alert">${icon(kind === "bad" ? "error" : "info")}<div><b>${esc(e.error)}</b>${e.fix ? `<div class="fix">${esc(e.fix)}</div>` : ""}</div></div>`;
}
const WHY = {decide: "to decide", audit: "spot-check", measure: "sample"};
function chip(status, written = "decided") {
  const kind = {open: "", "written in": "warn", applied: "good", decide: "info"}[status] ?? "";

}
function summary(rows) {

}

// A table in a card, with a filter bar; rows the person can pick when onPick is given.
function grid(box, rows, cols, opts = {}) {
  const labels = {id_l: "record A", id_r: "record B", ...opts.labels}, cellOf = opts.cell || ((r, c) => esc(fmt(r[c]))), most = opts.most || 500;
  box.innerHTML = `<div class="tablecard">${opts.filter === false ? "" : `<div class="filterbar">${icon("search")}<input type="text" placeholder="Filter" aria-label="Filter the rows"></div>`}
    <div class="tablewrap"><table><thead><tr>${cols.map((c) => `<th${typeof (rows[0] || {})[c] === "number" ? ' class="num"' : ""}>${esc(labels[c] ?? c.replaceAll("_", " "))}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="tablefoot"></div></div>`;
  const body = box.querySelector("tbody"), foot = box.querySelector(".tablefoot"), filter = box.querySelector(".filterbar input");
  const draw = () => {
    const q = filter ? filter.value.trim().toLowerCase() : "";
    const shown = rows.map((r, i) => [r, i]).filter(([r]) => !q || cols.some((c) => String(r[c] ?? "").toLowerCase().includes(q)));
    const at = Math.max(0, Math.min(shown.findIndex(([, i]) => i === opts.selected) - 50, shown.length - most));  // the window holds the picked row
    body.innerHTML = shown.slice(at, at + most).map(([r, i]) => `<tr data-i="${i}" class="${opts.onPick ? "pick" : ""}" aria-selected="${i === opts.selected}">` +
      cols.map((c) => `<td${typeof r[c] === "number" ? ' class="num"' : ""}>${cellOf(r, c)}</td>`).join("") + "</tr>").join("") ||
      `<tr><td colspan="${cols.length}" class="faint">No rows</td></tr>`;
    foot.textContent = `${shown.length.toLocaleString()} of ${rows.length.toLocaleString()} rows` + (shown.length > most ? ` · ${(at + 1).toLocaleString()}–${(at + most).toLocaleString()} shown` : "");
    if (opts.onPick) body.querySelectorAll("tr[data-i]").forEach((tr) => tr.onclick = () => opts.onPick(Number(tr.dataset.i)));
  };
  if (filter) filter.oninput = draw;
  draw();
  return {
    select(i) {
      opts.selected = i;
      if (!body.querySelector(`tr[data-i="${i}"]`)) draw();  // outside the window drawn: draw the window around it
      body.querySelectorAll("tr[data-i]").forEach((tr) => tr.setAttribute("aria-selected", String(Number(tr.dataset.i) === i)));
      const tr = body.querySelector(`tr[data-i="${i}"]`), wrap = box.querySelector(".tablewrap");  // scroll the table, never the page
      if (!tr) return;
      const r = tr.getBoundingClientRect(), w = wrap.getBoundingClientRect(), top = w.top + box.querySelector("thead").offsetHeight;
      if (r.top < top) wrap.scrollTop -= top - r.top; else if (r.bottom > w.bottom) wrap.scrollTop += r.bottom - w.bottom;
    },
    redraw: draw,
  };
}

// A parameter's input, built from its declaration: a flag a checkbox, a choice a list, the rest a text box.
const FIELD = {input: "Records file"};  // a parameter's name on the page, where its own name says less
function field(command, name) {
  const p = COMMANDS[command].params.find((x) => x.name === name), id = `f-${name}`, needed = p.required || (p.positional && !p.optional);
  if (p.kind === "flag") return `<label class="check"><input type="checkbox" id="${id}"><span>${esc(p.help[0].toUpperCase() + p.help.slice(1))}</span></label>`;
  const control = p.choices.length ? `<select id="${id}">${p.choices.map((c) => `<option>${esc(c)}</option>`).join("")}</select>`
    : `<input type="text" id="${id}" placeholder="${esc(p.optional ? "the file loaded last" : p.metavar)}" ${needed ? "required" : ""}>`;
  return `<label class="field"><span class="lab">${esc(FIELD[name] || words(name))}${needed ? " *" : ""}</span>${control}</label>`;
}
function formValues(command, form) {
  const out = {};
  for (const name of form) {
    const p = COMMANDS[command].params.find((x) => x.name === name), el = $(`f-${name}`);
    out[name] = p.kind === "flag" ? el.checked : p.kind === "many" ? el.value.split(/\s+/).filter(Boolean) : el.value.trim();
  }

}

// A command in a dialog, as a console's create dialog: its form, the command line it will run, then run.
function action(id, command, label, done, onEvent = null) {
  const c = COMMANDS[command], form = use(id, command).form || [], dlg = $("dlg");
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body"><h2>${esc(label)}</h2>${form.map((n) => field(command, n)).join("")}
      <details class="cmdline"><summary>Command line</summary><div class="equiv">${icon("terminal")}<code id="equiv-line"></code>
        <button type="button" class="iconbtn" id="copy" aria-label="Copy the command line">${icon("copy")}</button></div></details></div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn filled" value="run">${esc(label)}</button></div></form>`;
  const preview = async () => {
    const d = await api("/api/run", {command, args: argsFor(id, command, formValues(command, form)), dry: true});
    $("equiv-line").textContent = d.command || d.error;
  };
  dlg.querySelectorAll("input, select").forEach((x) => x.oninput = preview);
  $("copy").onclick = () => navigator.clipboard?.writeText($("equiv-line").textContent);

async function flowOf(id, box, open = null) {  // the step's part of the pipeline: from describe matching
  const g = await run(id, "describe matching");

  strip(box, g, screen(id).strip, open);
  where();
  return g;
}

          rows: (d) => d.pairs, cols: ["status", "why", "id_l", "id_r", "match_weight"], labels: {match_weight: "points"}, some: "pairs to review",
