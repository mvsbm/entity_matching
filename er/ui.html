<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nayose</title>
<style>
:root {
  --bg: #f8fafd; --surface: #ffffff; --hover: #eef2f8; --sel: #d3e3fd; --sel-ink: #041e49;
  --primary: #0b57d0; --on-primary: #ffffff; --primary-soft: #e8f0fe;
  --ink: #1f1f1f; --muted: #444746; --faint: #747775; --outline: #c4c7c5; --line: #e3e3e3;
  --good: #146c2e; --good-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6; --warn: #7a5900; --warn-bg: #fef7e0;
  --mark: #fff4ce; --mark-ink: #3d2e00; --term: #1e1f20; --term-ink: #e3e3e3; --term-dim: #9aa0a6; --term-ok: #6dd58c; --term-bad: #f2b8b5;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131314; --surface: #1e1f20; --hover: #282a2c; --sel: #004a77; --sel-ink: #c2e7ff;
    --primary: #a8c7fa; --on-primary: #062e6f; --primary-soft: #1f3760;
    --ink: #e3e3e3; --muted: #c4c7c5; --faint: #8e918f; --outline: #5c5f5e; --line: #3c4043;
    --good: #6dd58c; --good-bg: #0f3d1f; --bad: #f2b8b5; --bad-bg: #4b1713; --warn: #fdd663; --warn-bg: #3d2f00;
    --mark: #4a3f10; --mark-ink: #ffe7a3; --term: #0e0e0f; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 14px/1.43 Roboto, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* the app bar */
.appbar { position: fixed; inset: 0 0 auto 0; height: 56px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px;
          background: var(--surface); border-bottom: 1px solid var(--line); }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.iconbtn:hover { background: var(--hover); }
.iconbtn[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); }
.logo { display: flex; align-items: center; gap: 8px; font-size: 20px; color: var(--ink); white-space: nowrap; margin-right: 8px; }
.mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 600; }
.picker { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid var(--outline); border-radius: 8px; background: transparent;
          cursor: pointer; max-width: 260px; }
.picker span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker:hover { background: var(--hover); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; height: 44px; padding: 0 14px; border-radius: 22px; background: var(--hover); color: var(--muted); }
.search input { flex: 1; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; outline: none; min-width: 0; }
.search kbd { border: 1px solid var(--outline); border-radius: 4px; padding: 0 5px; font-size: 12px; }

/* the side navigation */
.sidenav { position: fixed; top: 56px; bottom: 0; left: 0; width: 256px; overflow-y: auto; padding: 8px 12px 8px 0; background: var(--surface); border-right: 1px solid var(--line); z-index: 4; }
.sidenav h3 { margin: 16px 0 4px 24px; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--faint); text-transform: uppercase; }
.navitem { display: flex; align-items: center; gap: 16px; width: 100%; height: 40px; padding: 0 16px 0 24px; border: 0; border-radius: 0 20px 20px 0; background: transparent;
           cursor: pointer; text-align: left; color: var(--ink); font-weight: 500; }
.navitem:hover { background: var(--hover); }
.navitem[aria-current="page"] { background: var(--sel); color: var(--sel-ink); }
body.collapsed .sidenav { width: 72px; }
body.collapsed .sidenav h3, body.collapsed .navitem span:not(.dot) { display: none; }  /* each step's dot stays: its number, ✓ or ! */
body.collapsed main { margin-left: 72px; }

/* the page */
main { margin: 56px 0 0 256px; padding: 0 24px 120px; min-height: calc(100% - 56px); }
#screen > :not(.pagehead) { max-width: 1280px; }  /* wide screens: content keeps a readable width; the page head spans */
.pagehead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 64px; border-bottom: 1px solid var(--line); margin: 0 -24px 16px; padding: 8px 24px; background: var(--surface); }
.pagehead h1 { font-size: 22px; font-weight: 400; margin: 0 16px 0 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid transparent; background: transparent; cursor: pointer;
       font-weight: 500; letter-spacing: .01em; color: var(--primary); white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--primary-soft); }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.filled:hover { box-shadow: var(--shadow); filter: brightness(1.05); }
.btn.outlined { border-color: var(--outline); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn .badge { background: var(--on-primary); color: var(--primary); border-radius: 10px; padding: 0 7px; font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
.card h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; margin: 0 0 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; }
.split.item-first { grid-template-columns: minmax(0, 62fr) minmax(0, 38fr); } .queue th, .queue td { padding: 8px 10px; }
.queue .progress { padding: 12px 16px; } .queue .progress .answer { font-size: 14px; } .queue .progress .pn-seg { margin-top: 8px; height: 8px; }
p.then { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.card .links { display: flex; flex-direction: column; gap: 4px; font-size: 14px; margin: 6px 0 10px; } .card .links b { font-weight: 500; }
/* zone A: the page's question, its answer in a sentence, and the action at the row's end; later zones smaller, the detail folded last */
.qa { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.qa > .q { flex: 1 1 420px; min-width: 0; }
.qa h2.question { font-size: 22px; font-weight: 400; margin: 0 0 4px; }
.qa .answer { font-size: 15px; margin: 0; color: var(--ink); } .qa .answer b { font-weight: 600; } .qa .answer .muted { color: var(--muted); }
.qa .big, .qa h2.question.big { font-size: 28px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.checks > div { display: flex; gap: 10px; align-items: baseline; } .checks > div::before { width: 14px; flex: none; text-align: center; font-weight: 700; }
.checks .ok::before { content: "✓"; color: var(--good); } .checks .warn::before { content: "!"; color: var(--against-ink); }
.checks .btn { height: 28px; padding: 0 12px; }
.fold-line { margin-top: 12px; font-size: 13px; } .fold-line > summary { cursor: pointer; color: var(--primary); list-style: none; } .fold-line > summary::before { content: "▸ "; }
.fold-line[open] > summary::before { content: "▾ "; }
.panel-sticky { position: sticky; top: 72px; }

/* tables, with a filter bar */
.tablecard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; margin-bottom: 16px; }
.filterbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.filterbar input { flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; outline: none; }
.tablewrap { overflow: auto; max-height: 62vh; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
td.wrap { white-space: normal; }
table.repairs { table-layout: fixed; width: 100%; } table.repairs th:first-child { width: 72px; } table.repairs th:nth-child(2) { width: 20%; }
table.repairs td { overflow-wrap: anywhere; white-space: normal; }  /* a whole row as given: both values in view, side by side */
.clip { display: inline-block; max-width: 11em; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }  /* a long value: the columns after it stay in view */
thead th { position: sticky; top: 0; background: var(--surface); font-weight: 500; font-size: 12px; color: var(--muted); z-index: 1; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover { background: var(--hover); }
tbody tr[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); }
.tablefoot { padding: 8px 16px; color: var(--faint); font-size: 12px; }

/* Results, Review, Explore: tiles that each answer a question, tabs, pages of pairs, two records' full rows side by side */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; color: var(--ink); text-decoration: none; cursor: pointer; }
.tile:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.tile h3 { font-size: 15px; font-weight: 500; margin: 0; }
.tile .num { font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; } .tile .num .unit { font-size: 14px; color: var(--muted); margin-left: 4px; }
.tile p { margin: 0; font-size: 13px; } .tile .bars { margin: 0; }
.bars .bar.muted { background: var(--outline); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -8px 0 16px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 16px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); } .tab:hover { background: var(--hover); }
.pager { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.pager .grow, .fr-tools .grow { flex: 1; }
.find { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--outline); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--muted); }
.find input { border: 0; outline: none; font: inherit; color: var(--ink); background: transparent; min-width: 120px; flex: 1; }
.big-find { min-width: 280px; } .big-find input { font-size: 16px; }
.from { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; font-size: 14px; }
.from input[type=number], .filters input[type=number] { width: 72px; font: inherit; padding: 6px 8px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font-size: 14px; }
.filters select { font: inherit; padding: 6px 8px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--ink); }
.fullrows { margin-top: 12px; } .fr-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 6px; } .fr-head b { font-weight: 500; }
.fr-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 10px 0; font-size: 13px; } .fr-tools .check { margin: 0; align-items: center; }
.fullrows td.col { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
.fullrows tr.fr-different td { background: color-mix(in srgb, var(--bad-bg) 45%, transparent); }
.fullrows .tablewrap { max-height: 56vh; }
.fullrows table { min-width: 560px; } .fullrows td.col { white-space: nowrap; }  /* a narrow screen scrolls the rows sideways: a column's name stays whole */
.cond { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.cond select, .cond input { font: inherit; padding: 6px 8px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--ink); }
.cond select[multiple] { min-width: 320px; min-height: 96px; } .cond .cond-body { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; flex: 1; }
.fieldpick { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.join { display: flex; gap: 16px; margin: 8px 0 12px; } .join .check { margin: 0; }
.preview { margin-top: 12px; min-height: 22px; }

/* status, banners, chips */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: var(--hover); color: var(--muted); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.info { background: var(--primary-soft); color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
.banner > div { min-width: 0; overflow-wrap: anywhere; }  /* a long path or name wraps inside it */
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--primary-soft); color: var(--ink); }
#lost[hidden] { display: none; }  /* .banner's flex would show it empty */
#lost { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 30; width: min(640px, calc(100% - 32px)); box-shadow: 0 2px 8px rgb(0 0 0 / 0.2); }
.banner b { display: block; }
.banner .fix { color: var(--ink); margin-top: 2px; }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--primary); }
.meter.wide { display: block; width: 100%; max-width: 480px; margin: 4px 0 2px; } .meter.wide i { transition: width .3s; }
.card.ready { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .card.ready .grow { flex: 1; }
.field { display: block; margin: 0 0 16px; }
.field .lab { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input[type=text], .field select { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--outline); border-radius: 4px; background: var(--surface); color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; }
.big { font-size: 26px; margin: 4px 0 12px; }
.keys { color: var(--faint); font-size: 12px; }
kbd { border: 1px solid var(--outline); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, Menlo, monospace; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.empty { text-align: center; padding: 48px 16px; }
.empty > .ic { width: 48px; height: 48px; color: var(--faint); stroke-width: 1.2; }
.empty h2 { justify-content: center; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.steps li { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.steps li .ic { color: var(--good); width: 18px; height: 18px; }
code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

/* the dialog */
dialog { border: 0; border-radius: 28px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 8px 28px rgba(0,0,0,.28); }
dialog::backdrop { background: rgba(0,0,0,.32); }
.dlg-body { padding: 24px 24px 8px; max-height: 70vh; overflow-y: auto; }
.dlg-body h2 { font-size: 22px; font-weight: 400; margin: 0 0 8px; }
.dlg-body p.about { color: var(--muted); margin: 0 0 20px; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 8px 16px 16px 24px; }
.dlg-foot .grow { flex: 1; }
.equiv { margin: 0 0 16px; background: var(--hover); border-radius: 8px; padding: 6px 6px 6px 12px; display: flex; gap: 8px; align-items: center; }
.equiv code { flex: 1; overflow-wrap: anywhere; }
.report { margin: 12px 0 8px; max-height: 50vh; overflow: auto; background: var(--hover); border-radius: 8px; padding: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; color: var(--ink); }
.cmdline summary { cursor: pointer; font-size: 12px; color: var(--faint); margin: 4px 0 8px; }

/* the command drawer, at the bottom: every command the page ran */
:root { --term-h: 260px; }  /* the drawer's height: dragged by its top edge */
.term { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: var(--term-h); display: flex; flex-direction: column; background: var(--term); color: var(--term-ink); box-shadow: 0 -2px 8px rgba(0,0,0,.25); }
.term[hidden] { display: none; }
.term-bar { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 16px; border-bottom: 1px solid #3c4043; font-size: 13px; }
.term-bar .faint { color: var(--term-dim); }
.term-bar .iconbtn { color: var(--term-dim); width: 32px; height: 32px; }
.term-bar .iconbtn:hover { background: #2d2f31; }
.term-body { flex: 1; overflow-y: auto; padding: 8px 16px; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
.term-body .cmd::before { content: "$ "; color: var(--term-ok); }
.term-body .out { color: var(--term-dim); white-space: pre-wrap; }
.term-body .ok { color: var(--term-ok); }
.term-body .bad { color: var(--term-bad); white-space: pre-wrap; }
.term-body .faint { color: var(--term-dim); }
.term-grip { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; touch-action: none; }
.term-grip::after { content: ""; position: absolute; left: 50%; top: 2px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--term-dim); opacity: .5; }
body.term-open main { padding-bottom: calc(var(--term-h) + 40px); }
body.term-open .snack, body.term-open .task { bottom: calc(var(--term-h) + 16px); }

/* the snackbar */
.snack { position: fixed; left: 24px; bottom: 24px; z-index: 7; display: flex; align-items: center; gap: 12px; min-width: 288px; max-width: 560px; padding: 12px 16px; border-radius: 4px;
         background: #313033; color: #f4eff4; box-shadow: 0 4px 12px rgba(0,0,0,.3); font-size: 14px; }
.snack[hidden] { display: none; }
.snack code { overflow-wrap: anywhere; }
.snack .msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.snack .btn { color: #a8c7fa; height: 32px; padding: 0 8px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #a8c7fa; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }  /* slowed, never stopped: a still wheel reads as a page that hung */
.spin.ink { border-color: var(--primary); border-right-color: transparent; } .waiting { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.snack .x { color: #c4c7c5; width: 32px; height: 32px; margin-right: -8px; }

/* a long command's progress, bottom right, as a download panel: what it does, how far, about how long; folded or closed */
.task { position: fixed; right: 24px; bottom: 24px; z-index: 7; width: 360px; max-width: calc(100vw - 32px); background: var(--surface); color: var(--ink);
        border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.24); overflow: hidden; font-size: 14px; }
.task[hidden] { display: none; }
.task-head { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; background: var(--hover); }
.task-head b { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-head .iconbtn { width: 32px; height: 32px; }
.task-head .spin { border-color: var(--primary); border-right-color: transparent; }
.task-body { padding: 12px 16px 14px; display: grid; gap: 8px; }
.task.folded .task-body { display: none; } .task.folded #task-fold svg { transform: rotate(180deg); }
.task-line { color: var(--muted); font-size: 13px; }
@media (max-width: 860px) { .task { right: 16px; left: 16px; width: auto; bottom: 88px; } }

@media (max-width: 1320px) { .split.item-first { grid-template-columns: minmax(0, 56fr) minmax(0, 44fr); } .queue th, .queue td { padding: 8px 8px; } .queue .clip { max-width: 6em; } }  /* the queue's columns whole */
@media (max-width: 1100px) { .split, .split.item-first { grid-template-columns: minmax(0, 1fr); } .panel-sticky { position: static; } }
@media (max-width: 860px) {
  .sidenav { transform: translateX(-100%); transition: transform .2s; width: 256px; box-shadow: var(--shadow); }
  body.nav-open .sidenav { transform: none; }
  main, body.collapsed main { margin-left: 0; padding: 0 16px 120px; }
  .pagehead { margin: 0 -16px 16px; padding: 8px 16px; }
  .logo .name, .search kbd { display: none; }
  .picker { max-width: 120px; }
  .appbar { gap: 4px; }
  #help { display: none; }

/* the workflow: who joined what, one color each, on every page */
:root { --rule: #00796b; --rule-bg: #e0f2f1; --model: #0b57d0; --model-bg: #e8f0fe; --people: #8e24aa; --people-bg: #f3e5f5; --neg: #c5221f;

.odds { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

      background: var(--surface); border: 1px solid var(--line); color: var(--ink); margin: 2px 4px 2px 0; }

.pn-drawer { border: 1px solid var(--primary); border-radius: 12px; padding: 12px 16px; margin: 6px 0 8px; font-size: 13px; }
.pn-drawer h4 { margin: 0 0 8px; font-size: 14px; font-weight: 500; } .pn-drawer > div { padding: 2px 0; }
.pn-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.pn-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
.pn-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--primary); font: inherit; cursor: pointer; } .linkbtn:hover { text-decoration: underline; }
.warn-n { color: var(--against-ink); font-weight: 600; } .good-n { color: var(--good); } .for-n { color: var(--for); } .against-n { color: var(--against-ink); }
.pn-toggle { display: inline-flex; border: 1px solid var(--outline); border-radius: 18px; overflow: hidden; margin: 0 0 14px; }

.pn-comp > summary::-webkit-details-marker { display: none; } .pn-comp[open] > summary b::after { content: " ▾"; color: var(--faint); } .pn-comp > summary b { font-weight: 500; }

.pn-hist { position: relative; } .pn-hist svg { display: block; width: 100%; height: auto; } .pn-hist text { font-size: 12px; fill: var(--ink); } .pn-hist text.faint { fill: var(--faint); }

.stage { display: block; width: 100%; height: auto; }

.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 0 8px; }

.scope { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.welcome .example .one { border-color: var(--primary); } .welcome .example .one .top { color: var(--primary); }
.continue .pick { cursor: pointer; } .continue .pick:hover { background: var(--hover); }
.node.static { cursor: default; max-width: 210px; }

.tray .trayhead::before { content: "▸"; color: var(--faint); } .tray[open] .trayhead::before { content: "▾"; }
.colhead { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; } .colhead h3 { font-size: 15px; font-weight: 500; margin: 0; flex: 1; }
.colchip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--outline);
           background: var(--surface); font-size: 12px; cursor: grab; white-space: nowrap; user-select: none; }
.colchip.used { opacity: .45; } .colchip.in { background: var(--primary-soft); border-color: transparent; } .colchip.gone { text-decoration: line-through; opacity: .6; }
.colchip.ghost { border-style: dashed; border-color: var(--primary); color: var(--primary); background: transparent; cursor: default; }
.colchip .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; padding: 0 0 0 2px; }
.colchip .x.keep { color: var(--primary); font-weight: 600; }
.fgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.fgroup summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; }
.fgroup summary::-webkit-details-marker { display: none; }
.fgroup summary::before { content: "▸"; color: var(--faint); width: 12px; }
.fgroup[open] summary::before { content: "▾"; }
.fgroup b { font-weight: 500; }
.gstat { margin-left: auto; font-size: 12px; color: var(--faint); } .gstat.bad { color: var(--bad); } .gstat.warn { color: var(--warn); }
.frow { display: grid; grid-template-columns: 180px minmax(220px, 1fr) 110px minmax(0, 200px) 120px; gap: 10px; align-items: center;
        padding: 6px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.frow[data-depth="1"] .flab { padding-left: 14px; }
.frow .flab { color: var(--muted); white-space: nowrap; } .frow .need { color: var(--bad); font-weight: 500; font-size: 11px; }
.drop { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 32px; padding: 2px; border-radius: 8px; }
.drop.over, .colchip.over { outline: 2px dashed var(--primary); outline-offset: 1px; }
.drop .colchip.over::after, .drop.over:has(.colchip):not(:has(.colchip.over))::after { color: var(--primary); font-size: 12px; margin-left: 6px; }
.drop .colchip.over::after { content: "+ joined to it"; }  /* what a drop will do, said before it is let go */
.drop.over:has(.colchip):not(:has(.colchip.over))::after { content: "used where these are empty"; }
.drop .hole { color: var(--faint); border: 1px dashed var(--outline); border-radius: 13px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.drop .colchip.in { cursor: pointer; } .frow:has(.drop.over) { background: var(--primary-soft); }
.tray { position: sticky; bottom: 0; z-index: 2; } .tray[open] .chips { max-height: 30vh; overflow: auto; }  /* in reach of every row while dragging */
body.term-open .tray { bottom: var(--term-h); }  /* above the command drawer */
#out[inert] .fgroup { opacity: .6; } #out[aria-busy] .colhead h3::after { content: "saving…"; margin-left: 8px; color: var(--faint); font-size: 12px; font-weight: 400; }
.drop .else, .drop .plus { color: var(--faint); font-size: 11px; }
.drop select { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--ink); }
.frow .fex { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .frow .fwarn { color: var(--warn); font-size: 12px; white-space: nowrap; }
.mini { border: 0; background: transparent; color: var(--primary); cursor: pointer; font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }

.frow.offer { background: var(--primary-soft); } .frow.offer .flab { color: var(--primary); }
.addform { gap: 6px; } .addform input { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; }
.addform select { font: inherit; font-size: 13px; } .frow .addnote { grid-column: span 3; font-size: 12px; }
@media (max-width: 860px) { .frow { grid-template-columns: 1fr; gap: 4px; } }

async function runOnce(command, args, onEvent, tries = 10) {

async function watch(job, command, line, onEvent, since = null) {  // a job's events to its end, in the drawer and the progress panel: its last event and exit code

async function refresh(d) {  // the stepper, from the page's own describe workspace when it made one, else from one of its own
  if (d === undefined && state.workspace) d = await run("records", "describe workspace");
  if (d && d.lost) return;  // the stepper as it was: the workspace is still there
  steps = progress(state.workspace ? d : null);
  rail();
  if (!resultsNow && state.workspace && d && d.records > 0)  // the Review line's count, once read: the rail first, then its number
    run("records", "describe results").then((r) => { if (r.event === "error" || resultsNow) return; resultsNow = r; steps = progress(d); rail(); stepChip(); });
  const ran = steps.steps.run.state === "done";
  $("search").disabled = !ran;
  $("search").placeholder = ran ? "Look up a record ID" : "Look up a record ID, after the first run";
  stepChip();
}

function stepChip() {  // the heading's chip: its step as the stepper has it
  const s = steps.steps[current], chip = $("stepchip");
  if (s && chip) { chip.className = `chip ${s.state === "done" ? "good" : s.state === "attention" ? "warn" : "info"}`; chip.textContent = `${STATE_WORD[s.state]} · ${s.line}`; }
}

const head = (id, actions = "", under = "") => {  // under: the page's tabs, between its heading and its path
  const s = (steps.steps || {})[id], ran = ((steps.steps || {}).run || {}).state === "done", n = ran ? -1 : ORDER.indexOf(id);
  const place = ran && ["records", "pairs", "kinds", "results"].includes(id);  // Results, Review and Explore say their state in their own words
  const title = id === "records" ? (ran ? "Results" : "Overview") : place && id === "kinds" ? "Review" : screen(id) ? screen(id).title : STEP[id];
  return `<div class="pagehead"><h1>${n >= 0 ? `<span class="faint">Step ${n + 1} of ${ORDER.length} · </span>` : ""}${esc(title)}</h1>${
    s && !place ? `<span class="chip ${s.state === "done" ? "good" : s.state === "attention" ? "warn" : "info"}" id="stepchip">${esc(STATE_WORD[s.state])} · ${esc(s.line)}</span>` : ""}${actions}</div>
    ${under}<nav class="path" id="path" aria-label="What this page shows"></nav>`;
};

// How much each part of a page covers, as a label on it; the path under the heading strings them together, widest first.
const scope = (ic, text) => `<div class="scope">${icon(ic)}${esc(text)}</div>`;
const where = () => {  // one part is the band's own label: a path once the page narrows
  const all = [...$("screen").querySelectorAll(".scope")], rank = (s) => s.closest(".zone.all") ? 0 : s.closest(".queue") ? 1 : 2;  // widest first: all the records, the list, the one shown
  const parts = all.sort((a, b) => rank(a) - rank(b)).map((s) => `<span>${s.innerHTML}</span>`);
  $("path").innerHTML = parts.length > 1 ? parts.join("<i>›</i>") : "";
};

function stepFoot(id) {  // back and next, in the setup's order; after a run, the way to the results
  const ran = ((steps.steps || {}).run || {}).state === "done", n = ORDER.indexOf(id), back = ORDER[n - 1], next = ORDER[n + 1];
  const link = (to, k, cls) => to === "workspace" ? `<button class="btn ${cls}" data-pick>${k}</button>` : `<a class="btn ${cls}" data-go="${to}">${k}</a>`;
  if (ran) return `<div class="stepfoot"><span class="grow"></span><a class="btn outlined" data-go="records">${icon("overview")}Results</a></div>`;
  return `<div class="stepfoot">${back ? link(back, `← ${ORDER.indexOf(back) + 1} ${esc(STEP[back])}`, "") : ""}<span class="grow"></span>${
    next ? link(next, `Next: ${ORDER.indexOf(next) + 1} ${esc(STEP[next])} →`, ["done", "optional"].includes(((steps.steps || {})[id] || {}).state) ? "outlined" : "") : ""}</div>`;  // the way on shows once this step is done; the page's one filled button is its answer's

// ---------- the flow strip: each stage of the pipeline as a chip, its details drawn, not written ----------

const NODE = {  // each stage in everyday words; describe matching's own name and method show on a click
  records: {icon: "records", name: "Records", word: "records", n: (x) => x.count},
  prepare: {icon: "wand", name: "Made comparable", word: "fields", n: (x) => x.fields.filter((f) => f.filled).length || null},
  rules: {icon: "rule", name: "Rule matches", word: "pairs", tone: "rule", n: (x) => x.pairs},
  candidates: {icon: "fan", name: "Compared", word: "pairs", n: (x) => x.pairs},
  score: {icon: "scale", name: "Weighed", word: "pairs", n: (x) => x.pairs},
  accept: {icon: "check", name: "Matched", word: "pairs", tone: "model", n: (x) => x.accepted},
  group: {icon: "group", name: "Entities formed", word: "entities", n: (x) => x.customers},
  kind: {icon: "kinds", name: "Person or company", word: "told apart", n: (x) => x.counts ? x.counts.company + x.counts.person : null},

const LEVEL = {exact: "same", "fold exact": "same, spelling aside", "fold JW high": "very similar", "JW high": "very similar", "given name": "same given name", "same address": "same",
               "fold JW low": "somewhat similar", "JW low": "somewhat similar", "address close": "nearly the same", "same postal": "same postal code",
               "one digit off": "1 digit different", else: "different", missing: "not given"};
const level = (l) => LEVEL[l] || l;
const comp = (c) => ({cif: "customer ID", birth: "birth date"})[c] || c;
const ARROW = '<span class="arrow"><svg viewBox="0 0 26 14" aria-hidden="true"><path d="M1 7h20M16 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>';

function strip(box, graph, ids) {
  const nodes = Object.fromEntries(graph.nodes.map((x) => [x.id, x])), all = nodes.records.count;
  box.className = "zone all";
  box.innerHTML = `${scope("stack", all === null ? "All records" : `All ${plural(all, "record")}`)}<div class="flow">${ids.map((id, i) => {
    const x = nodes[id], k = NODE[id], n = k.n(x);
    return `${i ? ARROW : ""}<button class="node ${k.tone || ""} ${n === null || n === undefined ? "dim" : ""}" data-node="${id}" aria-expanded="false" title="${esc(x.name)}: ${esc(x.method || "")}">
      <span class="top">${icon(k.icon)}${esc(k.name)}</span>${n === null || n === undefined ? "" : `<span class="n"><span class="v">${fmt(n)}</span><span class="u">${esc(k.word)}</span></span>`}</button>`;  // not run yet: its name alone
  }).join("")}</div><div class="slot"></div>`;
  const slot = box.querySelector(".slot");
  const show = (id) => {
    sceneClose();  // a scene pinned from the panel going away goes with it
    box.querySelectorAll(".node").forEach((b) => b.setAttribute("aria-expanded", String(b.dataset.node === id && slot.dataset.open !== id)));
    if (slot.dataset.open === id) { slot.innerHTML = ""; slot.dataset.open = ""; return; }
    slot.dataset.open = id;
    slot.innerHTML = `<div class="detail">${(DETAIL_Q[id] || DETAIL[id] || (() => ""))(nodes[id], nodes)}</div>`;  // its question first
    if (WIRE[id]) WIRE[id](slot.firstChild, nodes[id], nodes);

const bars = (rows, opts = {}) => {  // label, a bar whose length is the value, the value
  const max = Math.max(1, ...rows.map((r) => Math.abs(r.value ?? 0)));
  return `<div class="bars">${rows.map((r) => `<span class="lab" title="${esc(r.title || r.label)}">${esc(r.label)}</span>
    <span>${r.value ? `<span class="bar ${r.tone || opts.tone || ""}" style="width:${Math.max(1, 100 * Math.abs(r.value) / max)}%"></span>` : ""}</span>
    <span class="val">${r.text ?? fmt(r.value)}</span>`).join("")}</div>`;
};
const NORM = {nfkc: "same width", strip_spaces: "no spaces", kana_fold: "kana folded", strip_legal_form: "no legal form", reverse: "reversed",
              initial: "initial", first3: "first 3", address: "address rules"};
const norm = (list) => list.map((n) => NORM[n] || words(n));
const SHAPE = {reverse: "reversed", initial: "initial", first3: "first 3"};  // the ones that change what a key compares
const keyName = (k) => `${words(k.field)}${k.normalize.filter((n) => SHAPE[n]).map((n) => ` ${SHAPE[n]}`).join("")}`;
const tags = (list) => list.map((x) => `<span class="tag">${esc(x)}</span>`).join("");

function highlight(a, b) {  // two values, the part where they differ marked in each
  a = String(a ?? ""); b = String(b ?? "");
  let i = 0, j = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const mark = (s) => i < s.length - j ? `${esc(s.slice(0, i))}<span class="diff">${esc(s.slice(i, s.length - j))}</span>${esc(s.slice(s.length - j))}`
    : `${esc(s.slice(0, i))}<span class="diff gap" title="the other holds more here"></span>${esc(s.slice(i))}`;  // nothing of its own: a caret where the other's part is, not a marked letter
  return a === b ? [esc(a), esc(b)] : [mark(a), mark(b)];
}

function chainOf(f) {  // a field's real value, step by step: the column as read, the field, each form it is compared as
  const e = f.example || {}, raw = Object.entries(e).find(([k]) => !k.includes("__") && k !== f.field);
  const seen = [raw && raw[1], e[f.field], ...Object.entries(e).filter(([k]) => k.startsWith(`${f.field}__`)).map(([, v]) => v)]
    .filter((v, n, all) => v !== undefined && v !== null && v !== all[n - 1]);
  return `<span class="chain">${seen.map((v, n) => n ? `<span class="to">▸</span>${highlight(seen[n - 1], v)[1]}` : esc(v)).join("") || '<span class="faint">no value</span>'}
    ${tags([...new Set([...norm(f.normalize), ...f.compared_as.flatMap(norm)])])}</span>`;
}

const can = (command) => !!use(current, command);  // the page may run it here: its layout places it on this screen
let memoAt = -1, memoed = new Map();
function memo(command, extra = {}) {  // one run per command and arguments while a page shows: a panel opened again asks nothing
  if (memoAt !== visit) { memoAt = visit; memoed = new Map(); }
  const k = `${command} ${JSON.stringify(extra)}`;
  if (!memoed.has(k)) memoed.set(k, run(current, command, extra));
  return memoed.get(k);
}
const keyWords = (g) => g.method === "sorted neighbours" ? `near in ${g.keys.map(keyName).join(" + ")} order` : g.method === "one letter deleted"  // what a pair key looks for
  ? `${g.keys.map(keyName).join(" + ")}, one letter dropped${g.within.length ? ` · same ${g.within.map(keyName).join(" + ")}` : ""}`
  : g.method === "TF-IDF nearest" ? `letter chunks of ${g.keys.map(keyName).join(" + ")}` : `same ${g.keys.map(keyName).join(" + ")}`;
const FAMILY = (f) => ({jaro_winkler: "jw", jaro: "jw", jaccard: "ng", levenshtein: "ed", damerau_levenshtein: "ed", hamming: "ed"})[f] || "";
const said = (t) => t.function === "exact" ? `same ${words(t.field)}` : `${words(t.field)} ${["jaro_winkler", "jaro", "jaccard"].includes(t.function) ? `≈ ${t.threshold}` : t.function === "hamming" ? `${t.threshold} digit off` : `≤ ${t.threshold} edit${t.threshold > 1 ? "s" : ""}`}`;
const signed = (v) => v === null || v === undefined ? "—" : Math.abs(v) < 0.05 ? "0.0" : `${v > 0 ? "+" : ""}${v.toFixed(1)}`;
const seg = (parts) => `<span class="pn-seg">${parts.filter(([n]) => n > 0).map(([n, color, title]) => `<i style="flex:${n};background:${color}" title="${esc(title)}"></i>`).join("")}</span>`;
const idList = (...xs) => esc(JSON.stringify(xs));  // record IDs in a data attribute, as a list: an ID may hold a space
const pairLink = (a, b, text) => can("explain pair") ? `<button type="button" class="linkbtn" data-explain="${idList(a, b)}">${esc(text)}</button>` : esc(text);
const customerLink = (id) => `<button type="button" class="linkbtn" data-example="${esc(id)}">${esc(id)}</button>`;

// a comparison as a staircase: every pair stops at the first step it passes; a step's test replays on a pair of this run
function staircase(c, x) {
  const scenes = can("list patterns") && can("explain pair"), all = x.pairs || 0;
  const what = (t) => t.function === "exact" ? "=" : `${FN[t.function]} ${["jaro_winkler", "jaro", "jaccard"].includes(t.function) ? "≥" : "≤"} ${t.threshold}`;
  const chip = (lv, t) => {
    const text = `${words(t.field)} ${what(t)}`, step = [c.name, lv.label, t.field, t.function].join("|");
    return norm(t.normalize).map((n) => `<span class="fx prep">${esc(n)}</span>`).join("") + (scenes
      ? `<button type="button" class="fx ${FAMILY(t.function)}" data-step="${esc(step)}">${esc(text)}</button>` : `<span class="fx ${FAMILY(t.function)}">${esc(text)}</span>`);
  };
  const counts = (lv) => lv.m === null || lv.m === undefined ? ["", ""]
    : [lv.m < 0.005 ? (lv.m ? "<1 in 100" : "none") : `${Math.round(lv.m * 100)} in 100`, lv.u > 0.5 ? "nearly all" : `1 in ${big(1 / lv.u)}`];
  let at = 0;
  const bar = (n, cls) => { const w = all ? 1000 * (n || 0) / all : 0, svg = `<span><svg class="stairbar" viewBox="0 0 1000 14" preserveAspectRatio="none" aria-hidden="true">
    <rect class="track" x="0" y="6" width="1000" height="2"/><rect class="${cls}" x="${at}" y="1" width="${Math.max(w, n ? 4 : 0)}" height="12"/></svg></span>`; at += w; return svg; };
  const rows = [c.missing ? `<span class="faint">not on both</span><span></span>${bar(c.missing, "none")}<span class="num faint">${fmt(c.missing)}</span><span></span><span></span><span class="num faint">0</span>` : "",
    ...c.levels.map((lv) => { const [m, u] = counts(lv);
      return `<span>${esc(level(lv.label))}</span><span class="tests">${!lv.tests.length ? (scenes ? `<button type="button" class="fx" data-step="${esc(`${c.name}|${lv.label}`)}">anything else</button>` : '<span class="faint">anything else</span>')
        : lv.tests.map((t) => `<span class="test">${chip(lv, t)}</span>`).join("")}</span>${bar(lv.pairs, lv.bits >= 0 ? "for" : "against")}<span class="num">${lv.pairs === null || lv.pairs === undefined ? "—" : fmt(lv.pairs)}</span>
        <span class="num">${m}</span><span class="num">${u}</span><span class="num pts ${lv.bits >= 0 ? "for" : "against"}">${signed(lv.bits)}</span>`; })];
  return `<div class="stair"><span class="h">step</span><span class="h">test</span><span class="h">where pairs stop, of all</span><span class="h num">pairs</span>
    <span class="h num">one entity</span><span class="h num">other pairs</span><span class="h num">points</span>${rows.join("")}</div>`;
}

// a comparison's pairs, by the step they stopped at, as one bar: blue for, orange against, grey not on both; `pick`, one pair's step
function stepBar(c, x) {
  const all = x.pairs || 1, scenes = can("list patterns") && can("explain pair");
  const parts = [["missing", c.missing, null], ...c.levels.map((lv) => [lv.label, lv.pairs, lv.bits])];
  return `<span class="pn-wbar">${parts.filter(([, n]) => n).map(([lab, n, bits]) => {
    const share = 100 * (n || 0) / all, name = lab === "missing" ? "not on both" : level(lab);
    const color = bits === null ? "var(--outline)" : bits < 0 ? "var(--against)" : `color-mix(in srgb, var(--for) ${Math.round(30 + Math.min(70, 4.5 * bits))}%, var(--surface))`;
    const dark = bits === null || (bits >= 0 && bits < 7);  // light fills take ink
    const text = share >= 14 ? `${name} ${share.toFixed(0)}%` : share >= 6 ? `${share.toFixed(0)}%` : "";
    const title = `${name}: ${fmt(n || 0)} pairs, ${share.toFixed(1)}%${bits === null ? "" : `, ${signed(bits)} points`}`;
    const attrs = `style="flex:${Math.max(share, 0.8)};background:${color};color:${dark ? "var(--ink)" : "#fff"}" title="${esc(title)}"`;
    return scenes ? `<button type="button" ${attrs} data-step="${esc(`${c.name}|${lab}`)}" data-click>${esc(text)}</button>` : `<i ${attrs}>${esc(text)}</i>`;

}

// what a stage shows folded under its question (DETAIL_Q); a stage with no question (prepare, kind) shows it as its panel
const DETAIL = {
  records: (x, all) => {  // the details under What did it read?: each field's fill and example
    const fields = all.prepare.fields.filter((f) => f.filled !== null && f.filled !== undefined).sort((a, b) => b.filled - a.filled);
    return `<div class="pn-table" style="--cols:130px 220px minmax(140px,1fr) 48px minmax(0,1.2fr)">

        ${fields.map((f) => `<a class="pn-r" data-go="columns"><span>${esc(words(f.field))}</span><span class="faint ellip" title="${esc(f.columns.map((c) => c.join(" + ")).join(" / "))}">${esc(f.columns.map((c) => c.join(" + ")).join(" / "))}</span>

  prepare: (x) => `<div class="bars" style="grid-template-columns:minmax(90px,max-content) 1fr 60px">${x.fields.map((f) =>
    `<span class="lab">${esc(words(f.field))}</span>${chainOf(f)}<span class="val">${pct(f.filled)}</span>`).join("")}</div>`,
  rules: (x, all) => {
    const t = all.accept.threshold;
    const code = (name) => { const c = name.split("_")[0]; return c.length <= 3 ? c : name; };
    const most = Math.max(1, ...x.rules.map((r) => r.pairs ?? 0));
    const row = (r, i) => `<button type="button" class="pn-r" data-rule="${i}" title="${esc(`${r.stage}: ${r.name}`)}"><span class="faint">${esc(code(r.name))}</span>
      <span>${r.exact.map((f) => `<span class="fx">${esc(`same ${words(f)}`)}</span>`).join("")}${r.fuzzy.map((u) => `<span class="fx ${FAMILY(u.function)}">${esc(said(u))}</span>`).join("")}</span>
      <span><span class="pn-bar" style="width:${(100 * (r.pairs ?? 0) / most).toFixed(1)}%;background:var(--rule)"></span></span><span class="num">${r.pairs === null ? "—" : fmt(r.pairs)}</span>

      <span><span class="pn-bar" style="width:${(100 * g.pairs / most).toFixed(1)}%"></span></span><span class="num">${fmt(g.pairs)}</span><span class="num">${fmt(g.matched ?? 0)}</span>
      <span class="num ${g.only ? "good-n" : "faint"}">${fmt(g.only ?? 0)}</span><span class="num faint">${g.seconds === null || g.seconds === undefined ? "" : `${g.seconds.toFixed(2)} s`}</span></button>`;
    const links = x.by_keys.reduce((s, b) => s + b.links, 0), most_keys = x.by_keys.length;
    const table = (list) => list.map(row).join("");
    return `${links ? `<div class="pn-cap">a pair is compared when any key lists it · links, by how many keys listed each</div>
        <span class="pn-seg tall">${x.by_keys.map((b, i) => `<i style="flex:${b.links};background:color-mix(in srgb, var(--model) ${Math.round(25 + 70 * i / Math.max(most_keys - 1, 1))}%, var(--surface))"

// A stage's panel answers the question a person has on opening it: the question, one sentence, one picture, one action;
// the detail is folded after.
const STAGE_Q = {

const ask = (q, answer, picture = "", act = "", more = "", label = "Details") => `<div class="qa"><div class="q"><h2 class="question pq">${esc(q)}</h2><p class="answer">${answer}</p></div>${act}</div>

const missedWords = (strata) => strata.some((m) => m.hits)  // the probe's answer, from the last full run: matches no key lists, found by sampling

const DETAIL_Q = {
  records: (x, all) => {
    if (x.count === null || x.count === undefined) return ask(STAGE_Q.records, "Nothing yet: the records are read when matching runs.");
    const files = (x.files || []).map((f) => baseName(f).replace(/(\.(csv|tsv|txt))\.parquet$/i, "$1")).join(", "), k = x.kinds || {};
    const lines = [`<div class="ok">${plural(x.count, "record")} read${x.columns ? `, ${fmt(x.columns)} columns` : ""}${x.seconds !== null && x.seconds !== undefined ? `, in ${lasts(x.seconds)}` : ""}</div>`,
      ...hurts(all.prepare.fields, x.turned_off, ' <a class="btn" data-go="columns">Map it</a>'),
      k.unsure ? `<div class="ok">${fmt(k.company)} companies by their legal form; ${plural(k.unsure, "record")} not sure yet as person or company <a class="btn" data-go="kinds">Answer some</a></div>` : ""].filter(Boolean);
    return ask(STAGE_Q.records, `<b>${plural(x.count, "record")}</b> from ${esc(files)}, ${x.set_aside ? `${plural(x.set_aside, "record")} set aside: their IDs are used twice` : "none set aside"}.`,
      `<div class="checks">${lines.join("")}</div>`, "", DETAIL.records(x, all), "How full each field is");
  },
  rules: (x, all) => {

    const answer = `<b>${fmt(x.pairs ?? 0)} pairs</b> whose records agree on several fields at once, such as the same customer ID and name; in some rules a field may be near rather than exact, like a name 2 letters apart.${scored.length

    const pic = scored.length ? `${seg([[sum("high"), "var(--model)", "agrees"], [sum("mid"), "var(--outline)", "unsure"], [sum("low"), "var(--against)", "disagrees"]])}

function histogram(x, all) {  // pairs by points: each band split into matched, to review and not matched; the line and its odds
  const line = x.trust === null || x.trust === undefined ? x.threshold : x.trust, rev = Object.fromEntries((x.review_bands || []).map(([b, n]) => [b, n]));

  const hi = Math.max(lo + 20, Math.min(60, Math.max(...shown.map((b) => b.from + 2))));
  const W = 1000, X0 = 24, X = (v) => X0 + (Math.min(v, hi) - lo) * (W - X0 - 16) / (hi - lo), H = 200, top = Math.max(1, ...shown.map((b) => b.pairs)), Y = (n) => (H - 30) * n / top;
  const bars = shown.filter((b) => b.from < hi).map((b) => {
    let y = H;
    const parts = [[b.merged, "var(--model)"], [b.review, "var(--people)"], [b.apart, "var(--outline)"]].map(([n, c]) => {
      if (n <= 0) return "";

      return `<rect x="${X(b.from) + 1}" y="${y}" width="${Math.max(X(b.from + 2) - X(b.from) - 2, 1)}" height="${h}" fill="${c}"/>`;
    }).join("");
    return `<g class="pn-band" data-band="${b.from}">${parts}<rect class="hit" x="${X(b.from)}" y="0" width="${X(b.from + 2) - X(b.from)}" height="${H + 4}" fill="transparent"/></g>`;
  }).join("");

      ${line === "none" ? "" : `<line x1="${X(line)}" x2="${X(line)}" y1="4" y2="${H + 4}" stroke="var(--ink)" stroke-width="2"/><text x="${X(line) + 6}" y="14">matched from ${line} points →</text>`}</svg><div class="pn-tip" hidden></div></div>
    <div class="pn-legend"><span><i style="background:var(--model)"></i>matched</span><span><i style="background:var(--people)"></i>waiting for you</span><span><i style="background:var(--outline)"></i>not matched</span>
      ${below ? `<span class="faint">${esc(plural(below, "more pair"))} scored below ${lo}: not matched</span>` : ""}<span class="faint">click a bar for its pairs</span></div><div class="pn-picked"></div>`;
}

function mostCounts(x) {  // every step of every comparison, ranked by its points: what counts most for and against
  const strictest = x.comparisons.map((c) => { const lv = c.levels.find((v) => v.label !== "missing" && v.bits !== null && v.bits !== undefined); return lv && {c: c.name, label: lv.label, bits: lv.bits}; })
    .filter(Boolean).sort((a, b) => b.bits - a.bits);  // the headline: each comparison by its strictest step, not a step the fit happened to rate higher
  const rank = Object.fromEntries(strictest.map((s, i) => [s.c, i]));  // the bars in that order, each comparison's steps strict to loose: the first bar is the headline
  const steps = x.comparisons.flatMap((c) => c.levels.map((lv, i) => ({c: c.name, label: lv.label, bits: lv.bits, i})).filter((s) => s.bits !== null && s.bits !== undefined && Math.abs(s.bits) >= 0.5))
    .sort((a, b) => (rank[a.c] ?? 99) - (rank[b.c] ?? 99) || a.i - b.i);
  const most = Math.max(1, ...steps.map((s) => Math.abs(s.bits))), top = strictest[0], bottom = steps.reduce((m, s) => !m || s.bits < m.bits ? s : m, null);
  const name = (s) => `${comp(s.c)}: ${level(s.label)}`;
  return `<p class="answer">${top ? `${esc(name(top))} counts most for a match` : ""}${bottom && bottom.bits < 0 ? `; ${esc(name(bottom))} counts most against` : ""}.</p>
    <div class="pn-table" style="--cols:220px minmax(120px,1fr) 64px;max-width:820px">${steps.map((s) => `<div class="pn-r"><span>${esc(name(s))}</span>
      <span><span class="pn-bar" style="width:${(100 * Math.abs(s.bits) / most).toFixed(0)}%;background:var(--${s.bits >= 0 ? "for" : "against"})"></span></span>
      <span class="num ${s.bits >= 0 ? "for-n" : "against-n"}">${signed(s.bits)}</span></div>`).join("")}</div>`;
}

// what a panel does once drawn: its clicks, and what it loads
let scoreView = "one", scorePick = 0;
const WIRE = {
  rules: (box, x) => {
    const worst = box.querySelector("[data-worst]");
    if (worst) worst.onclick = () => {
      const open = box.querySelector(".pn-drawer.worst");
      if (open) { open.remove(); return; }
      const got = x.rules.flatMap((r) => r.lowest.filter(([, , w]) => w < 0).map((p) => [...p, r.name])).sort((a, b) => a[2] - b[2]);
      worst.closest(".qa").insertAdjacentHTML("afterend", `<div class="pn-drawer worst"><h4>The lowest-scoring pairs the rules matched</h4>${got.map(([a, z, w, rule]) =>
        `<div>${pairLink(a, z, `${a} ↔ ${z}`)} <span class="faint">· ${w} points · ${esc(rule)}</span></div>`).join("")}</div>`);
    };
    WIRE.rule(box, x);
  },
  rule: (box, x) => box.querySelectorAll("[data-rule]").forEach((b) => b.onclick = () => {
    const open = box.querySelector(".pn-drawer"), r = x.rules[b.dataset.rule];
    if (open) { const was = open.dataset.for; open.remove(); if (was === b.dataset.rule) return; }
    b.insertAdjacentHTML("afterend", `<div class="pn-drawer" data-for="${b.dataset.rule}"><h4>${esc(r.name)} · its lowest points</h4>${r.lowest.length ? r.lowest.map(([a, z, w]) =>
      `<div>${pairLink(a, z, `${a} ↔ ${z}`)} <span class="faint">· ${w} points</span></div>`).join("") : '<span class="faint">no pair</span>'}</div>`);
  }),
  candidates: (box) => box.querySelectorAll("[data-key]").forEach((b) => b.onclick = async () => {
    const open = box.querySelector(".pn-drawer");
    if (open) { const was = open.dataset.for; open.remove(); if (was === b.dataset.key) return; }
    if (!can("describe key")) return;
    b.insertAdjacentHTML("afterend", `<div class="pn-drawer" data-for="${esc(b.dataset.key)}"><span class="faint">Looking into ${esc(b.dataset.key)}…</span></div>`);
    const drawer = b.nextElementSibling, d = await memo("describe key", {name: b.dataset.key});
    if (!drawer.isConnected) return;
    if (d.event === "error") { drawer.innerHTML = banner(d); return; }
    drawer.innerHTML = keyDrawer(d);
  }),
  score: (box, x) => {
    const view = box.querySelector(".pn-view");
    if (!view) return;
    const draw = async () => {
      box.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === scoreView)));
      if (scoreView === "most") { view.innerHTML = mostCounts(x); return; }
      view.innerHTML = '<span class="faint">Finding a pair of this run…</span>';
      const d = await memo("list patterns");
      if (!view.isConnected) return;
      const examples = d.event === "error" ? [] : d.patterns.slice().sort((a, b) => (b.merged > 0) - (a.merged > 0) || b.pairs - a.pairs).flatMap((p) => p.examples.slice(0, 1));
      if (!examples.length) { view.innerHTML = mostCounts(x); return; }
      const e = examples[scorePick % examples.length], pair = await memo("explain pair", {first: e.id_l, second: e.id_r});
      if (!view.isConnected) return;
      if (pair.event === "error") { view.innerHTML = banner(pair); return; }
      remember(pair);
      view.innerHTML = `<div class="qa"><div class="q"><p class="answer">This pair scored <b>${signed(pair.weight)}</b>: ${esc(said_of(pair))}. Every pair starts at ${signed(pair.prior)}, because two records picked at random are almost never one entity.</p>
          <div class="faint" style="font-size:13px;margin-top:4px">${pairLink(pair.id_l, pair.id_r, `${pair.id_l} · ${pair.id_r}`)}</div></div>
        <button type="button" class="btn outlined" data-another>${icon("refresh")}Another pair</button></div>${waterfallOf(rowOf(pair), pair)}`;
      view.querySelector("[data-another]").onclick = () => { scorePick++; draw(); };
    };
    box.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => { scoreView = b.dataset.view; draw(); });
    draw();
  },
  accept: (box, x) => {
    const more = box.querySelector(".pq-more");
    if (more) more.ontoggle = () => { if (more.open && !box.querySelector("#ptable")) patterns(box.querySelector("#patterns"), x.trust !== null && x.trust !== undefined); };
    const tip = box.querySelector(".pn-tip"), wrap = box.querySelector(".pn-hist"), rev = Object.fromEntries((x.review_bands || []).map(([b, n]) => [b, n]));
    const rules = Object.fromEntries((x.rule_bands || []).map(([b, n]) => [b, n]));
    const of = (from) => { const b = x.bands.find(([f]) => Number(f) === from); return b ? {pairs: Number(b[1]), merged: Number(b[2]), review: rev[from] || 0} : null; };
    box.querySelectorAll(".pn-band").forEach((g) => {
      const from = Number(g.dataset.band), b = of(from);
      g.onmousemove = (e) => {
        const o = wrap.getBoundingClientRect();
        tip.innerHTML = `${from} to ${from + 2} points · ${plural(b.pairs, "pair")}: ${fmt(b.merged)} matched · ${fmt(b.review)} waiting for you · ${fmt(Math.max(0, b.pairs - b.merged - b.review))} not matched${rules[from] ? ` · ${fmt(rules[from])} rule pairs` : ""}`;
        tip.hidden = false;
        tip.style.left = `${Math.min(e.clientX - o.left + 12, o.width - tip.offsetWidth - 4)}px`; tip.style.top = `${e.clientY - o.top - 40}px`;
      };
      g.onmouseleave = () => { tip.hidden = true; };
      g.onclick = () => {
        box.querySelectorAll(".pn-band").forEach((o) => o.classList.toggle("on", o === g));
        const got = (x.examples || {})[from] || [];
        box.querySelector(".pn-picked").innerHTML = `<div class="pn-drawer"><h4>${from} to ${from + 2} points</h4>${got.length ? got.map(([a, z, w, what]) =>
          `<div>${pairLink(a, z, `${a} ↔ ${z}`)} <span class="faint">· ${w} points · ${esc(what)}</span></div>`).join("") : `<span class="faint">pairs below ${x.review_from} points aren't kept</span>`}</div>`;
      };
    });
  },
};

function keyDrawer(d) {  // describe key: its groups, one real group, and what only it found
  const top = Math.max(1, ...(d.sizes || []).map((s) => s.values)), pick = new Set((d.group || d.around || {pair: []}).pair);
  const cols = (recs) => [...new Set(recs.flatMap((r) => Object.keys(r)).filter((k) => k !== "id" && recs.some((r) => r[k] !== null && r[k] !== undefined)))];
  const table = (recs) => { const c = cols(recs); return `<div class="pn-table" style="--cols:96px ${c.map(() => "minmax(0,1fr)").join(" ")}"><div class="pn-r h"><span>record</span>${c.map((k) => `<span>${esc(words(k))}</span>`).join("")}</div>
    ${recs.map((r) => `<div class="pn-r ${pick.has(r.id) ? "picked" : ""}"><span>${esc(r.id)}</span>${c.map((k) => `<span class="ellip">${esc(r[k] ?? "—")}</span>`).join("")}</div>`).join("")}</div>`; };
  const sizes = d.sizes ? `<div><div class="pn-cap">records per value</div>${d.sizes.map((s) => `<div class="pn-r" style="--cols:40px 1fr 70px;border:0;padding:1px 0"><span>${s.records === 10 ? "10+" : s.records}</span>
      <span><span class="pn-bar" style="width:${(100 * s.values / top).toFixed(1)}%"></span></span><span class="num">${fmt(s.values)}</span></div>`).join("")}
    ${d.largest.length ? `<div class="pn-cap" style="margin-top:6px">largest: ${d.largest.map((l) => `${esc(l.value)} ${fmt(l.records)}`).join(" · ")}</div>` : ""}</div>` : "";
  const group = d.group ? `<div><div class="pn-cap">one group: ${esc(d.group.value)} · ${fmt(d.group.records.length)}${d.group.more ? "+" : ""} records</div>${table(d.group.records)}</div>`
    : d.around ? `<div><div class="pn-cap">in its order: the records around one of its links (window ${d.around.window})</div>${table(d.around.records)}</div>` : "";
  return `<h4>${esc(d.name)} · ${plural(d.pairs, "pair")} listed · ${fmt(d.matched)} likely links · ${fmt(d.only)} only by this key</h4>
    <div class="pn-two">${sizes}${group}</div>
    ${d.examples.length ? `<div class="pn-cap" style="margin-top:8px">only this key listed</div>${d.examples.map(([a, z, w]) => `<div>${pairLink(a, z, `${a} ↔ ${z}`)} <span class="faint">· ${w} points</span></div>`).join("")}` : ""}`;
}

function allPairs(x) {  // every comparison as one bar of where its pairs stop; opened, its staircase
  return `${x.comparisons.map((c) => `<details class="pn-comp"><summary><b>${esc(comp(c.name))}</b>${stepBar(c, x)}</summary>${staircase(c, x)}</details>`).join("")}`;
}


function slider(r) {  // where the engine and the name alone place a record, from person to company
  const at = (p) => 3 + 94 * p, e = Number(r.engine_p), n = Number(r.name_p), same = Math.abs(e - n) < 0.06;
  const pin = (p, cls, label) => Number.isNaN(p) ? "" : `<span class="pin ${cls}" style="left:${at(p)}%"><span style="transform:translateX(-${Math.round(100 * p)}%)">${label}</span></span>`;
  return `<div class="slider"><span class="track"></span><span class="mid"></span>${same ? "" : pin(n, "name", "name")}${pin(e, "engine", same ? "engine and name" : "engine")}
    <span class="ends"><span>${icon("person")} person</span><span>company ${icon("kinds")}</span></span></div>`;
}

// Step 2: the file's columns as chips, and each group's features and their parts as slots to drop them into. A slot shows
// its columns (else: read where the ones before are empty; +: joined), its share filled, an example, and a warning when
// few of its values look like it; ✦ Suggest shows what the file's contents place there, kept with ✓.
function features(d, view) {
  const slot = Object.fromEntries(d.slots.map((x) => [x.feature, x])), info = Object.fromEntries(d.columns.map((c) => [c.column, c]));
  const field = Object.fromEntries(d.fields.map((f) => [f.field, f])), lost = (f) => !field[f] || field[f].filled === null;
  const used = new Set(d.slots.flatMap((x) => x.alternatives.filter((a) => a.found).flatMap((a) => a.columns)));
  const ghost = Object.fromEntries(d.placements.map((x) => [x.feature, x]));
  const FEW = 0.5;  // under this share of values that look like the slot, the column is likely the wrong one
  const ADDABLE = ["Name"];  // the groups a feature can be added to: one compared with the ones beside it (add feature)
  const meter = (v) => v === null || v === undefined ? "" : `<span class="meter"><i style="width:${Math.round(v * 100)}%"></i></span>${pct(v)}`;
  const chipOf = (c, from, alt) => `<span class="colchip ${from ? "in" : used.has(c) ? "used" : ""} ${info[c] ? "" : "gone"}" draggable="true" data-col="${esc(c)}"
    ${from ? `data-from="${esc(from)}" data-alt="${alt}" tabindex="0" role="button"` : ""} title="${info[c] ? `${pct(info[c].filled)} filled · ${esc(info[c].example ?? "")}` : "not in this file"}">${esc(c)}${
      from ? `<button class="x" data-x aria-label="Take ${esc(c)} off">×</button>` : ""}</span>`;
  const needs = (x) => (x.field && d.needed.every.includes(x.field) && lost(x.field)) ||
    (x.type === "person name" || x.field === "company_name") && d.needed.one_of.some((g) => g.every(lost));
  const row = (path, x, depth, last, shown) => {
    const s = slot[path], alts = s.sources.filter((a) => a.every((c) => info[c]));  // a column this file lacks is no column here
    const chips = alts.map((a, i) => (i ? '<span class="else">else</span>' : "") + a.map((c) => chipOf(c, path, i)).join('<span class="plus">+</span>')).join("");
    const g = shown && ghost[path];
    return `<div class="frow" data-depth="${depth}"><span class="flab">${depth ? (last ? "└ " : "├ ") : ""}${esc(x.name)}${x.script ? ` <span class="tag">${esc(x.script)}</span>` : ""}${
        needs(x) ? ' <b class="need">needed</b>' : ""}${x.added && !depth ? `<button class="x" data-remove="${esc(path)}" aria-label="Remove ${esc(x.name)}">✕</button>` : ""}</span>
      <span class="drop" data-slot="${esc(path)}">${chips}${!alts.length ? '<span class="hole" tabindex="0" role="button">choose a column</span>'
        : depth || x.field === "id" ? "" : `<span class="hole" tabindex="0" role="button" title="another column, read where these are empty" aria-label="Another column for ${esc(x.name)}">+</span>`}${
        g ? `<span class="colchip ghost" title="${esc(g.why)}">✦ ${esc(g.column)}<button class="x keep" data-keep='${esc(JSON.stringify([path, g.column]))}' aria-label="Keep it">✓</button></span>` : ""}</span>
      <span class="fstat">${meter(s.filled)}</span><span class="fex faint">${esc(s.example ?? "")}</span>
      <span class="fwarn">${s.looks_right !== null && s.looks_right !== undefined && s.looks_right < FEW ? `⚠ ${pct(s.looks_right)} look right` : ""}</span></div>`;
  };
  const status = (g) => {
    const need = g.features.filter(needs);
    const paths = g.features.flatMap((f) => [`${g.group}/${f.name}`, ...(f.parts || []).map((p) => `${g.group}/${f.name}/${p.name}`)]);
    const bad = paths.filter((p) => slot[p].looks_right !== null && slot[p].looks_right !== undefined && slot[p].looks_right < FEW);
    const found = paths.filter((p) => slot[p].filled !== null).length;
    const either = need.every((f) => f.type === "person name" || f.field === "company_name");  // a run needs one of them
    return need.length ? ["bad", `✗ ${need.map((f) => f.name).join(either ? " or " : ", ")} needed`] : bad.length ? ["warn", `⚠ ${bad.map((p) => p.split("/").pop()).join(", ")}`]
      : ["", `${found} of ${paths.length} found`];
  };
  const waiting = d.placements.length;
  const tray = `<details class="card tray" ${view.tray ? "open" : ""}><summary class="trayhead"><b>Columns in your file</b><span class="faint">drag one into a feature</span></summary>
      <div class="chips">${d.columns.map((c) => chipOf(c.column)).join("")}</div></details>`;
  return `<div class="colhead"><h3>Your columns, by field</h3>${waiting ? `<button class="btn" data-suggest="*">✦ ${view.ghosts.size ? "Hide" : "Suggest all"}</button>` : ""}${
        waiting && view.ghosts.size ? '<button class="btn filled" data-keepall="*">Keep all</button>' : ""}</div>` +
    d.features.map((g) => {
      const [cls, text] = status(g), shown = view.ghosts.has(g.group), offered = (d.offers || []).filter((x) => x.feature.startsWith(`${g.group}/`));
      const mine = d.placements.filter((x) => x.feature.startsWith(`${g.group}/`)).length + offered.length;
      return `<details class="fgroup" data-g="${esc(g.group)}" ${(view.toggled.has(g.group) ? view.toggled.get(g.group) : cls !== "") ? "open" : ""}>
        <summary><b>${esc(g.group)}</b>${mine ? `<button class="mini" data-suggest="${esc(g.group)}">✦ ${shown ? "Hide" : "Suggest"}</button>` : ""}${
          shown && d.placements.some((x) => x.feature.startsWith(`${g.group}/`)) ? `<button class="mini" data-keepall="${esc(g.group)}">Keep all</button>` : ""}<span class="gstat ${cls}">${esc(text)}</span></summary>
        ${g.features.map((f) => row(`${g.group}/${f.name}`, f, 0, false, shown) + (f.parts || []).map((p, i, all) =>
          row(`${g.group}/${f.name}/${p.name}`, p, 1, i === all.length - 1, shown)).join("")).join("")}${
        shown ? offered.map((x) => `<div class="frow offer" title="${esc(x.why)}"><span class="flab">✦ ${esc(x.feature.split("/").pop())} <span class="tag">${esc(x.script)}</span></span>
          <span class="drop"><span class="colchip ghost">${esc(x.column)}</span><button class="btn" data-offer='${esc(JSON.stringify(x))}'>Add</button></span></div>`).join("") : ""}${
        ADDABLE.includes(g.group) ? `<div class="frow addrow"><span class="flab"></span><span class="drop"><button class="mini" data-add="${esc(g.group)}">+ Add a feature</button></span></div>` : ""}</details>`;
    }).join("") + tray;
}

// ---------- pieces every page draws with ----------

function banner(e, kind = "bad") {
  if (!e || e.event !== "error" || e.lost) return "";  // a lost server: said once, above the page
  return `<div class="banner ${kind}" role="alert">${icon(kind === "bad" ? "error" : "info")}<div><b>${esc(e.error)}</b>${e.fix ? `<div class="fix">${esc(e.fix)}</div>` : ""}</div></div>`;
}
const WHY = {decide: "to decide", measure: "sample"};
const SAID = {match: "same entity", no_match: "different", person: "person", company: "company", unsure: "can't tell"};
function chip(status, written = "decided", answer = null) {  // answer: what people said, for a row written in or applied
  const kind = {open: "", "written in": "warn", applied: "good", decide: "info"}[status] ?? "";
  const text = WHY[status] || (status === "written in" ? written : status);
  return `<span class="chip ${kind}">${esc(answer && (status === "written in" || status === "applied") ? `${text} · ${SAID[answer] || answer}` : text)}</span>`;
}
// A table in a card, with a filter bar; rows the person can pick when onPick is given.
function grid(box, rows, cols, opts = {}) {
  const labels = {id_l: "record A", id_r: "record B", ...opts.labels}, cellOf = opts.cell || ((r, c) => esc(fmt(r[c]))), most = opts.most || 500;
  box.innerHTML = `<div class="tablecard">${opts.filter === false ? "" : `<div class="filterbar">${icon("search")}<input type="text" placeholder="Filter" aria-label="Filter the rows"></div>`}
    <div class="tablewrap"><table><thead><tr>${cols.map((c) => `<th${typeof (rows[0] || {})[c] === "number" ? ' class="num"' : ""}>${esc(labels[c] ?? c.replaceAll("_", " "))}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="tablefoot"></div></div>`;
  const body = box.querySelector("tbody"), foot = box.querySelector(".tablefoot"), filter = box.querySelector(".filterbar input");
  let texts = new WeakMap();  // each row as it reads, for the filter: built once, again only when the rows change (redraw)
  const said = (r) => {
    if (!texts.has(r)) { const t = document.createElement("template"); t.innerHTML = cols.map((c) => cellOf(r, c)).join(" "); texts.set(r, t.content.textContent.toLowerCase()); }
    return texts.get(r);
  };
  const draw = () => {
    const q = filter ? filter.value.trim().toLowerCase() : "";
    const shown = rows.map((r, i) => [r, i]).filter(([r]) => !q || said(r).includes(q));
    const at = Math.max(0, Math.min(shown.findIndex(([, i]) => i === opts.selected) - 50, shown.length - most));  // the window holds the picked row
    body.innerHTML = shown.slice(at, at + most).map(([r, i]) => `<tr data-i="${i}" class="${opts.onPick ? "pick" : ""}" aria-selected="${i === opts.selected}">` +
      cols.map((c) => `<td${typeof r[c] === "number" ? ' class="num"' : ""}>${cellOf(r, c)}</td>`).join("") + "</tr>").join("") ||
      `<tr><td colspan="${cols.length}" class="faint">No rows</td></tr>`;
    foot.textContent = `${fmt(shown.length)} of ${plural(rows.length, "row")}` + (shown.length > most ? ` · ${(at + 1).toLocaleString()}–${(at + most).toLocaleString()} shown` : "");
    if (opts.onPick) body.querySelectorAll("tr[data-i]").forEach((tr) => tr.onclick = () => opts.onPick(Number(tr.dataset.i)));
  };
  if (filter) filter.oninput = draw;
  draw();
  return {
    select(i) {
      opts.selected = i;
      if (!body.querySelector(`tr[data-i="${i}"]`)) draw();  // outside the window drawn: draw the window around it
      body.querySelectorAll("tr[data-i]").forEach((tr) => tr.setAttribute("aria-selected", String(Number(tr.dataset.i) === i)));
      const tr = body.querySelector(`tr[data-i="${i}"]`), wrap = box.querySelector(".tablewrap");  // scroll the table, never the page
      if (!tr) return;
      const r = tr.getBoundingClientRect(), w = wrap.getBoundingClientRect(), top = w.top + box.querySelector("thead").offsetHeight;
      if (r.top < top) wrap.scrollTop -= top - r.top; else if (r.bottom > w.bottom) wrap.scrollTop += r.bottom - w.bottom;
    },
    redraw: () => { texts = new WeakMap(); draw(); },
  };
}

// A parameter's input, built from its declaration: a flag a checkbox, a choice a list, the rest a text box.
const FIELD = {input: "Records file"};  // a parameter's name on the page, where its own name says less
const LIT = {load: ["records", "records"], rules: ["rules", "pairs"], candidates: ["candidates", "candidates"], cluster: ["accept", "accepted"]};  // a run's step, the stage it fills in
const RUN_STEPS = ["load", "budget", "fit", "rules", "candidates", "score", "cluster", "probe", "report", "write"];  // a full run's steps, in the order they end
const STEPS_OF = {"add records": ["load", "fit", "rules", "candidates", "score", "cluster", "report", "write"],  // an increment's: no plan, no probe
                  "match records": ["load", "fit", "rules", "candidates", "score", "cluster"]};  // a preview writes nothing
const BUSY = {"resolve records": "Finding matches", "rerun records": "Matching again", "add records": "Adding the new records", "match records": "Previewing the new records",
              "load records": "Loading your file", "accept repairs": "Accepting the repairs", "try everything": "Auto mode", "try method": "Trying a method",
              "set merging": "Rebuilding the entities", "apply answers": "Matching again with your answers"};
const DOING = {load: "reading the records", budget: "planning the work", fit: "learning what matches look like", rules: "applying the match rules",
               candidates: "listing pairs to compare", score: "scoring the pairs", cluster: "forming entities", probe: "looking for matches it missed",
               report: "writing the report", write: "saving"};
const LIT_NODE = {load: "records", rules: "rules", candidates: "candidates", score: "score", cluster: "group"};  // the stage a step works on
const guess = (rows, w) => {  // a run's seconds, about, before it starts: this workspace's last full run, scaled to these records; else this machine's reading of the file, per column, times four; else a minute a million records
  const r = (w.runs || []).filter((x) => x.what === "full run").slice(-1)[0], f = (w.inputs || []).slice(-1)[0];
  const wide = f && f.columns ? Math.min(1, 25 / f.columns) : 1;  // its reading checks every column, a run reads the ones mapped: a wide file reads slower than it runs
  return r && w.records ? 5 + r.seconds * rows / w.records : f && f.seconds && f.rows ? 10 + 4 * wide * f.seconds * rows / f.rows : 10 + rows * 6e-5;
};
const lastRun = (rows, w) => {  // the steps of this workspace's last full run, in seconds, at `rows` records
  // shortcut: scaled linearly by records; exact for the same file, rough for another size (pairs grow faster, the fit's sample not at all)
  const r = (w.runs || []).filter((x) => x.what === "full run" && x.steps && x.records).slice(-1)[0];
  return r ? Object.fromEntries(Object.entries(r.steps).map(([s, t]) => [s, t * rows / r.records])) : null;
};
const about = (s) => s < 90 ? `${Math.max(10, Math.round(s / 10) * 10)} seconds` : lasts(s);
const NEW_FILE = ["add records", "match records"];  // their file is a new one: the file loaded last is matched already
function field(command, name) {
  const p = COMMANDS[command].params.find((x) => x.name === name), id = `f-${name}`;
  const fresh = NEW_FILE.includes(command) && name === "input", needed = fresh || p.required || (p.positional && !p.optional);
  if (p.kind === "flag") return `<label class="check"><input type="checkbox" id="${id}"><span>${esc(p.help[0].toUpperCase() + p.help.slice(1))}</span></label>`;
  const control = p.choices.length ? `<select id="${id}">${p.choices.map((c) => `<option>${esc(c)}</option>`).join("")}</select>`
    : `<input type="text" id="${id}" placeholder="${esc(fresh ? "the new records file" : p.optional ? "the file loaded last" : name === "input" ? "path to a CSV, TSV or Parquet file, or a folder" : p.metavar)}" ${needed ? "required" : ""}>`;
  return `<label class="field"><span class="lab">${esc(FIELD[name] || words(name))}${needed ? " *" : ""}</span>${control}</label>`;
}
function formValues(command, form) {
  const out = {};

    const p = COMMANDS[command].params.find((x) => x.name === name), el = $(`f-${name}`);
    out[name] = p.kind === "flag" ? el.checked : p.kind === "many" ? el.value.split(/\s+/).filter(Boolean) : el.value.trim();

}

// A command in a dialog, as a console's create dialog: its form, the command line it will run, then run.
function action(id, command, label, done, onEvent = null, opts = {}) {  // opts: form, the fields asked (else the layout's); about, one line on what it runs on; extra, arguments the page chose
  const c = COMMANDS[command], form = opts.form || use(id, command).form || [], dlg = $("dlg");
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body"><h2>${esc(label)}</h2>${opts.about ? `<p class="about">${esc(opts.about)}</p>` : ""}${form.map((n) => field(command, n)).join("")}
      <details class="cmdline"><summary>Command line</summary><div class="equiv">${icon("terminal")}<code id="equiv-line"></code>
        <button type="button" class="iconbtn" id="copy" aria-label="Copy the command line">${icon("copy")}</button></div></details></div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn filled" value="run">${esc(label)}</button></div></form>`;
  const preview = async () => {
    const d = await api("/api/run", {command, args: argsFor(id, command, {...formValues(command, form), ...(opts.extra || {})}), dry: true});
    $("equiv-line").textContent = d.command || d.error;
  };
  dlg.querySelectorAll("input, select").forEach((x) => x.oninput = preview);

  preview();

async function flowOf(id, box) {  // the step's part of the pipeline: from describe matching
  const g = await run(id, "describe matching");
  if (g.event === "error") { box.innerHTML = banner(g); graph = null; return null; }  // no other workspace's words
  graph = g;  // every page's cards and words read it: keys and rules by what they look at
  strip(box, g, screen(id).strip);
  if (id !== "run" && id !== "records") box.classList.add("foot");  // step 3's strip answers how it found matches, the Overview's is the whole pipeline; elsewhere it says where the step sits, at the foot
  where();
  return g;
}

const rangeOf = (r) => r.down_to === null ? `below ${fmt(r.up_to)}` : r.up_to === null ? `${fmt(r.down_to)}+` : `${fmt(r.down_to)} to ${fmt(r.up_to)}`;
const pager = (total, page, count) => `<div class="pager"><span class="faint">${total ? `${fmt((page - 1) * count + 1)}–${fmt(Math.min(total, page * count))} of ${fmt(total)}` : "none"}</span>
