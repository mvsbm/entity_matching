          rows: (d) => d.kinds, cols: ["status", "why", "id", "name", "engine_says"], labels: {engine_says: "engine"}, some: "records to check",
          keys: {"1": "person", "2": "company", "0": "unsure"}, answer: (r, value) => ({id: r.id, kind: value}), card: kindCard},
};

const keyHint = (keys) => `<span class="keys">${keys.map(([k, what]) => `<kbd>${esc(k)}</kbd> ${esc(what)}`).join(" · ")} · <kbd>S</kbd> skip · <kbd>↑</kbd><kbd>↓</kbd> move</span>`;
// A card's head: what it shows, one of the list; the question it asks; why this one is asked.
const cardHead = (r, at, of, written, [ic, what, question], why) => `${scope(ic, `${what} · ${fmt(at + 1)} of ${fmt(of)}`)}
  <h2 class="question">${esc(question)} ${chip(r.status, written)}</h2><p class="why">${esc(why)}</p>`;
let graph = null;  // the run's describe matching, which the cards draw their ladders and the line from

function pairCard(r, at, of) {  // the two records side by side, their differences marked; each comparison's step on its ladder and its points
  const fields = Object.keys(r).filter((k) => k.endsWith("_l") && k !== "id_l" && `${k.slice(0, -2)}_r` in r).map((k) => k.slice(0, -2))
    .filter((f) => r[`${f}_l`] !== null || r[`${f}_r`] !== null);
  const score = graph && graph.nodes.find((n) => n.id === "score"), accept = graph && graph.nodes.find((n) => n.id === "accept");
  const comps = Object.keys(r).filter((k) => `${k}_bits` in r), ladder = Object.fromEntries((score ? score.comparisons : []).map((c) => [c.name, c.levels]));
  const max = Math.max(4, ...comps.map((c) => Math.abs(r[`${c}_bits`] ?? 0))), line = accept ? accept.threshold : 8;
  const why = r.why === "audit" ? "A spot-check: the engine matched these two, and you confirm it."
    : r.match_weight >= line ? "No name to compare, so the engine leaves this one to you." : `Close to the line: ${fmt(r.match_weight)} points, and ${line} are needed.`;
  return `<div class="card one">${cardHead(r, at, of, "decided", ["pairs", "This pair", "Same customer?"], why)}
    <div class="tablecard"><table><thead><tr><th></th><th>${esc(r.id_l)}</th><th>${esc(r.id_r)}</th></tr></thead><tbody>${fields.map((f) => {
      const [a, b] = highlight(r[`${f}_l`], r[`${f}_r`]);
      return `<tr><td class="faint">${esc(words(f))}</td><td class="wrap">${r[`${f}_l`] === null ? "—" : a}</td><td class="wrap">${r[`${f}_r`] === null ? "—" : b}</td></tr>`;
    }).join("")}</tbody></table></div>
    <div class="bars" style="grid-template-columns:minmax(70px,max-content) max-content minmax(0,1fr) minmax(100px,1.2fr) 48px">${comps.map((c) => {
      const levels = ladder[c] || [], reached = levels.findIndex((l) => l.label === r[c]), bits = r[`${c}_bits`];
      return `<span class="lab">${esc(comp(c))}</span><span class="ladder" title="${esc(levels.map((l) => level(l.label)).join(" › "))}">${levels.map((l, n) =>
        `<i class="${n === reached ? `on ${bits < 0 ? "neg" : ""}` : ""}" title="${esc(level(l.label))}${l.bits !== null && l.bits !== undefined ? `: ${l.bits >= 0 ? "+" : ""}${l.bits.toFixed(1)} points` : ""}"></i>`).join("")}</span>
        <span class="faint" style="font-size:12px">${esc(level(r[c]))}</span>${bitsBar(bits, max)}<span class="val">${bits >= 0 ? "+" : ""}${fmt(bits)}</span>`;
    }).join("")}</div>
    ${ruler(comps.map((c) => ({label: comp(c), bits: r[`${c}_bits`] || 0})), line, score && score.prior_bits !== null ? score.prior_bits : 0)}
    <div class="actions"><button class="btn filled" data-a="match">Same customer</button><button class="btn outlined" data-a="no_match">Different</button>
      <button class="btn" data-skip>Skip</button>${keyHint([["M", "same customer"], ["N", "different"]])}</div><div id="said"></div></div>`;
}

function kindCard(r, at, of) {  // the name, and where the engine and the name alone place it, from person to company
  const why = {decide: "The engine is not sure, so it holds this record back for you.", measure: "A random sample: your answer checks the engine."}[r.why] || "";
  return `<div class="card one">${cardHead(r, at, of, "answered", ["person", "This record", "Person or company?"], why)}<div class="big">${esc(r.name)}</div>${slider(r)}
    <div class="chips" style="margin-top:12px">${["flag", "birth_date"].filter((k) => k in r && r[k] !== null).map((k) => `<span class="tag">${esc(words(k))}: ${esc(r[k])}</span>`).join("")}</div>
    <div class="actions"><button class="btn filled" data-a="person">${icon("person")}Person</button><button class="btn filled" data-a="company">${icon("kinds")}Company</button>
      <button class="btn outlined" data-a="unsure">Can't tell</button><button class="btn" data-skip>Skip</button>${keyHint([["1", "person"], ["2", "company"], ["0", "can't tell"]])}</div>
    <div id="said"></div></div>`;
}

// A review page: the queue as a table, the picked row in a card beside it, answered by keyboard, one answer at a time.
async function review(el, which, note = "") {
  const q = QUEUES[which];
  el.innerHTML = head(which, `<button class="btn filled" id="apply">${icon("check")}${q.applyLabel} <span class="badge" id="written">0</span></button>
      <button class="btn" id="refresh">${icon("refresh")}Refresh</button>`) +
    `<div id="note">${note}</div><div id="flow"></div><div class="split"><div><div id="some"></div><div id="left" class="faint">Loading…</div></div><div id="right" class="panel-sticky"></div></div>${stepFoot(which)}`;
  $("refresh").onclick = () => go(which);
  $("apply").disabled = true;
  if (!state.workspace) { $("left").innerHTML = emptyRun(); return; }
  const [d, g] = await Promise.all([run(which, q.list), flowOf(which, $("flow"))]);
  graph = g;
  if (d.event === "error") { $("left").innerHTML = banner(d); return; }
  const rows = q.rows(d);
  $("some").innerHTML = scope("records", `${fmt(rows.length)} ${q.some}`);
  let i = Math.max(0, rows.findIndex((r) => r.status === "open")), written = 0, pending = false;
  const tally = () => { $("written").textContent = String(written); $("apply").disabled = !rows.some((r) => r.status === "written in"); };
  const t = grid($("left"), rows, q.cols, {labels: q.labels, selected: i, cell: (r, c) => c === "status" || c === "why" ? chip(r[c], q.written) : esc(fmt(r[c])),
                                           onPick: (k) => { i = k; show(); }});
  const move = (step) => { i = Math.min(rows.length - 1, Math.max(0, i + step)); show(); };
  const local = () => {  // the stepper's line, from the rows this page holds: no server call per answer
    const open = rows.filter((r) => r.why === "decide" && r.status === "open").length, w = rows.filter((r) => r.status === "written in").length;
    if (steps.steps && (open || w)) { steps.steps[which] = {state: "attention", line: open ? `${fmt(open)} to decide` : `${fmt(w)} ${q.written}, to apply`}; rail(); }
  };
  const answer = async (value) => {
    if (pending) return;  // a key held down or pressed twice: one answer for the row, then the next row
    pending = true;
    try {
      const r = rows[i], e = await run(which, q.one, q.answer(r, value));
      if (e.event === "error") { $("said").innerHTML = banner(e); return; }
      r.status = "written in"; written++; tally(); t.redraw(); local();
      const next = rows.findIndex((x, k) => k > i && x.status === "open");
      if (next >= 0) i = next;
      show();
    } finally { pending = false; }
  };
  const show = () => {
    t.select(i);
    if (!rows[i]) { $("right").innerHTML = `<div class="card empty">${icon("empty")}<p class="muted">Nothing is open here.</p></div>`; where(); return; }
    $("right").innerHTML = q.card(rows[i], i, rows.length);
    where();
    $("right").querySelectorAll("[data-a]").forEach((b) => b.onclick = () => answer(b.dataset.a));
    $("right").querySelector("[data-skip]").onclick = () => move(1);
  };
  const applied = (e) => {
    if (e.event === "error") { $("note").innerHTML = banner(e); return; }
    if (q.rerun) return go(which, `<div class="banner info">${icon("check")}<div><b>Answers applied: matched again, and these are the records still open.</b></div></div>`);
    $("note").innerHTML = q.applied(e);
    rows.forEach((r) => { if (r.status === "written in") r.status = "applied"; });
    written = 0; tally(); t.redraw(); refresh(); flowOf(which, $("flow"));
  };
  $("apply").onclick = () => q.rerun ? action(which, q.apply, q.applyLabel, applied) : run(which, q.apply).then(applied);
  const keys = Object.fromEntries(Object.entries(q.keys).map(([k, value]) => [k, () => answer(value)]));
  keyHandler = (k) => ({...keys, s: () => move(1), ArrowDown: () => move(1), ArrowUp: () => move(-1), j: () => move(1), k: () => move(-1)})[k];
  tally();
  show();
}

const NEED = [["folder", "Workspace", "one folder per job"], ["records", "Your records", "loaded in step 2"],
              ["customers", "Customers", "one ID each"]];  // what matching needs, then what it gives
function emptyRun(d) {  // d: the workspace described, when the page has it
  if (!state.workspace) return `<div class="card empty"><h2>Gather each customer's records under one ID</h2><div class="flow">${NEED.map(([ic, name, what], i) =>
    `${i ? ARROW : ""}<span class="node static"><span class="top">${icon(ic)}${esc(name)}</span><span class="faint" style="font-size:12px">${esc(what)}</span></span>`).join("")}</div>
    <div class="actions" style="justify-content:center"><button class="btn filled" data-pick>1 · Choose a workspace</button></div></div>`;
  return `<div class="card empty">${icon("folder")}<h2>Nothing matched in ${esc(state.workspace.split("/").filter(Boolean).pop())} yet</h2>
    <div class="actions" style="justify-content:center">${d && d.inputs && d.inputs.length ? '<a class="btn filled" data-go="run">3 · Find matches</a>'
      : '<a class="btn filled" data-go="columns">2 · Prepare your data</a>'}</div></div>`;
}

// The workspace picker, as a console's project picker: the workspaces on disk (list workspaces), or a new one.
async function pick() {
  const dlg = $("dlg"), list = await run("records", "list workspaces"), rows = list.workspaces || [];
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body"><h2>Choose a workspace</h2>
    <label class="field"><span class="lab">New workspace</span><span style="display:flex;gap:8px"><input type="text" id="new-name" placeholder="acme-2026" aria-label="New workspace name">
      <button type="button" class="btn filled" id="create">Create</button></span></label><div id="made"></div>
    ${rows.length ? `<span class="lab faint" style="font-size:12px">Open one</span><div class="tablecard"><table><tbody>${rows.map((w) =>
      `<tr class="pick" data-w="${esc(w.workspace)}"><td style="width:40px">${icon("folder")}</td><td>${esc(w.name)}</td><td class="faint">${fmt(w.files)} file${w.files === 1 ? "" : "s"} · ${w.ran ? "matched" : "not run yet"}</td>
       <td class="faint">${esc(String(w.last).slice(0, 10))}</td></tr>`).join("")}</tbody></table></div>` : ""}${banner(list)}</div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn" value="cancel" formnovalidate>Cancel</button></div></form>`;
  dlg.querySelectorAll("[data-w]").forEach((tr) => tr.onclick = () => { dlg.close(); setWorkspace(tr.dataset.w); });
  $("create").onclick = async () => {
    const d = await run("records", "create workspace", {name: $("new-name").value.trim()});
    if (d.event === "error") { $("made").innerHTML = banner(d); return; }
    dlg.close();
    current = "columns";  // a new workspace's next step
    setWorkspace(d.workspace);
  };
  $("new-name").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("create").click(); } };
  dlg.onclose = null;
  dlg.returnValue = "";
  dlg.showModal();
}
function setWorkspace(r) {
  state.workspace = r;
  store("workspace", r);  // per viewer: the workspace this browser opens with
  $("picker").innerHTML = `${icon("folder")}<span title="${esc(r)}">${esc(r ? `Workspace: ${r.split("/").filter(Boolean).pop()}` : "Choose a workspace")}</span>${icon("down")}`;
  go(current);
}

// Every command, from the declarations.
function help() {
  const dlg = $("dlg");
  dlg.innerHTML = `<form method="dialog"><div class="dlg-body"><h2>Commands</h2><p class="about">Every button runs one of these, as <code>nayose VERB NOUN</code>; docs/commands.md has them all.</p>
    <div class="tablecard"><div class="tablewrap" style="max-height:50vh"><table><tbody>${Object.values(COMMANDS).map((c) => `<tr><td><code>${esc(c.name)}</code></td><td class="wrap">${esc(c.help)}</td></tr>`).join("")}</tbody></table></div></div></div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn filled" value="close">Close</button></div></form>`;
  dlg.onclose = null;
  dlg.showModal();
}

async function go(id, arg) {
  current = id; keyHandler = null; visit++;
  document.body.classList.remove("nav-open");
  rail();
  await refresh(await SCREENS[id]($("screen"), arg));
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-go]");
  if (a) { e.preventDefault(); go(a.dataset.go); }
  if (e.target.closest("[data-pick]")) pick();
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey || $("dlg").open) return;
  if (e.key === "/") { e.preventDefault(); $("search").focus(); return; }
  const act = keyHandler && keyHandler(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (act) { e.preventDefault(); act(); }
});

(async () => {
  for (const [id, name] of [["menu", "menu"], ["search-ic", "search"], ["term-toggle", "terminal"], ["help", "help"], ["term-ic", "terminal"], ["term-clear", "clear"], ["term-close", "close"]]) $(id).innerHTML = icon(name);
  const d = await api("/api/commands");
  if (!d.commands) { $("screen").innerHTML = `<div style="padding:24px">${banner({event: "error", error: d.error || "This page needs the link nayose open ui printed"})}</div>`; return; }
  COMMANDS = Object.fromEntries(d.commands.map((c) => [c.name, c]));
  state.home = d.home;
  $("menu").onclick = () => document.body.classList.toggle(matchMedia("(max-width: 860px)").matches ? "nav-open" : "collapsed");
  $("picker").onclick = pick;
  $("help").onclick = help;
  $("term-toggle").onclick = () => term.show($("term").hidden);
  $("term-close").onclick = () => term.show(false);
  $("term-clear").onclick = () => { $("term-body").innerHTML = ""; };
  $("search").onkeydown = (e) => { if (e.key === "Enter" && $("search").value.trim()) { go("results", $("search").value.trim()); $("search").blur(); } };
  setWorkspace(d.workspace || store("workspace") || "");
})();
</script>
