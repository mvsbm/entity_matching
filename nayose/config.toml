# The values nayose's SQL reads, a section per stage file (nayose/sql/). The method itself (the fields, keys, rules and
# comparisons) is the SQL; what is here are its numbers and lists. A change here changes the run's fingerprint, so
# updates refuse until a build (nayose.fingerprint).

[records]  # sql/records.sql
kana_fold_from = "ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴァィゥェォッャュョヮヵヶヲー"  # kana folding, character by character: voiced → unvoiced, small → large, ヴ/ヂ/ヅ/ヲ, ー → ウ
kana_fold_to   = "カキクケコサシスセソタチツテトハヒフヘホハヒフヘホフアイウエオツヤユヨワカケオウ"
# legal forms, after NFKC: anywhere in a name (with small kana also written large); bank abbreviations first, カ)〇〇, or last, 〇〇(カ
legal_forms = [
  "株式会社", "有限会社", "合同会社", "合資会社", "合名会社", "相互会社", "医療法人社団", "医療法人財団",
  "医療法人", "一般社団法人", "公益社団法人", "一般財団法人", "公益財団法人", "特定非営利活動法人", "社会福祉法人", "学校法人",
  "宗教法人", "(株)", "(有)", "(同)", "(資)", "(名)", "カブシキガイシャ", "ユウゲンガイシャ",
  "ゴウドウガイシャ", "ゴウシガイシャ", "ゴウメイガイシャ", "ソウゴガイシャ", "イリョウホウジンシャダン", "イリョウホウジンザイダン", "イリョウホウジン", "イッパンザイダンホウジン",
  "コウエキザイダンホウジン", "イッパンシャダンホウジン", "コウエキシャダンホウジン", "シュウキョウホウジン", "ガッコウホウジン", "シャカイフクシホウジン", "コウセイホゴホウジン", "トクテイヒエイリカツドウホウジン",
  "ドクリツギョウセイホウジン", "ベンゴシホウジン", "ギョウセイショシホウジン", "シホウショシホウジン", "ゼイリシホウジン", "ユウゲンセキニンチュウカンホウジン", "ムゲンセキニンチュウカンホウジン", "コクリツダイガクホウジン",
  "コウリツダイガクホウジン", "ノウジクミアイホウジン", "カンリクミアイホウジン", "シャカイホケンロウムシホウジン", "コクリツケンキュウカイハツホウジン", "(カ)", "(ユ)", "(メ)",
  "(シ)", "(ド)", "(ソ)", "(ホゴ)", "(ギヨ)", "(シホウ)", "(ゼイ)", "(ダイ)",
  "(ノウ)", "(ケン)", "カ)", "ユ)",
]
legal_front = [
  "カ", "ユ", "メ", "シ", "ド", "ソ", "イ", "ザイ", "シヤ", "シユウ", "ガク", "フク",
  "ホゴ", "トクヒ", "ドク", "ベン", "ギヨ", "シホウ", "ゼイ", "チユウ", "ダイ", "ノウ", "ケン",
]
legal_end = [
  "カ", "ユ", "メ", "シ", "ド", "ソ", "イ", "ギヨ", "シホウ", "ゼイ", "ダイ", "ノウ",
  "カンリ", "ロウム",
]
prefectures = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県",
  "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県",
  "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県",
  "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
]  # an address's own prefecture, cut off its start
flag_company = ["2"]  # the values of kind_flag that say company; any other says person
name_line = 0.99  # the name model calls a kind it is at least this sure of
ngram = 3  # the name model reads a name's character n-grams of 1 to this many characters (config/kind_names.npz)
trust_flag = false  # true: the file's flag decides every record's kind
shared_name_column = false  # true: one column holds every name, a person's or a company's; each goes to the side its kind leans to
placeholder_min = 64  # records: the fewest a placeholder is held by
spread = 10  # a placeholder is held by this many times the field's records per value, or more
crowd = 64  # the fewest customers (customer IDs, or records without one) a compared field's placeholder is held by

[input]  # sql/functions.sql's intake, and mapping.sql
nulls = ["NULL", "null", "Null", "\\N", "NaN", "nan", "None", "none", "N/A", "n/a", "#N/A", "-", "－"]  # a value written as one of these is missing
id = "CONT_ID"  # the column mapping.sql reads a record's ID from (a record looked up by its values takes the lookup's own)
# every column mapping.sql reads; one a file lacks is read as missing
columns = ["CONT_ID", "FULL_NAME_KANA", "O_PERSON_NAME_KANA", "LAST_NAME_KANA", "GIVEN_NAME_KANA", "NYS_CNV_P_NAME_KANA",
           "STD_ADDRESS", "ORIGINAL_ADDRESS", "SOURCE_ADDR_CD", "POST_CD", "POST_CD_KANA", "ADDRESS_ONE", "ADDR_CD", "ADDRESS_TWO",
           "PHONE_NUM_4", "CIF_ID", "BIRTH_DATE", "PERSON_ORG_CODE"]

[fit]  # sql/fit.sql, nayose/em.py
fit_records = 100000          # the sample the model is learned on: whole postal areas by hash, the last one cut
prior_recall = 0.0217         # the share of all matches the near-certain rules are thought to find
fit_u_max_pairs = 1000000     # u sampled on the fit's sample: about this many pairs
u_max_pairs = 10000000        # u sampled on the file to be scored: about this many pairs
rebuild_after = 0.1           # report.txt says to build again once the run has grown this much since its build
seed = 0                      # the sample's hash seed
# the EM sessions, in order: each learns from the sample's pairs sharing its key (fit.sql em_patterns); `start`: the
# exact levels the key guarantees, whose evidence λ among its pairs starts from
em_sessions = [{ key = "phone", start = [["phone", "exact"]] }, { key = "address", start = [] }]

[score]  # sql/score.sql
# the generators and rules a run uses, by the names score.sql gives them (each written once there; its order sets a
# generator's bit in a pair's mask and a rule's rank): leave one out to run without it
generators = ["customer_id", "phone_prefecture", "phone_postal_area", "phone_name_initial", "person_name", "company_name",
              "company_name_deletions", "person_name_deletions_postal_area", "given_name_postal", "address_phone",
              "address_code_phone", "address_name_initial", "address_code_name_initial", "given_name_address_code",
              "customer_id_deletions", "birth_date", "given_name_phone", "birth_date_deletions_prefecture", "name_reading",
              "phone_name_tail", "postal_name_tail", "postal_area_name_tail"]
rules = ["X1_CIF_FULL_NAME", "X2_CIF_COMPANY_NAME", "X3_CIF_PHONE", "X4_FULL_NAME_ADDRCD_PHONE", "X5_COMPANY_NAME_ADDRCD_PHONE",
         "F1_NAME~_ADDRCD_PHONE", "F2_NAME~_ADDRESS~_PHONE", "F3_NAME~_CIF", "F4_NAME_ADDRCD_PHONE~", "F5_COMPANY~_PHONE_POSTAL",
         "F6_COMPANY~_ADDRCD_PHONE", "X6_GIVEN_ADDRCD_PHONE"]
keep_from = 0.0      # points: scored pairs are kept from here up (and every rule pair): what a match run can offer
search_floor = 0.0   # points: a sampled pair at or above it keeps its oversized block (people review from 4 points)
oversized = 64       # records: a block this big or bigger is checked on a sample of as many of its records first,
                     # and joined only if it holds a pair at search_floor; a rule leaves out a key held by this many records

[lookup]  # sql/lookup.sql
at_least = 4.0     # points: the entities a lookup shows by default, from here up (the review floor), and every one a rule joins
likely_from = 6.0  # points: a candidate from here up whose names were compared is likely, as people review
most = 20          # the most entities a lookup shows

[report]  # sql/report.sql, nayose/reporting.py
sample_records = 10000  # records: FIELDS reads a sample of this many by hash, COLUMNS NOT MAPPED the input's first this many
patterns_shown = 12     # PATTERNS BY SCORE shows each band's this many most common patterns of levels

[report.looks]  # sql/report.sql, nayose.report: what each field's values look like, for FIELDS' "looks right" and
# COLUMNS NOT MAPPED's "looks like" (RE2; company_name's: a legal form, [records]'s)
full_name = '^[ァ-ヴー・ｦ-ﾟ\s　]+$'
person_name = '^[ァ-ヴー・ｦ-ﾟ\s　]+$'
given_name = '^[ァ-ヴーｦ-ﾟ]{1,12}$'
any_name = '^[ァ-ヴー・ｦ-ﾟ\s　()（）]+$'
address = '[都道府県市区町村].*[0-9０-９]'
address_code = '^[0-9]{5,}$'
postal_code = '^〒?[0-9０-９]{3}[-－]?[0-9０-９]{4}$'
prefecture = '^(北海道|東京都|京都府|大阪府|.{2,3}県)$'
town_code = '^[0-9]{11}$'
city = '[市区町村郡]$'
phone = '^[0-9]{4}$'
customer_id = '^[0-9]{8,}$'
birth_date = '^((19|20)?[0-9]{2})[-/.]?[01][0-9][-/.]?[0-3][0-9]$'   # 1993-05-25, 19930525, 93-05-25, 1993/05/25
