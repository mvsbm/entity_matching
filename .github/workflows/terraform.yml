# The Terraform the DevOps team applies, formatted and valid (the procedures deploy/deploy.py makes are the tests':
# tests/test_deploy.py). On a pull request that touches the Terraform, and on main.
name: terraform
on:
  push:
    branches: [main]
  pull_request:
    paths: ["deploy/terraform/**", ".github/workflows/terraform.yml"]
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly  # the providers at .terraform.lock.hcl's hashes
      - run: terraform validate
