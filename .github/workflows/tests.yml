# Every pull request, and main, runs the tests: the engine, whole runs, and the design checked against the code.
name: tests
on:
  push:
    branches: [main]  # a branch's pushes run as its pull request's
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]  # the oldest pyproject.toml allows, and the one the project runs on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
