# Every pull request, and main, runs the tests: lint, the page's script, the fast checks, whole runs, the page in a
# browser, and the design checked against the code. The job names are what branch protection requires: keep them.
name: tests
on:
  push:
    branches: [main]  # a branch's pushes run as its pull request's
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a newer push to a pull request makes this run moot; main's runs all finish
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # the oldest pyproject.toml allows, and the one the project runs on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .  # the rules in pyproject.toml [tool.ruff.lint]
      - run: sed -n '/<script>/,/<\/script>/p' er/ui.html | sed '1d;$d' > "$RUNNER_TEMP/page.js" && test -s "$RUNNER_TEMP/page.js" && node --check "$RUNNER_TEMP/page.js"  # the page's script, found and parsed
      - run: python -m pytest -n auto -m "not slow and not browser"  # seconds: a broken engine fails here first; -n auto: a test a core
      - run: python -m pytest -n auto -m "slow and not browser"  # whole runs on a generated population
      - if: matrix.python == '3.12'  # the page runs the same on either Python: one browser run is enough, on the job that is otherwise shorter
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - if: matrix.python == '3.12'
        run: python -m playwright install --with-deps chromium
      - if: matrix.python == '3.12'
        run: python -m pytest -n auto -m browser  # CI is set: a missing browser fails, never skips
