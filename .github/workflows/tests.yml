# A pull request runs lint and the tests, in about two minutes. main, and a run started by hand on any branch, runs them
# on Windows too, set up as a person sets it up there. The job names pytest (3.12) and pytest (3.14) are what branch
# protection requires: keep them.
name: tests
on:
  push:
    branches: [main]  # a branch's pushes run as its pull request's
  pull_request:
  workflow_dispatch:  # Windows' tests on a branch, when a change needs them before it merges
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a newer push to a pull request makes this run moot; main's runs all finish
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # the oldest pyproject.toml allows, and the one the project runs on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.3.3: installs in seconds, from its cache
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt
      - run: ruff check .  # the rules in pyproject.toml [tool.ruff.lint]
      - run: python -m pytest -n auto  # -n auto: a test a core
  windows:  # the tests on Windows, set up as a person sets it up there (setup_venv.ps1)
    name: windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: .\setup_venv.ps1
      - run: .venv\Scripts\python -m pytest -n auto
