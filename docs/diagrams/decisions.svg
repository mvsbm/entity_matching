<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1925px;height:474px;background:#FFFFFF;" width="1925px" height="474px" viewBox="0 0 1925 474" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="500.734" y="23.535" fill="#000" font-size="14" textLength="916.686" font-weight="700">LLD 3 · Decisions: jobs.decide.decide (python -m er decide [FILE] --out …), scoring nothing, then the index brought up to date</text></g><!--entity people--><g class="entity" data-qualified-name="people" id="ent0001" data-source-line="16"><ellipse cx="610.3" cy="51.488" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M610.3,59.488 L610.3,86.488 M597.3,67.488 L623.3,67.488 M610.3,86.488 L597.3,101.488 M610.3,86.488 L623.3,101.488" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="592.28" y="113.623" fill="#000" font-size="11" textLength="36.04">people</text></g><!--entity f_decided--><g class="entity" data-qualified-name="f_decided" id="ent0002" data-source-line="17"><path d="M305.68,178.448 L305.68,206.403 A2.5,2.5 0 0 0 308.18,208.903 L912.432,208.903 A2.5,2.5 0 0 0 914.932,206.403 L914.932,185.948 L904.932,175.948 L308.18,175.948 A2.5,2.5 0 0 0 305.68,178.448" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M904.932,175.948 L904.932,183.448 A2.5,2.5 0 0 0 907.432,185.948 L914.932,185.948" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="315.68" y="196.583" fill="#000" font-size="11" textLength="589.252">the run's review.parquet with decision filled in (given no file), or any Parquet file with &lt;id>_l, &lt;id>_r, decision</text></g><!--entity f_gold_in--><g class="entity" data-qualified-name="f_gold_in" id="ent0003" data-source-line="18"><path d="M950.22,178.448 L950.22,206.403 A2.5,2.5 0 0 0 952.72,208.903 L1093.876,208.903 A2.5,2.5 0 0 0 1096.376,206.403 L1096.376,185.948 L1086.376,175.948 L952.72,175.948 A2.5,2.5 0 0 0 950.22,178.448" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1086.376,175.948 L1086.376,183.448 A2.5,2.5 0 0 0 1088.876,185.948 L1096.376,185.948" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="960.22" y="196.583" fill="#000" font-size="11" textLength="126.156">gold.parquet (the run's)</text></g><!--entity decide--><g class="entity" data-qualified-name="decide" id="ent0004" data-source-line="20"><rect x="81.31" y="268.898" width="1469.98" height="97.73" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="91.31" y="289.533" fill="#000" font-size="11" textLength="36.899" font-weight="700">decide</text><text x="131.69" y="289.533" fill="#000" font-size="11" textLength="174.426">· O(D + touched clusters) + O(N)</text><text x="91.31" y="302.488" fill="#000" font-size="11" textLength="1449.98">jobs.decide.decide · jobs.decide._decide · source.readable · source.find · jobs.build.given · jobs.build.indexed · jobs.build.out_of_memory · jobs.index.update · steps.job.start · engine.duckdb.connect · folder.run_lock · folder.lockable · folder.held · io.lock · io.object_store</text><text x="91.31" y="315.443" fill="#000" font-size="11" textLength="671.569">report.no_run · folder.finish_writes · folder.latest_decisions · source.decisions · source.file_facts · io.replace_text · io.patiently</text><text x="91.31" y="328.398" fill="#000" font-size="11" textLength="719.667">the checks, every ID a record of the run: source.known · each match pair merges its two clusters: cluster.merge, each cluster one node</text><text x="91.31" y="341.353" fill="#000" font-size="11" textLength="396.747">kinds kept, a merged customer's kind again: steps.cluster.customer_kinds</text><text x="91.31" y="354.308" fill="#000" font-size="11" textLength="654.854">folder.next_part · folder.stage · steps.write.log_entry · steps.write.run_config · io.config_hash · folder.log · io.code_version</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="23"><path d="M1586.46,280.378 L1586.46,313.768 L1551.71,317.768 L1586.46,321.768 L1586.46,355.154 A0,0 0 0 0 1586.46,355.154 L1910.153,355.154 A0,0 0 0 0 1910.153,355.154 L1910.153,290.378 L1900.153,280.378 L1586.46,280.378 A0,0 0 0 0 1586.46,280.378" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><path d="M1900.153,280.378 L1900.153,290.378 L1910.153,290.378 L1900.153,280.378" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><text x="1592.46" y="296.013" fill="#000" font-size="11" textLength="164.06">stops, with what to fix (exit 2):</text><text x="1592.46" y="308.968" fill="#000" font-size="11" textLength="302.693">the columns missing; a decision not match or no_match;</text><text x="1592.46" y="321.923" fill="#000" font-size="11" textLength="248.123">a pair decided both ways; an ID not in the run.</text><text x="1592.46" y="334.878" fill="#000" font-size="11" textLength="246.641">A no_match pair splits nothing here: a full run</text><text x="1592.46" y="347.833" fill="#000" font-size="11" textLength="194.912">on this folder never accepts it again.</text></g><!--entity f_gold_out--><g class="entity" data-qualified-name="f_gold_out" id="ent0008" data-source-line="30"><path d="M6,429.128 L6,457.083 A2.5,2.5 0 0 0 8.5,459.583 L422.105,459.583 A2.5,2.5 0 0 0 424.605,457.083 L424.605,436.628 L414.605,426.628 L8.5,426.628 A2.5,2.5 0 0 0 6,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M414.605,426.628 L414.605,434.128 A2.5,2.5 0 0 0 417.105,436.628 L424.605,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="16" y="447.263" fill="#000" font-size="11" textLength="398.605">gold.parquet: rewritten; a record joined only this way is resolved by review</text></g><!--entity f_kept--><g class="entity" data-qualified-name="f_kept" id="ent0009" data-source-line="31"><path d="M459.45,429.128 L459.45,457.083 A2.5,2.5 0 0 0 461.95,459.583 L852.647,459.583 A2.5,2.5 0 0 0 855.147,457.083 L855.147,436.628 L845.147,426.628 L461.95,426.628 A2.5,2.5 0 0 0 459.45,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M845.147,426.628 L845.147,434.128 A2.5,2.5 0 0 0 847.647,436.628 L855.147,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="469.45" y="447.263" fill="#000" font-size="11" textLength="375.697">decisions/part-n.parquet: kept for good; a full run applies them again</text></g><!--entity f_steps--><g class="entity" data-qualified-name="f_steps" id="ent0010" data-source-line="32"><path d="M890.52,429.128 L890.52,457.083 A2.5,2.5 0 0 0 893.02,459.583 L1059.576,459.583 A2.5,2.5 0 0 0 1062.076,457.083 L1062.076,436.628 L1052.076,426.628 L893.02,426.628 A2.5,2.5 0 0 0 890.52,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1052.076,426.628 L1052.076,434.128 A2.5,2.5 0 0 0 1054.576,436.628 L1062.076,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="900.52" y="447.263" fill="#000" font-size="11" textLength="151.556">steps.json: a decisions entry</text></g><!--entity f_index--><g class="entity" data-qualified-name="f_index" id="ent0011" data-source-line="33"><path d="M1096.97,429.128 L1096.97,457.083 A2.5,2.5 0 0 0 1099.47,459.583 L1365.139,459.583 A2.5,2.5 0 0 0 1367.639,457.083 L1367.639,436.628 L1357.639,426.628 L1099.47,426.628 A2.5,2.5 0 0 0 1096.97,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1357.639,426.628 L1357.639,434.128 A2.5,2.5 0 0 0 1360.139,436.628 L1367.639,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="1106.97" y="447.263" fill="#000" font-size="11" textLength="250.669">index/: brought up to date (jobs.index.update)</text></g><!--link people to f_decided--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12