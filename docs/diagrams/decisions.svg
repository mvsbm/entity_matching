<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1401px;height:461px;background:#FFFFFF;" width="1401px" height="461px" viewBox="0 0 1401 461" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="300.78" y="23.535" fill="#000" font-size="14" textLength="792.593" font-weight="700">LLD 3 · Decisions: Run.decide (scripts/resolve.py --output … --decisions reviewed.parquet), scoring nothing</text></g><!--entity people--><g class="entity" data-qualified-name="people" id="ent0001" data-source-line="16"><ellipse cx="469.3" cy="51.488" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M469.3,59.488 L469.3,86.488 M456.3,67.488 L482.3,67.488 M469.3,86.488 L456.3,101.488 M469.3,86.488 L482.3,101.488" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="451.28" y="113.623" fill="#000" font-size="11" textLength="36.04">people</text></g><!--entity f_decided--><g class="entity" data-qualified-name="f_decided" id="ent0002" data-source-line="17"><path d="M200.55,178.438 L200.55,206.393 A2.5,2.5 0 0 0 203.05,208.893 L735.555,208.893 A2.5,2.5 0 0 0 738.055,206.393 L738.055,185.938 L728.055,175.938 L203.05,175.938 A2.5,2.5 0 0 0 200.55,178.438" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M728.055,175.938 L728.055,183.438 A2.5,2.5 0 0 0 730.555,185.938 L738.055,185.938" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="210.55" y="196.573" fill="#000" font-size="11" textLength="517.505">reviewed.parquet: review.parquet with decision filled in, or any file with &lt;id>_l, &lt;id>_r, decision</text></g><!--entity f_gold_in--><g class="entity" data-qualified-name="f_gold_in" id="ent0003" data-source-line="18"><path d="M773.22,178.438 L773.22,206.393 A2.5,2.5 0 0 0 775.72,208.893 L916.876,208.893 A2.5,2.5 0 0 0 919.376,206.393 L919.376,185.938 L909.376,175.938 L775.72,175.938 A2.5,2.5 0 0 0 773.22,178.438" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M909.376,175.938 L909.376,183.438 A2.5,2.5 0 0 0 911.876,185.938 L919.376,185.938" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="783.22" y="196.573" fill="#000" font-size="11" textLength="126.156">gold.parquet (the run's)</text></g><!--entity decide--><g class="entity" data-qualified-name="decide" id="ent0004" data-source-line="20"><rect x="287.47" y="268.898" width="739.667" height="84.775" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="297.47" y="289.533" fill="#000" font-size="11" textLength="36.899" font-weight="700">decide</text><text x="337.85" y="289.533" fill="#000" font-size="11" textLength="174.426">· O(D + touched clusters) + O(N)</text><text x="297.47" y="302.488" fill="#000" font-size="11" textLength="367.737">Run.decide · folder.finish_writes · source.decisions · source.file_facts</text><text x="297.47" y="315.443" fill="#000" font-size="11" textLength="719.667">the checks, every ID a record of the run: source.known · each match pair merges its two clusters: cluster.merge, each cluster one node</text><text x="297.47" y="328.398" fill="#000" font-size="11" textLength="347.048">kinds kept, a merged customer's kind again: run.customer_kinds</text><text x="297.47" y="341.353" fill="#000" font-size="11" textLength="372.754">folder.next_part · folder.stage · Run._log · folder.log · io.code_version</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="23"><path d="M1062.46,273.898 L1062.46,307.288 L1027.46,311.288 L1062.46,315.288 L1062.46,348.674 A0,0 0 0 0 1062.46,348.674 L1386.153,348.674 A0,0 0 0 0 1386.153,348.674 L1386.153,283.898 L1376.153,273.898 L1062.46,273.898 A0,0 0 0 0 1062.46,273.898" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><path d="M1376.153,273.898 