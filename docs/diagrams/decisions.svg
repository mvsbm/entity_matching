<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1413px;height:487px;background:#FFFFFF;" width="1413px" height="487px" viewBox="0 0 1413 487" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="357.038" y="23.535" fill="#000" font-size="14" textLength="692.077" font-weight="700">LLD 3 · Decisions: jobs.decide.decide (nayose apply decisions --workspace …), scoring nothing</text></g><!--entity people--><g class="entity" data-qualified-name="people" id="ent0001" data-source-line="16"><ellipse cx="469.3" cy="51.488" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M469.3,59.488 L469.3,86.488 M456.3,67.488 L482.3,67.488 M469.3,86.488 L456.3,101.488 M469.3,86.488 L482.3,101.488" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="451.28" y="113.623" fill="#000" font-size="11" textLength="36.04">people</text></g><!--entity f_decided--><g class="entity" data-qualified-name="f_decided" id="ent0002" data-source-line="17"><path d="M200.55,178.438 L200.55,206.393 A2.5,2.5 0 0 0 203.05,208.893 L735.555,208.893 A2.5,2.5 0 0 0 738.055,206.393 L738.055,185.938 L728.055,175.938 L203.05,175.938 A2.5,2.5 0 0 0 200.55,178.438" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M728.055,175.938 L728.055,183.438 A2.5,2.5 0 0 0 730.555,185.938 L738.055,185.938" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="210.55" y="196.573" fill="#000" font-size="11" textLength="517.505">reviewed.parquet: review.parquet with decision filled in, or any file with &lt;id>_l, &lt;id>_r, decision</text></g><!--entity f_gold_in--><g class="entity" data-qualified-name="f_gold_in" id="ent0003" data-source-line="18"><path d="M773.22,178.438 L773.22,206.393 A2.5,2.5 0 0 0 775.72,208.893 L916.876,208.893 A2.5,2.5 0 0 0 919.376,206.393 L919.376,185.938 L909.376,175.938 L775.72,175.938 A2.5,2.5 0 0 0 773.22,178.438" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M909.376,175.938 L909.376,183.438 A2.5,2.5 0 0 0 911.876,185.938 L919.376,185.938" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="783.22" y="196.573" fill="#000" font-size="11" textLength="126.156">gold.parquet (the run's)</text></g><!--entity decide--><g class="entity" data-qualified-name="decide" id="ent0004" data-source-line="20"><rect x="275.18" y="268.898" width="764.246" height="110.686" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="285.18" y="289.533" fill="#000" font-size="11" textLength="36.899" font-weight="700">decide</text><text x="325.56" y="289.533" fill="#000" font-size="11" textLength="174.426">· O(D + touched clusters) + O(N)</text><text x="285.18" y="302.488" fill="#000" font-size="11" textLength="706.197">jobs.decide.decide · steps.job.start · engine.duckdb.connect · folder.run_lock · folder.lockable · folder.held · io.lock · io.object_store</text><text x="285.18" y="315.443" fill="#000" font-size="11" textLength="744.246">report.no_run · folder.finish_writes · folder.latest_decisions · folder.parts · source.decisions · source.file_facts · io.replace_text · io.patiently</text><text x="285.18" y="328.398" fill="#000" font-size="11" textLength="719.667">the checks, every ID a record of the run: source.known · each match pair merges its two clusters: cluster.merge, each cluster one node</text><text x="285.18" y="341.353" fill="#000" font-size="11" textLength="396.747">kinds kept, a merged customer's kind again: steps.cluster.customer_kinds</text><text x="285.18" y="354.308" fill="#000" font-size="11" textLength="213.651">the round it is decided in: folder.rounds</text><text x="285.18" y="367.264" fill="#000" font-size="11" textLength="654.854">folder.next_part · folder.stage · steps.write.log_entry · steps.write.run_config · io.config_hash · folder.log · io.code_version</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="23"><path d="M1074.46,286.848 L1074.46,320.238 L1039.82,324.238 L1074.46,328.238 L1074.46,361.624 A0,0 0 0 0 1074.46,361.624 L1398.153,361.624 A0,0 0 0 0 1398.153,361.624 L1398.153,296.848 L1388.153,286.848 L1074.46,286.848 A0,0 0 0 0 1074.46,286.848" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><path d="M1388.153,286.848 L1388.153,296.848 L1398.153,296.848 L1388.153,286.848" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><text x="1080.46" y="302.483" fill="#000" font-size="11" textLength="164.06">stops, with what to fix (exit 2):</text><text x="1080.46" y="315.438" fill="#000" font-size="11" textLength="302.693">the columns missing; a decision not match or no_match;</text><text x="1080.46" y="328.393" fill="#000" font-size="11" textLength="248.123">a pair decided both ways; an ID not in the run.</text><text x="1080.46" y="341.348" fill="#000" font-size="11" textLength="245.115">A no_match pair splits nothing now: a full run</text><text x="1080.46" y="354.303" fill="#000" font-size="11" textLength="194.912">on this folder never accepts it again.</text></g><!--entity f_gold_out--><g class="entity" data-qualified-name="f_gold_out" id="ent0008" data-source-line="30"><path d="M6,442.078 L6,470.033 A2.5,2.5 0 0 0 8.5,472.533 L422.105,472.533 A2.5,2.5 0 0 0 424.605,470.033 L424.605,449.578 L414.605,439.578 L8.5,439.578 A2.5,2.5 0 0 0 6,442.078" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M414.605,439.578 L414.605,447.078 A2.5,2.5 0 0 0 417.105,449.578 L424.605,449.578" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="16" y="460.213" fill="#000" font-size="11" textLength="398.605">gold.parquet: rewritten; a record joined only this way is resolved by review</text></g><!--entity f_kept--><g class="entity" data-qualified-name="f_kept" id="ent0009" data-source-line="31"><path d="M459.45,442.078 L459.45,470.033 A2.5,2.5 0 0 0 461.95,472.533 L852.647,472.533 A2.5,2.5 0 0 0 855.147,470.033 L855.147,449.578 L845.147,439.578 L461.95,439.578 A2.5,2.5 0 0 0 459.45,442.078" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M845.147,439.578 L845.147,447.078 A2.5,2.5 0 0 0 847.647,449.578 L855.147,449.578" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="469.45" y="460.213" fill="#000" font-size="11" textLength="375.697">decisions/part-n.parquet: kept for good; a full run applies them again</text></g><!--entity f_steps--><g class="entity" data-qualified-name="f_steps" id="ent0010" data-source-line="32"><path d="M890.52,442.078 L890.52,470.033 A2.5,2.5 0 0 0 893.02,472.533 L1059.576,472.533 A2.5,2.5 0 0 0 1062.076,470.033 L1062.076,449.578 L1052.076,439.578 L893.02,439.578 A2.5,2.5 0 0 0 890.52,442.078" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1052.076,439.578 L1052.076,447.078 A2.5,2.5 0 0 0 1054.576,449.578 L1062.076,449.578" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="900.52" y="460.213" fill="#000" font-size="11" textLength="151.556">steps.json: a decisions entry</text></g><!--link people to f_decided--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="34" data-link-type="dependency"><path d="M469.3,116.178 C469.3,136.198 469.3,155.168 469.3,170.588" style="stroke:#181818;stroke-width:1;" fill="none" id="people-to-f_decided"/><polygon points="469.3,175.588,473.3,166.588,469.3,170.588,465.3,166.588,469.3,175.588" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link f_decided to decide--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk12" data-source-line="35" data-link-type="dependency"><path d="M492.35,209.338 C513.83,224.168 542.996,244.307 574.056,265.757" style="stroke:#181818;stroke-width:1;" fill="none" id="f_decided-to-decide"/><polygon point