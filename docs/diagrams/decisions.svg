<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1448px;height:474px;background:#FFFFFF;" width="1448px" height="474px" viewBox="0 0 1448 474" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="401.123" y="23.535" fill="#000" font-size="14" textLength="638.907" font-weight="700">LLD 3 · Decisions: Run.decide (nayose apply decisions --workspace …), scoring nothing</text></g><!--entity people--><g class="entity" data-qualified-name="people" id="ent0001" data-source-line="16"><ellipse cx="469.3" cy="51.488" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M469.3,59.488 L469.3,86.488 M456.3,67.488 L482.3,67.488 M469.3,86.488 L456.3,101.488 M469.3,86.488 L482.3,101.488" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="451.28" y="113.623" fill="#000" font-size="11" textLength="36.04">people</text></g><!--entity f_decided--><g class="entity" data-qualified-name="f_decided" id="ent0002" data-source-line="17"><path d="M200.55,178.448 L200.55,206.403 A2.5,2.5 0 0 0 203.05,208.903 L735.555,208.903 A2.5,2.5 0 0 0 738.055,206.403 L738.055,185.948 L728.055,175.948 L203.05,175.948 A2.5,2.5 0 0 0 200.55,178.448" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M728.055,175.948 L728.055,183.448 A2.5,2.5 0 0 0 730.555,185.948 L738.055,185.948" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="210.55" y="196.583" fill="#000" font-size="11" textLength="517.505">reviewed.parquet: review.parquet with decision filled in, or any file with &lt;id>_l, &lt;id>_r, decision</text></g><!--entity f_gold_in--><g class="entity" data-qualified-name="f_gold_in" id="ent0003" data-source-line="18"><path d="M773.22,178.448 L773.22,206.403 A2.5,2.5 0 0 0 775.72,208.903 L916.876,208.903 A2.5,2.5 0 0 0 919.376,206.403 L919.376,185.948 L909.376,175.948 L775.72,175.948 A2.5,2.5 0 0 0 773.22,178.448" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M909.376,175.948 L909.376,183.448 A2.5,2.5 0 0 0 911.876,185.948 L919.376,185.948" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="783.22" y="196.583" fill="#000" font-size="11" textLength="126.156">gold.parquet (the run's)</text></g><!--entity decide--><g class="entity" data-qualified-name="decide" id="ent0004" data-source-line="20"><rect x="240.46" y="268.898" width="833.694" height="97.73" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="250.46" y="289.533" fill="#000" font-size="11" textLength="36.899" font-weight="700">decide</text><text x="290.84" y="289.533" fill="#000" font-size="11" textLength="174.426">· O(D + touched clusters) + O(N)</text><text x="250.46" y="302.488" fill="#000" font-size="11" textLength="813.694">Run.decide · report.no_run · folder.finish_writes · folder.latest_decisions · folder.parts · source.decisions · source.file_facts · io.replace_text · io.patiently</text><text x="250.46" y="315.443" fill="#000" font-size="11" textLength="719.667">the checks, every ID a record of the run: source.known · each match pair merges its two clusters: cluster.merge, each cluster one node</text><text x="250.46" y="328.398" fill="#000" font-size="11" textLength="347.048">kinds kept, a merged customer's kind again: run.customer_kinds</text><text x="250.46" y="341.353" fill="#000" font-size="11" textLength="213.651">the round it is decided in: folder.rounds</text><text x="250.46" y="354.308" fill="#000" font-size="11" textLength="372.754">folder.next_part · folder.stage · Run._log · folder.log · io.code_version</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="23"><path d="M1109.46,280.378 L1109.46,313.768 L1074.63,317.768 L1109.46,321.768 L1109.46,355.154 A0,0 0 0 0 1109.46,355.154 L1433.153,355.154 A0,0 0 0 0 1433.153,355.154 L1433.153,290.378 L1423.153,280.378 L1109.46,280.378 A0,0 0 0 0 1109.46,280.378" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><path d="M1423.153,280.378 L1423.153,290.378 L1433.153,290.378 L1423.153,280.378" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><text x="1115.46" y="296.013" fill="#000" font-size="11" textLength="164.06">stops, with what to fix (exit 2):</text><text x="1115.46" y="308.968" fill="#000" font-size="11" textLength="302.693">the columns missing; a decision not match or no_match;</text><text x="1115.46" y="321.923" fill="#000" font-size="11" textLength="248.123">a pair decided both ways; an ID not in the run.</text><text x="1115.46" y="334.878" fill="#000" font-size="11" textLength="245.115">A no_match pair splits nothing now: a full run</text><text x="1115.46" y="347.833" fill="#000" font-size="11" textLength="194.912">on this folder never accepts it again.</text></g><!--entity f_gold_out--><g class="entity" data-qualified-name="f_gold_out" id="ent0008" data-source-line="30"><path d="M6,429.128 L6,457.083 A2.5,2.5 0 0 0 8.5,459.583 L422.105,459.583 A2.5,2.5 0 0 0 424.605,457.083 L424.605,436.628 L414.605,426.628 L8.5,426.628 A2.5,2.5 0 0 0 6,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M414.605,426.628 L414.605,434.128 A2.5,2.5 0 0 0 417.105,436.628 L424.605,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="16" y="447.263" fill="#000" font-size="11" textLength="398.605">gold.parquet: rewritten; a record joined only this way is resolved by review</text></g><!--entity f_kept--><g class="entity" data-qualified-name="f_kept" id="ent0009" data-source-line="31"><path d="M459.45,429.128 L459.45,457.083 A2.5,2.5 0 0 0 461.95,459.583 L852.647,459.583 A2.5,2.5 0 0 0 855.147,457.083 L855.147,436.628 L845.147,426.628 L461.95,426.628 A2.5,2.5 0 0 0 459.45,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M845.147,426.628 L845.147,434.128 A2.5,2.5 0 0 0 847.647,436.628 L855.147,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="469.45" y="447.263" fill="#000" font-size="11" textLength="375.697">decisions/part-n.parquet: kept for good; a full run applies them again</text></g><!--entity f_steps--><g class="entity" data-qualified-name="f_steps" id="ent0010" data-source-line="32"><path d="M890.52,429.128 L890.52,457.083 A2.5,2.5 0 0 0 893.02,459.583 L1059.576,459.583 A2.5,2.5 0 0 0 1062.076,457.083 L1062.076,436.628 L1052.076,426.628 L893.02,426.628 A2.5,2.5 0 0 0 890.52,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1052.076,426.628 L1052.076,434.128 A2.5,2.5 0 0 0 1054.576,436.628 L1062.076,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="900.52" y="447.263" fill="#000" font-size="11" textLength="151.556">steps.json: a decisions entry</text></g><!--link people to f_decided--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="34" data-link-type="dependency"><path d="M469.3,116.188 C469.3,136.208 469.3,155.178 469.3,170.588" style="stroke:#181818;stroke-width:1;" fill="none" id="people-to-f_decided"/><polygon points="469.3,175.588,473.3,166.588,469.3,170.588,465.3,166.588,469.3,175.588" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link f_decided to decide--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk12" data-source-line="35" data-link-type="dependency"><path d="M493.5,209.298 C516.3,224.258 547.5,244.725 579.54,265.755" style="stroke:#181818;stroke-width:1;" fill="none" id="f_decided-to-decide"/><polygon points="583.72,268.498,578.391,260.216,579.54,265.755,574.001,266.904,583.72,268.498" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link f_gold_in to decide--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk13" 