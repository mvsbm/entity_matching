· steps.write.log_entry · steps.write.run_config · io.config_hash · folder.log · io.code_version</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="23"><path d="M1563.88,286.858 L1563.88,313.768 L1529.13,317.768 L1563.88,321.768 L1563.88,348.679 A0,0 0 0 0 1563.88,348.679 L1887.573,348.679 A0,0 0 0 0 1887.573,348.679 L1887.573,296.858 L1877.573,286.858 L1563.88,286.858 A0,0 0 0 0 1563.88,286.858" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><path d="M1877.573,286.858 L1877.573,296.858 L1887.573,296.858 L1877.573,286.858" style="stroke:#65717E;stroke-width:0.5;" fill="#FFF"/><text x="1569.88" y="302.493" fill="#000" font-size="11" textLength="164.06">stops, with what to fix (exit 2):</text><text x="1569.88" y="315.448" fill="#000" font-size="11" textLength="302.693">the columns missing; a decision not match or no_match;</text><text x="1569.88" y="328.403" fill="#000" font-size="11" textLength="248.123">a pair decided both ways; an ID not in the run.</text><text x="1569.88" y="341.358" fill="#000" font-size="11" textLength="265.106">A later no_match parts what only that pair joined.</text></g><!--entity f_gold_out--><g class="entity" data-qualified-name="f_gold_out" id="ent0008" data-source-line="29"><path d="M6,429.128 L6,457.083 A2.5,2.5 0 0 0 8.5,459.583 L398.956,459.583 A2.5,2.5 0 0 0 401.456,457.083 L401.456,436.628 L391.456,426.628 L8.5,426.628 A2.5,2.5 0 0 0 6,429.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M391.456,426.628 L391.456,434.128 A2.5,2.5 0 0 0 393.956,436.628 L401.456,436.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="16" y="447.263" fill="#000" font-size="11" textLength="375.456">gold.parquet: rewritten; a record a decision joins is resolved by review</text></g><!--entity f_kept--><g class="entity" data-qualified-name="f_kept" id="ent0009" data-source-line="30"><path d="M436.88,429.128 L436.88,457.083 A2.5,2.5 0 0 0 439.38,459.583 L830.077,459.583 A2.5,2.