6.773" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="810.453" fill="#000" font-size="11" textLength="219.705" font-weight="700">every chunk of the load (LLD 1, step 1)</text></g><!--entity f_ref--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.f_ref" id="ent0002" data-source-line="17"><path d="M225.7,76.988 L225.7,104.943 A2.5,2.5 0 0 0 228.2,107.443 L567.791,107.443 A2.5,2.5 0 0 0 570.291,104.943 L570.291,84.488 L560.291,74.488 L228.2,74.488 A2.5,2.5 0 0 0 225.7,76.988" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M560.291,74.488 L560.291,81.988 A2.5,2.5 0 0 0 562.791,84.488 L570.291,84.488" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="235.7" y="95.123" fill="#000" font-size="11" textLength="324.591">data/reference/individual.json · data/reference/registry.json</text></g><!--entity f_gen--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.f_gen" id="ent0003" data-source-line="18"><path d="M651.91,176.428 L651.91,204.383 A2.5,2.5 0 0 0 654.41,206.883 L939.587,206.883 A2.5,2.5 0 0 0 942.087,204.383 L942.087,183.928 L932.087,173.928 L654.41,173.928 A2.5,2.5 0 0 0 651.91,176.428" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M932.087,173.928 L932.087,181.428 A2.5,2.5 0 0 0 934.587,183.928 L942.087,183.928" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="661.91" y="194.563" fill="#000" font-size="11" textLength="270.177">config/generator.toml: kana_confusions, branches</text></g><!--entity split--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.split" id="ent0004" data-source-line="19"><rect x="179.26" y="167.448" width="437.49" height="45.91" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="189.26" y="188.083" fill="#000" font-size="11" textLength="146.803">generate.name_model_split</text><text x="189.26" y="201.038" fill="#000" font-size="11" textLength="417.49">half the personas; the companies of Miyagi and Okayama (Fukuoka's held out)</text></g><!--entity names--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.names" id="ent0005" data-source-line="20"><rect x="241.27" y="273.358" width="425.469" height="45.91" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="251.27" y="293.993" fill="#000" font-size="11" textLength="161.068">generate.kind_training_names</text><text x="251.27" y="306.948" fill="#000" font-size="11" textLength="405.469">every company as banks write it (generate.bank_name), every persona twice</text></g><!--entity model--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.model" id="ent0006" data-source-line="21"><rect x="252.79" y="379.268" width="402.422" height="58.865" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="262.79" y="399.903" fill="#000" font-size="11" textLength="236.817">generate.train_name_model · NameModel.fit</text><text x="262.79" y="412.858" fill="#000" font-size="11" textLength="382.422">logistic regression on the character n-grams of kind.text, n from 1 to 3</text><text x="262.79" y="425.813" fill="#000" font-size="11" textLength="378.377">(folded, no spaces, no legal form); scored in DuckDB: NameModel.logit</text></g><!--entity f_cache--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.f_cache" id="ent0007" data-source-line="22"><path d="M296.55,500.628 L296.55,541.538 A2.5,2.5 0 0 0 299.05,544.038 L608.955,544.038 A2.5,2.5 0 0 0 611.455,541.538 L611.455,508.128 L601.455,498.128 L299.05,498.128 A2.5,2.5 0 0 0 296.55,500.628" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M601.455,498.128 L601.455,505.628 A2.5,2.5 0 0 0 603.955,508.128 L611.455,508.128" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="306.55" y="518.763" fill="#000" font-size="11" textLength="204.257">config/kind_names.npz, tracked in git</text><text x="306.55" y="531.718" fill="#000" font-size="11" textLength="294.905">under kind.name_key: the settings it was trained under</text></g><!--entity classify--><g class="entity" data-qualified-name="every chunk of the load .LLD 1. step 1..classify" id="ent0011" data-source-line="29"><rect x="21.94" y="828.818" width="864.11" height="84.775" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="31.94" y="849.453" fill="#000" font-size="11" textLength="216.949">standardize.prepare → Classifier.classify</text><text x="31.94" y="862.408" fill="#000" font-size="11" textLength="844.11">kind: the engine's sure call (a legal form written, or a name past name_line either way, never a person's against a company flag), else the flag, else 0 not sure;</text><text x="31.94" y="875.363" fill="#000" font-size="11" textLength="162.771">with trust_flag, the flag as it is</text><text x="31.94" y="888.318" fill="#000" font-size="11" textLength="633.617">kind_p, kind_by (engine or flag), name_p, kind_flagged (sure against the flag: matched as the engine says), kind_name</text><text x="31.94" y="901.273" fill="#000" font-size="11" textLength="704.661">the name routed by its kind: person_name and full_name for a person, company_name for a company; not sure, where kind_p leans</text></g><!--entity records--><g class="entity" data-qualified-name="every chunk of the load .LLD 1. step 1..records" id="ent0012" data-source-line="30"><path d="M423.97,983.588 C423.97,973.588 453.996,973.588 453.996,973.588 C453.996,973.588 484.022,973.588 484.022,983.588 L484.022,1005.543 C484.022,1015.543 453.996,1015.543 453.996,1015.543 C453.996,1015.543 423.97,1015.543 423.97,1005.543 L423.97,983.588" style="stroke:#2C6DB3;stroke-width:0.5;" fill="#E8F1FB"/><path d="M423.97,983.588 C423.97,993.588 453.996,993.588 453.996,993.588 C453.996,993.588 484.022,993.588 484.022,983.588" style="stroke:#2C6DB3;stroke-width:0.5;" fill="none"/><text x="433.97" y="1008.223" fill="#000" font-size="11" textLength="40.052">records</text></g><!--entity load--><g class="entity" data-qualified-name="load" id="ent0008" data-source-line="24"><rect x="304.62" y="604.038" width="298.765" height="45.91" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.62" y="624.673" fill="#000" font-size="11" textLength="278.765">kind.name_model: every run loads it, never trains it;</text><text x="314.62" y="637.628" fill="#000" font-size="11" textLength="242.526">under other settings it stops, with what to fix</text></g><!--entity fit--><g class="entity" data-qualified-name="fit" id="ent0009" data-source-line="26"><rect x="267.42" y="709.948" width="373.166" height="58.865" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="277.42" y="730.583" fill="#000" font-size="11" textLength="73.976">kind.classifier</text><text x="277.42" y="743.538" fill="#000" font-size="11" textLength="353.166">the name model, the legal forms (kind.legal) and the flag's values;</text><text x="277.42" y="756.493" fill="#000" font-size="11" textLength="165.714">[kind] name_line and trust_flag</text></g><!--entity gold--><g class="entity" data-qualified-name="gold" id="ent0013" data-source-line="33"><rect x="275.52" y="1075.548" width="356.956" height="58.865" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="285.52" y="1096.183" fill="#000" font-size="11" textLength="282.342">steps.cluster.gold_sql · steps.cluster.customer_kinds</text><text x="285.52" y="1109.138" fill="#000" font-size="11" textLength="336.956">each record's kind; each customer's: 2 if any record is surely 2,</text><text x="285.52" y="1122.093" fill="#000" font-size="11" textLength="273.802">1 if none leans company and one is surely 1, else 0</text></g><!--entity f_gold--><g class="entity" data-qualified-name="f_gold" id="ent0014" data-source-line="34"><path d="M409.65,1196.908 L409.65,1224.863 A2.5,2.5 0 0 0 412.15,1227.363 L495.841,1227.363 A2.5,2.5 0 0 0 498.341,1224.863 L498.341,1204.408 L488.341,1194.408 L412.15,1194.408 A2.5,2.5 0 0 0 409.65,1196.908" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M488.341,1194.408 L488.341,1201.908 A2.5,2.5 0 0 0 490.841,1204.408 L498.341,1204.408" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="419.65" y="1215.043" fill="#000" font-size="11" textLength="68.691">gold.parquet</text></g><!--link f_ref to split--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk15" data-source-line="36" data-link-type="dependency"><path d="M398,107.618 C398,123.758 398,144.068 398,162.248" style="stroke:#181818;stroke-width:1;" fill="none" id="f_ref-to-split"/><polygon points="398,167.248,402,158.248,398,162.248,394,158.248,398,167.248" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link split to names--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk16" data-source-line="37" data-link-type="dependency"><path d="M410.01,213.688 C419.46,231.228 430.186,251.138 439.636,268.658" style="stroke:#181818;stroke-width:1;" fill="none" id="split-to-names"/><polygon points="442.01,273.058,441.258,263.238,439.636,268.658,434.217,267.036,442.01,273.058" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link f_gen to names--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk17" data-source-line="38" data-link-type="dependency"><path d="M744.53,207.298 C686.73,224.808 598.125,251.648 532.875,271.418" style="stroke:#181818;strok