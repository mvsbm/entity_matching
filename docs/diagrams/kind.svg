083" fill="#000" font-size="11" textLength="146.803">generate.name_model_split</text><text x="104.26" y="201.038" fill="#000" font-size="11" textLength="417.49">half the personas; the companies of Miyagi and Okayama (Fukuoka's held out)</text></g><!--entity names--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.names" id="ent0005" data-source-line="20"><rect x="171.27" y="273.358" width="425.469" height="45.91" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="181.27" y="293.993" fill="#000" font-size="11" textLength="161.068">generate.kind_training_names</text><text x="181.27" y="306.948" fill="#000" font-size="11" textLength="405.469">every company as banks write it (generate.bank_name), every persona twice</text></g><!--entity model--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.model" id="ent0006" data-source-line="21"><rect x="182.79" y="379.268" width="402.422" height="58.865" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="192.79" y="399.903" fill="#000" font-size="11" textLength="236.817">generate.train_name_model · NameModel.fit</text><text x="192.79" y="412.858" fill="#000" font-size="11" textLength="382.422">logistic regression on the character n-grams of kind.text, n from 1 to 3</text><text x="192.79" y="425.813" fill="#000" font-size="11" textLength="378.377">(folded, no spaces, no legal form); scored in DuckDB: NameModel.logit</text></g><!--entity f_cache--><g class="entity" data-qualified-name="the name model. public data only. trained once by scripts.train_name_model.py. at design time.f_cache" id="ent0007" data-source-line="22"><path d="M226.55,500.628 L226.55,541.538 A2.5,2.5 0 0 0 229.05,544.038 L538.955,544.038 A2.5,2.5 0 0 0 541.455,541.538 L541.455,508.128 L531.455,498.128 L229.05,498.128 A2.5,2.5 0 0 0 2