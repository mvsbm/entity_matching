<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1761px;height:494px;background:#FFFFFF;" width="1761px" height="494px" viewBox="0 0 1761 494" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="598.972" y="23.535" fill="#000" font-size="14" textLength="556.972" font-weight="700">Start here: one file of customer records in, one ID per person or company out</text></g><!--entity input--><g class="entity" data-qualified-name="input" id="ent0001" data-source-line="13"><path d="M17.15,269.058 L17.15,312.324 A2.5,2.5 0 0 0 19.65,314.824 L211.269,314.824 A2.5,2.5 0 0 0 213.769,312.324 L213.769,276.558 L203.769,266.558 L19.65,266.558 A2.5,2.5 0 0 0 17.15,269.058" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M203.769,266.558 L203.769,274.058 A2.5,2.5 0 0 0 206.269,276.558 L213.769,276.558" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="27.15" y="288.16" fill="#000" font-size="12" textLength="110.549" font-weight="700">Customer records</text><text x="27.15" y="302.293" fill="#000" font-size="12" textLength="176.619">Parquet, columns of any name</text></g><!--entity load--><g class="entity" data-qualified-name="load" id="ent0002" data-source-line="14"><rect x="499.92" y="297.428" width="160.01" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="509.92" y="319.03" fill="#000" font-size="12" textLength="29.648" font-weight="700">Load</text><text x="509.92" y="333.163" fill="#000" font-size="12" textLength="136.482">read and check the file;</text><text x="509.92" y="347.295" fill="#000" font-size="12" textLength="140.01">write each fact one way;</text><text x="509.92" y="361.428" fill="#000" font-size="12" textLength="112.576">person or company</text></g><!--entity rules--><g class="entity" data-qualified-name="rules" id="ent0003" data-source-line="15"><rect x="720.93" y="224.428" width="170.844" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="730.93" y="246.03" fill="#000" font-size="12" textLength="33.879" font-weight="700">Rules</text><text x="730.93" y="260.163" fill="#000" font-size="12" textLength="101.479">the certain cases:</text><text x="730.93" y="274.295" fill="#000" font-size="12" textLength="134.273">the same ID and name,</text><text x="730.93" y="288.428" fill="#000" font-size="12" textLength="150.844">name, address and phone</text></g><!--entity model--><g class="entity" data-qualified-name="model" id="ent0004" data-source-line="16"><rect x="952.77" y="212.428" width="196.127" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="962.77" y="234.03" fill="#000" font-size="12" textLength="65.332" font-weight="700">The model</text><text x="962.77" y="248.163" fill="#000" font-size="12" textLength="160.23">list the pairs worth scoring;</text><text x="962.77" y="262.295" fill="#000" font-size="12" textLength="176.127">score each in bits of evidence,</text><text x="962.77" y="276.428" fill="#000" font-size="12" textLength="151.758">learned from the file itself</text></g><!--entity cluster--><g class="entity" data-qualified-name="cluster" id="ent0005" data-source-line="17"><rect x="1257.9" y="173.488" width="147.629" height="62.398" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1267.9" y="195.09" fill="#000" font-size="12" textLength="44.467" font-weight="700">Cluster</text><text x="1267.9" y="209.223" fill="#000" font-size="12" textLength="125.291">accept the sure pairs;</text><text x="1267.9" y="223.355" fill="#000" font-size="12" textLength="127.629">join pairs into entities</text></g><!--entity gold--><g class="entity" data-qualified-name="gold" id="ent0006" data-source