<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1939px;height:285px;background:#FFFFFF;" width="1939px" height="285px" viewBox="0 0 1939 285" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="687.544" y="23.535" fill="#000" font-size="14" textLength="556.972" font-weight="700">Start here: one file of customer records in, one ID per person or company out</text></g><!--entity input--><g class="entity" data-qualified-name="input" id="ent0001" data-source-line="13"><path d="M41.27,45.988 L41.27,89.254 A2.5,2.5 0 0 0 43.77,91.754 L235.389,91.754 A2.5,2.5 0 0 0 237.889,89.254 L237.889,53.488 L227.889,43.488 L43.77,43.488 A2.5,2.5 0 0 0 41.27,45.988" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M227.889,43.488 L227.889,50.988 A2.5,2.5 0 0 0 230.389,53.488 L237.889,53.488" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="51.27" y="65.09" fill="#000" font-size="12" textLength="110.549" font-weight="700">Customer records</text><text x="51.27" y="79.223" fill="#000" font-size="12" textLength="176.619">Parquet, columns of any name</text></g><!--entity load--><g class="entity" data-qualified-name="load" id="ent0002" data-source-line="14"><rect x="485.17" y="78.358" width="160.01" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="495.17" y="99.96" fill="#000" font-size="12" textLength="29.648" font-weight="700">Load</text><text x="495.17" y="114.093" fill="#000" font-size="12" textLength="136.482">read and check the file;</text><text x="495.17" y="128.225" fill="#000" font-size="12" textLength="140.01">write each fact one way;</text><text x="495.17" y="142.358" fill="#000" font-size="12" textLength="112.576">person or company</text></g><!--entity rules--><g class="entity" data-qualified-name="rules" id="ent0003" data-source-line="15"><rect x="706.18" y="78.358" width="170.844" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="716.18" y="99.96" fill="#000" font-size="12" textLength="33.879" font-weight="700">Rules</text><text x="716.18" y="114.093" fill="#000" font-size="12" textLength="101.479">the certain cases:</text><text x="716.18" y="128.225" fill="#000" font-size="12" textLength="134.273">the same ID and name,</text><text x="716.18" y="142.358" fill="#000" font-size="12" textLength="150.844">name, address and phone</text></g><!--entity model--><g class="entity" data-qualified-name="model" id="ent0004" data-source-line="16"><rect x="938.02" y="78.358" width="196.127" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="948.02" y="99.96" fill="#000" font-size="12" textLength="65.332" font-weight="700">The model</text><text x="948.02" y="114.093" fill="#000" font-size="12" textLength="160.23">list the pairs worth scoring;</text><text x="948.02" y="128.225" fill="#000" font-size="12" textLength="176.127">score each in bits of evidence,</text><text x="948.02" y="142.358" fill="#000" font-size="12" textLength="151.758">learned from the file itself</text></g><!--entity cluster--><g class="entity" data-qualified-name="cluster" id="ent0005" data-source-line="17"><rect x="1567.18" y="78.358" width="162.09" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1577.18" y="99.96" fill="#000" font-size="12" textLength="44.467" font-weight="700">Cluster</text><text x="1577.18" y="114.093" fill="#000" font-size="12" textLength="134.959">join the records people</text><text x="1577.18" y="128.225" fill="#000" font-size="12" textLength="74.883">said are one;</text><text x="1577.18" y="142.358" fill="#000" font-size="12" textLength="142.09">nothing merges by itself</text></g><!--entity gold--><g class="entity" data-qualified-name="gold" id="ent0006" data-source-line="18"><path d="M1790.27,87.928 L1790.27,145.327 A2.5,2.5 0 0 0 1792.77,147.827 L1921.559,147.827 A2.5,2.5 0 0 0 1924.059,145.327 L1924.059,95.428 L1914.059,85.428 L1792.77,85.428 A2.5,2.5 0 0 0 1790.27,87.928" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1914.059,85.428 L1914.059,92.928 A2.5,2.5 0 0 0 1916.559,95.428 L1924.059,95.428" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="1800.27" y="107.03" fill="#000" font-size="12" textLength="78.586" font-weight="700">gold.parquet</text><text x="1800.27" y="121.163" fill="#000" font-size="12" textLength="113.789">each record's entity</text><text x="1800.27" y="135.295" fill="#000" font-size="12" textLength="68.777">and its kind</text></g><!--entity sheets--><g class="entity" data-qualified-name="sheets" id="ent0007" data-source-line="19"><path d="M1195.15,87.928 L1195.15,145.327 A2.5,2.5 0 0 0 1197.65,147.827 L1348.365,147.827 A2.5,2.5 0 0 0 1350.865,145.327 L1350.865,95.428 L1340.865,85.428 L1197.65,85.428 A2.5,2.5 0 0 0 1195.15,87.928" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><path d="M1340.865,85.428 L1340.865,92.928 A2.5,2.5 0 0 0 1343.365,95.428 L1350.865,95.428" style="stroke:#B07D00;stroke-width:0.5;" fill="#FFF8E6"/><text x="1205.15" y="107.03" fill="#000" font-size="12" textLength="75.785" font-weight="700">A match run</text><text x="1205.15" y="121.163" fill="#000" font-size="12" textLength="135.715">the pairs at a threshold</text><text x="1205.15" y="135.295" fill="#000" font-size="12" textLength="60.404">people set</text></g><!--entity people--><g class="entity" data-qualified-name="people" id="ent0008" data-source-line="20"><ellipse cx="1431.518" cy="88.058" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1431.518,96.058 L1431.518,123.058 M1418.518,104.058 L1444.518,104.058 M1431.518,123.058 L1418.518,138.058 M1431.518,123.058 L1444.518,1