ntity rules--><g class="entity" data-qualified-name="rules" id="ent0003" data-source-line="15"><rect x="769.18" y="126.428" width="170.844" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="779.18" y="148.03" fill="#000" font-size="12" textLength="33.879" font-weight="700">Rules</text><text x="779.18" y="162.163" fill="#000" font-size="12" textLength="101.479">the certain cases:</text><text x="779.18" y="176.295" fill="#000" font-size="12" textLength="134.273">the same ID and name,</text><text x="779.18" y="190.428" fill="#000" font-size="12" textLength="150.844">name, address and phone</text></g><!--entity model--><g class="entity" data-qualified-name="model" id="ent0004" data-source-line="16"><rect x="1001.02" y="126.428" width="196.127" height="76.531" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1011.02" y="148.03" fill="#000" font-size="12" textLength="65.332" font-weight="700">The model</text><text x="1011.02" y="162.163" fill="#000" font-size="12" textLength="160.23">list the pairs worth scoring;</text><text x="1011.02" y="176.295" fill="#000" font-size="12" textLength="176.127">score each in bits of evidence,</text><text x="1011.02" y="190.428" fill="#000" font-size="12" textLength="151.758">learned from the file itself</text></g><!--entity cluster--><g class="entity" data-qualified-name="cluster" id="ent0005" data-source-line="17"><rect x="1258.15" y="133.488" width="147.629" height="62.398" fill="#F4F6F8" style="stroke:#65717E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1268.15" y="155.09" fill="#000" font-size="12" textLength="44.467" font-weight="700">Cluster</text><text x="1268.15" y="169.223" fill="#000" font-size="12" textLength="125.291">accept the sure pairs;</text><text x="1268.15" y="183.355" fill="#000" font-size="12" textLength="127.629">join pairs into entities</text></g><!--entity gold--><g class="entity" data-qualified-name="gold" id="ent0006" data-sou